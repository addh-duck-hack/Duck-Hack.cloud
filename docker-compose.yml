# Nombre del proyecto Compose. Se toma de STORE_SLUG (archivo .env en esta
# carpeta) en vez de la carpeta, para poder clonar el repo varias veces y
# correr una tienda por clon sin colisiones. Cada clon define su propio
# STORE_SLUG en .env (ver .env.example). La tienda que ya estaba funcional
# usa STORE_SLUG=duck-hack para conservar sus nombres/volumen actuales.
name: ${STORE_SLUG:?Falta STORE_SLUG - copia .env.example a .env y ponle un slug unico por tienda}

services:
  tacita.frontend-admin:
    build: ./frontend-admin
    container_name: ${STORE_SLUG}.frontend-admin
    # nginx sin privilegios -> escucha en 8080 (antes 80).
    # En Nginx Proxy Manager hay que cambiar el "Forward Port" de este host a 8080.
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - npm
      - frontend-admin-net

  tacita.frontend-user:
    build: ./frontend-user
    container_name: ${STORE_SLUG}.frontend-user
    # nginx sin privilegios -> escucha en 8080 (antes 80).
    # En Nginx Proxy Manager hay que cambiar el "Forward Port" de este host a 8080.
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - npm
      - frontend-user-net

  tacita.backend:
    # Contexto = raíz del repo (no ./backend): server.js importa
    # @duck-hack/core-api desde packages/core-api, así que el build necesita
    # ver el workspace completo. Ver backend/Dockerfile para el detalle.
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ${STORE_SLUG}.backend
    expose:
      - "5000"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - npm
      - backend-net
    # Volumen nombrado para que las imágenes subidas (logos, fotos de
    # clientes/equipo, productos) sobrevivan a "docker compose up --build":
    # sin esto viven en la capa escribible del contenedor, que se descarta
    # por completo cada vez que se recrea el contenedor con una imagen nueva.
    # UPLOADS_DIR en backend/.env debe apuntar a esta misma ruta (/app/uploads,
    # el valor por defecto en backend/.env.example) para que coincida.
    volumes:
      - backend-uploads:/app/uploads

networks:
  # Redes internas namespaced por tienda (STORE_SLUG) para que cada clon del
  # repo tenga las suyas y no choquen entre sí.
  frontend-admin-net:
    name: ${STORE_SLUG}.frontend-admin-net
    driver: bridge
  frontend-user-net:
    name: ${STORE_SLUG}.frontend-user-net
    driver: bridge
  backend-net:
    name: ${STORE_SLUG}.backend-net
    driver: bridge
  npm:
    external: true

volumes:
  # Un volumen de uploads por tienda. STORE_SLUG=duck-hack mantiene el nombre
  # histórico (duck-hack.backend-uploads) para no perder las imágenes ya subidas.
  backend-uploads:
    name: ${STORE_SLUG}.backend-uploads
