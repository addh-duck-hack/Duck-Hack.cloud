# Nombre del proyecto Compose. Se toma de STORE_SLUG (archivo .env en esta
# carpeta) en vez de la carpeta, para poder clonar el repo varias veces y
# correr una tienda por clon sin colisiones. Cada clon define su propio
# STORE_SLUG en .env (ver .env.example).
name: ${STORE_SLUG:?Falta STORE_SLUG - copia .env.example a .env y ponle un slug unico por tienda}

# IMPORTANTE (multi-tienda en un mismo host):
# Las CLAVES de servicio de abajo (frontend-admin/frontend-user/backend) son
# genéricas a propósito. Docker Compose registra la clave de servicio como alias
# DNS en cada red del contenedor, incluida la red externa compartida `npm`. Si
# dos tiendas usan claves de servicio iguales (antes eran `duck-hack.*`), ese
# alias en `npm` resuelve a los contenedores de AMBAS tiendas y Nginx Proxy
# Manager hace round-robin entre ellas (síntoma: el admin de una tienda sirve el
# bundle/API de otra, 404 intermitentes en /assets).
#
# Por eso en NPM el "Forward Hostname" de cada Proxy Host debe ser el
# `container_name` / alias por-tienda: `${STORE_SLUG}.frontend-admin`,
# `${STORE_SLUG}.frontend-user`, `${STORE_SLUG}.backend` (únicos por tienda),
# NUNCA los nombres genéricos `frontend-admin` / `backend`.

services:
  frontend-admin:
    build: ./frontend-admin
    container_name: ${STORE_SLUG}.frontend-admin
    # nginx sin privilegios -> escucha en 8080 (antes 80).
    # En Nginx Proxy Manager el "Forward Port" de este host es 8080.
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      npm:
        aliases:
          - ${STORE_SLUG}.frontend-admin
      frontend-admin-net: {}

  frontend-user:
    build: ./frontend-user
    container_name: ${STORE_SLUG}.frontend-user
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      npm:
        aliases:
          - ${STORE_SLUG}.frontend-user
      frontend-user-net: {}

  backend:
    # Contexto = raíz del repo (no ./backend): server.js importa
    # @duck-hack/core-api desde packages/core-api, así que el build necesita
    # ver el workspace completo. Ver backend/Dockerfile para el detalle.
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ${STORE_SLUG}.backend
    # Config del backend en RUNTIME (no horneada en la imagen). Así un cambio en
    # backend/.env se aplica con `docker compose up -d` (recrea el contenedor),
    # sin `--build` y sin que el caché de capas de Docker esconda el cambio. El
    # archivo tiene que existir en esta carpeta al hacer `up` (mismo requisito
    # que antes). server.js sigue usando dotenv para desarrollo local fuera de
    # Docker; dotenv no pisa lo que ya viene de env_file.
    env_file:
      - ./backend/.env
    expose:
      - "5000"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      npm:
        aliases:
          - ${STORE_SLUG}.backend
      backend-net: {}
    # Volumen nombrado para que las imágenes subidas (logos, fotos de
    # clientes/equipo, productos) sobrevivan a "docker compose up --build":
    # sin esto viven en la capa escribible del contenedor, que se descarta
    # por completo cada vez que se recrea el contenedor con una imagen nueva.
    # UPLOADS_DIR en backend/.env debe apuntar a esta misma ruta (/app/uploads,
    # el valor por defecto en backend/.env.example) para que coincida.
    volumes:
      - backend-uploads:/app/uploads

networks:
  # Redes internas namespaced por tienda (STORE_SLUG) para que cada clon del
  # repo tenga las suyas y no choquen entre sí.
  frontend-admin-net:
    name: ${STORE_SLUG}.frontend-admin-net
    driver: bridge
  frontend-user-net:
    name: ${STORE_SLUG}.frontend-user-net
    driver: bridge
  backend-net:
    name: ${STORE_SLUG}.backend-net
    driver: bridge
  npm:
    external: true

volumes:
  # Un volumen de uploads por tienda.
  backend-uploads:
    name: ${STORE_SLUG}.backend-uploads
