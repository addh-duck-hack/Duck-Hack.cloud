        orden), category (`category`) o latest (más recientes). En
        GET /api/app-home/public trae además `products` ya resueltos.
      properties:
        id:
          type: string
          maxLength: 40
        type:
          type: string
          enum: [productCarousel]
        visible:
          type: boolean
          default: true
        title:
          type: string
          maxLength: 120
        source:
          type: string
          enum: [manual, category, latest]
          default: latest
        productIds:
          type: array
          maxItems: 20
          items:
            type: string
        category:
          type: string
          maxLength: 80
          description: Slug de la categoría (source category).
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
        products:
          type: array
          readOnly: true
          items:
            $ref: "#/components/schemas/PublicProduct"
