          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/orders/public:
    post:
      tags: [Orders]
      summary: Checkout público (storefront)
      operationId: createPublicOrder
      description: >
        Sin autenticación obligatoria, rate-limited (10 min / 6 intentos por
        IP — `429 RATE_LIMIT_CHECKOUT_EXCEEDED`). Acepta opcionalmente un
        header `Authorization: Bearer <token>` de un `customer` ya logueado
        (por ejemplo si inició sesión o se registró durante el checkout): si
        el token es válido y de rol `customer`, el pedido queda vinculado a
        esa cuenta (`customer` en la respuesta); si no viene, es inválido,
        expiró o no es de rol `customer`, el pedido se crea igual como
        invitado — nunca responde error por esto. `customer` enviado en el
        body siempre se ignora (ver PublicCheckoutRequest). Sin pasarela de
        pago: el pedido siempre entra `pending` y la tienda confirma el
        pago/entrega a mano según `paymentMethod`. Los precios se recalculan
        server-side desde el catálogo (nunca del payload) y solo se aceptan
        productos con `isActive: true` — `400 PRODUCT_UNAVAILABLE` si alguno
        no lo está. Por producto (sumando sus renglones) no se aceptan más
        unidades que `StoreConfig.maxUnitsPerProduct` — `400
        PURCHASE_LIMIT_EXCEEDED`, arriba de eso es venta de mayoreo por
        contacto; vacío o 0 = sin tope; el tope suma todas las variantes del
        producto — ni más de las que hay en inventario (por variante, si el
        producto tiene) — `409 INSUFFICIENT_STOCK`. Producto con variantes sin
        `variant` en el renglón = `400 VARIANT_REQUIRED`; el precio es el de la
        variante. El inventario solo se consulta; se descuenta
        al confirmar el pedido. El envío (`shippingCost`) se calcula con
        `StoreConfig.shipping`: se cobra `cost` salvo que la tienda no cobre
        envío, que el subtotal de productos llegue a `freeFrom`, o que el
        pedido sea `pickup`; se suma al `total`. Envía correo de confirmación al cliente y aviso a la
        tienda (best-effort; un fallo de correo no impide crear el pedido).
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicCheckoutRequest"
      responses:
        "201":
          description: Pedido creado (estado `pending`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  order:
                    $ref: "#/components/schemas/Order"
                  orderAccessToken:
                    type: string
                    description: >-
                      JWT de acceso a ESTE pedido (tokenType order_access, vence con
                      JWT_ORDER_ACCESS_EXPIRES_IN, default 30d). El invitado lo manda en
                      el header X-Order-Token para subir su comprobante de pago. No es
                      una sesión: no sirve como access token.
        "400":
          description: >-
            Validación fallida, producto no disponible (PRODUCT_UNAVAILABLE) o
            más unidades de un producto que StoreConfig.maxUnitsPerProduct
            (PURCHASE_LIMIT_EXCEEDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Alguno de los productos referenciados no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Se piden más unidades de las que hay en inventario (INSUFFICIENT_STOCK)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Demasiados intentos de pedido desde la misma IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/orders/mine:
    get:
      tags: [Orders]
      summary: Mis pedidos (autoservicio del cliente)
      operationId: listMyOrders
      description: >
        Cualquier rol autenticado (no exige staff, a diferencia de GET /api/orders)
        — se autolimita a lo propio: pedidos con `customer` igual a la cuenta que
        hace la llamada, más los que se hicieron como invitado con el mismo
        correo de esa cuenta (para que aparezcan compras viejas sin cuenta
        vinculada). Usado por "Mi cuenta > Mis pedidos" en frontend-user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Listado de pedidos propios
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/orders:
    get:
      tags: [Orders]
      summary: Listar pedidos
      operationId: listOrders
      description: Lectura permitida a cualquier rol de staff.
      security:
        - bearerAuth: []
