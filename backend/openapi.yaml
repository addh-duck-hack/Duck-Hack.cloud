    AppHomeCategoryGridSection:
      type: object
      description: Cuadrícula de accesos a categorías del catálogo.
      properties:
        id:
          type: string
          maxLength: 40
        type:
          type: string
          enum: [categoryGrid]
        visible:
          type: boolean
          default: true
        title:
          type: string
          maxLength: 120
        items:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: object
            properties:
              category:
                type: string
                maxLength: 80
                description: Slug de la categoría.
              label:
                type: string
                maxLength: 60
                description: Texto a mostrar; si falta, el nombre de la categoría
              image:
                type: string
              categoryInfo:
                readOnly: true
                description: Solo en GET /api/app-home/public — los accesos a categorías borradas o inactivas se omiten.
                allOf:
                  - $ref: "#/components/schemas/PublicCategory"
            required: [category]
      required: [type, items]

    AppHomeNoticeSection:
      type: object
      description: Texto o aviso destacado.
      properties:
        id:
          type: string
          maxLength: 40
        type:
          type: string
          enum: [notice]
        visible:
          type: boolean
          default: true
        title:
          type: string
          maxLength: 120
        body:
          type: string
          maxLength: 1000
        style:
          type: string
          enum: [info, promo, warning]
          default: info
        link:
          $ref: "#/components/schemas/AppHomeLink"
      required: [type, body]

    InfraUsage:
      type: object
      properties:
        usedBytes:
          type: integer
          format: int64
        totalBytes:
          type: integer
          format: int64
        percent:
          type: number

    InfraTransfer:
      type: object
      properties:
        bytes:
          type: integer
          format: int64
        totalBytes:
          type: integer
          format: int64
        percent:
          type: number

    Role:
      type: string
      enum:
        - super_admin
        - store_admin
        - collaborator
        - customer

    UserPublic:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
          description: Opcional, sin formato fijo (números de distintos países).
        addresses:
          type: array
          description: Libreta de direcciones — se gestiona con POST/PUT/DELETE /api/users/{id}/addresses[/{addressId}], nunca con PUT /api/users/{id}.
          items:
            $ref: "#/components/schemas/Address"
        emailPreferences:
          type: object
          description: >-
            Correos opcionales que acepta la cuenta (default true; se apagan con el enlace del
            correo o con PUT /api/users/{id}). abandonedCart = recordatorio de carrito abandonado;
            wishlist = aviso de que un favorito agotado volvió a estar disponible.
          properties:
            abandonedCart: { type: boolean }
            wishlist: { type: boolean }
        favorites:
          type: array
          description: >
            En GET /api/users/{id} y en las respuestas de
            POST/DELETE /api/users/{id}/favorites viene poblado (objeto
            resumido del producto); en cualquier otra respuesta que incluya
            un usuario (login, register, listado) son solo los ids.
          items:
            oneOf:
              - type: string
              - $ref: "#/components/schemas/FavoriteProduct"
        role:
          $ref: "#/components/schemas/Role"
        profileImage:
          type: string
          nullable: true
        isVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [_id, name, email, role, isVerified, createdAt]

    FavoriteProduct:
      type: object
      description: Resumen del producto — lo que trae el populate de favorites, nunca el Product completo.
      properties:
        _id:
          type: string
        name:
          type: string
        price:
          type: number
        category:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CategoryRef"
        images:
          type: array
          items:
            type: string

    Address:
      type: object
      properties:
        _id:
          type: string
        label:
          type: string
          nullable: true
          description: "Etiqueta opcional (\"Casa\", \"Oficina\")."
        recipientName:
          type: string
        phone:
          type: string
        street:
          type: string
        exteriorNumber:
          type: string
        interiorNumber:
          type: string
          nullable: true
          description: Único campo del domicilio que es opcional.
        zipCode:
          type: string
        neighborhood:
          type: string
        city:
          type: string
        state:
          type: string
        isDefault:
          type: boolean
          description: Como mucho una dirección por usuario tiene isDefault:true — es la que precarga el checkout.
        createdAt:
          type: string
          format: date-time
      required:
        [_id, recipientName, phone, street, exteriorNumber, zipCode, neighborhood, city, state, isDefault]

    AddressCreateRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 60
        recipientName:
          type: string
          maxLength: 200
        phone:
          type: string
          maxLength: 40
        street:
          type: string
          maxLength: 200
        exteriorNumber:
          type: string
          maxLength: 20
        interiorNumber:
          type: string
          maxLength: 20
          description: Opcional.
        zipCode:
          type: string
          maxLength: 10
        neighborhood:
          type: string
          maxLength: 120
        city:
          type: string
          maxLength: 120
        state:
          type: string
          maxLength: 120
        isDefault:
          type: boolean
          description: Opcional — la primera dirección de la cuenta siempre queda como default aunque no se mande.
      required: [recipientName, phone, street, exteriorNumber, zipCode, neighborhood, city, state]

    AddressUpdateRequest:
      type: object
      description: Todos los campos son opcionales; solo se actualiza lo que se manda.
      properties:
        label:
          type: string
          maxLength: 60
        recipientName:
          type: string
          maxLength: 200
        phone:
          type: string
          maxLength: 40
        street:
          type: string
          maxLength: 200
        exteriorNumber:
          type: string
          maxLength: 20
        interiorNumber:
          type: string
          maxLength: 20
        zipCode:
          type: string
          maxLength: 10
        neighborhood:
          type: string
          maxLength: 120
        city:
          type: string
          maxLength: 120
        state:
          type: string
          maxLength: 120
        isDefault:
          type: boolean

    UserListItem:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        role:
          $ref: "#/components/schemas/Role"
        isVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [_id, name, email, role, isVerified, createdAt]

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        phone:
          type: string
          description: Opcional.
      required: [name, email, password]

    RegisterResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: "#/components/schemas/UserPublic"
      required: [message, user]

    CreateStaffUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        phone:
          type: string
          description: Opcional.
        role:
          $ref: "#/components/schemas/Role"
      required: [name, email, password, role]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
          description: Access token (JWT, vigencia JWT_ACCESS_EXPIRES_IN)
        refreshToken:
          type: string
          description: >
            Token opaco para `POST /api/users/refresh` (vigencia
            JWT_REFRESH_EXPIRES_IN, default 30 días). Guárdalo en
            almacenamiento seguro; la web puede ignorarlo.
        user:
          $ref: "#/components/schemas/UserPublic"
      required: [message, token, refreshToken, user]

    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required: [refreshToken]

    RefreshSessionResponse:
      type: object
      properties:
        token:
          type: string
          description: Access token nuevo
        refreshToken:
          type: string
          description: Refresh token nuevo — el enviado ya no sirve
      required: [token, refreshToken]

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        phone:
          type: string
          description: Opcional, 10 dígitos de México — mándalo vacío para borrar el teléfono guardado.
        role:
          $ref: "#/components/schemas/Role"
        emailPreferences:
          type: object
          description: "Correos opcionales (JSON, no multipart). abandonedCart / wishlist: true/false."
          properties:
            abandonedCart: { type: boolean }
            wishlist: { type: boolean }
        profileImage:
          type: string
          format: binary
          description: Imagen real en formato JPG o PNG (máximo 5MB).

    UpdateUserResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: "#/components/schemas/UserPublic"
      required: [message, user]

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6
        refreshToken:
          type: string
          description: >
            Opcional. El cambio cierra todas las sesiones largas (refresh
            tokens) del usuario; si mandas el de la sesión actual, esa se
            conserva.
      required: [currentPassword, newPassword]

    DeleteUserResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: "#/components/schemas/UserPublic"
      required: [message, user]

    ContactEmailRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 30
        service:
          type: string
          maxLength: 120
        message:
          type: string
          minLength: 10
          maxLength: 2000
      required: [fullName, email, service, message]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    MediaItem:
      type: object
      properties:
        fileName:
          type: string
          example: media-1718282784-uuid.jpg
        path:
          type: string
          example: uploads/media-1718282784-uuid.jpg
        kind:
          type: string
          enum: [image, gif, video]
        size:
          type: integer
          description: Bytes
        uploadedAt:
          type: string
          format: date-time
        title:
          type: string
        altText:
          type: string
        inGallery:
          type: boolean
          description: Se muestra en la galería pública (GET /api/media/public).
        galleryCategory:
          type: string
          maxLength: 60
      required: [fileName, path, kind, size, uploadedAt, title, altText]

    MediaUsage:
      type: object
      properties:
        type:
          type: string
          enum: [product, user, storeConfig]
        id:
          type: string
          description: Solo para product/user
        field:
          type: string
          description: Solo para storeConfig, ej. heroSlides[0].mediaPath
        label:
          type: string
      required: [type, label]

    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: object
          properties:
            status:
              type: integer
              example: 400
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            details:
              oneOf:
                - type: string
                - type: object
                - type: array
                  items: {}
          required: [status, code, message]
      required: [ok, error]

    AgencyClient:
      type: object
      description: >
        Registro interno de agencia (negocio-cliente de Duck-Hack). No confundir con el rol `customer`
        (comprador final de una tienda). Información confidencial, solo accesible a `super_admin`.
      properties:
        _id:
          type: string
        businessName:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
        siteUrl:
          type: string
        hostingPlan:
          $ref: "#/components/schemas/HostingPlan"
        hostingMonthlyCost:
          type: number
          description: >
            Para basic/medium/advanced se deriva server-side del precio de lista
            (no editable); solo se captura a mano cuando hostingPlan es "enterprise".
        dockerContainers:
          type: array
          items:
            type: string
          description: Nombres exactos de contenedor en Portainer/Docker (un cliente puede tener varios).
        domain:
          type: string
        domainExpiresAt:
          type: string
          format: date-time
          nullable: true
        billingName:
          type: string
        billingRfc:
          type: string
        billingAddress:
          type: string
        billingEmail:
          type: string
          format: email
        notes:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [_id, businessName, isActive, createdAt, updatedAt]

    AgencyClientCreateRequest:
      type: object
      properties:
        businessName:
          type: string
          minLength: 2
          maxLength: 150
        contactName:
          type: string
          maxLength: 120
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
          maxLength: 30
        siteUrl:
          type: string
          maxLength: 300
        hostingPlan:
          $ref: "#/components/schemas/HostingPlan"
        hostingMonthlyCost:
          type: number
          description: Requerido y > 0 solo cuando hostingPlan es "enterprise"; para los demás planes se ignora y se deriva del precio de lista.
        dockerContainers:
          type: array
          items:
            type: string
            maxLength: 200
        domain:
          type: string
          maxLength: 200
        domainExpiresAt:
          type: string
          format: date
          nullable: true
        billingName:
          type: string
          maxLength: 200
        billingRfc:
          type: string
          maxLength: 20
        billingAddress:
          type: string
          maxLength: 300
        billingEmail:
          type: string
          format: email
        notes:
          type: string
          maxLength: 2000
        isActive:
          type: boolean
      required: [businessName]

    AgencyClientListItem:
      allOf:
        - $ref: "#/components/schemas/AgencyClient"
        - type: object
          properties:
            hostingPaidUntil:
              type: string
              format: date-time
              nullable: true
              description: coversUntil del último pago de hosting registrado (null si nunca se registró uno).
            pendingDebtTotal:
              type: number
              description: Suma de (amount - amountPaid) de las deudas con status != paid.
            pendingDebtCount:
              type: integer
          required: [pendingDebtTotal, pendingDebtCount]

    HostingPayment:
      type: object
      properties:
        _id:
          type: string
        client:
          type: string
          description: ObjectId del AgencyClient
        paidAt:
          type: string
          format: date-time
        coversUntil:
          type: string
          format: date-time
        amount:
          type: number
          nullable: true
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [_id, client, paidAt, coversUntil]

    HostingPaymentCreateRequest:
      type: object
      properties:
        paidAt:
          type: string
          format: date
        coversUntil:
          type: string
          format: date
        amount:
          type: number
          minimum: 0
        notes:
          type: string
          maxLength: 500
      required: [paidAt, coversUntil]

    DesignDebtStatus:
      type: string
      readOnly: true
      enum: [pending, partial, paid]
      description: Recalculado server-side a partir de amount/amountPaid; nunca se acepta del cliente.

    HostingPlan:
      type: string
      enum: [free, basic, medium, advanced, enterprise]
      description: >
        Plan de hosting contratado (ver backend/utils/hostingPlans.js, debe coincidir con los precios
        publicados en frontend-user). "enterprise" es "bajo cotización" — sin precio de lista fijo.
        "free" no es un plan comercial: es para servicios/dominios propios de la agencia (precio
        fijo en 0) que igual se mapean aquí porque generan gasto de dominio/hosting/licencias/docker,
        registrado como egreso en /api/accounting en vez de como cobro de hosting.

    DesignDebt:
      type: object
      properties:
        _id:
          type: string
        client:
          type: string
          description: ObjectId del AgencyClient
        description:
          type: string
        amount:
          type: number
        amountPaid:
          type: number
        status:
          $ref: "#/components/schemas/DesignDebtStatus"
        invoicedAt:
          type: string
          format: date-time
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [_id, client, description, amount, amountPaid, status]

    DesignDebtCreateRequest:
      type: object
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 300
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
        amountPaid:
          type: number
          minimum: 0
          description: No puede superar amount.
        invoicedAt:
          type: string
          format: date
        notes:
          type: string
          maxLength: 500
      required: [description, amount]

    DockerContainerStatus:
      type: object
      properties:
        name:
          type: string
        found:
          type: boolean
        state:
          type: string
          description: Estado real de Docker (running/exited/paused/...) o "not_found" si el nombre no coincide con ningún contenedor.
        status:
          type: string
          description: Texto legible de Docker (ej. "Up 3 days").
        imageSizeBytes:
          type: integer
          nullable: true
        writableLayerSizeBytes:
          type: integer
          nullable: true
        cpuPercent:
          type: number
          nullable: true
        memoryUsedBytes:
          type: integer
          nullable: true
        network:
          type: object
          nullable: true
          properties:
            rxBytes:
              type: integer
            txBytes:
              type: integer

    TransactionType:
      type: string
      enum: [income, expense]

    TransactionSource:
      type: string
      readOnly: true
      enum: [manual, hosting_payment, design_debt, opening_balance]
      description: Solo "manual" se puede editar/eliminar directamente; las demás se generan automáticamente.

    Transaction:
      type: object
      properties:
        _id:
          type: string
        type:
          $ref: "#/components/schemas/TransactionType"
        amount:
          type: number
        date:
          type: string
          format: date-time
        category:
          type: string
        description:
          type: string
        client:
          type: string
          nullable: true
        source:
          $ref: "#/components/schemas/TransactionSource"
        sourceCollection:
          type: string
          nullable: true
        sourceId:
          type: string
          nullable: true
        invoice:
          type: string
          nullable: true
          description: Id de la factura que cubre este movimiento, o null si aún no se ha facturado.
        createdAt:
          type: string
          format: date-time
      required: [_id, type, amount, date, source]

    TransactionCreateRequest:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/TransactionType"
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
        date:
          type: string
          format: date
        category:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 500
        client:
          type: string
          nullable: true
      required: [type, amount]

    AccountingMonthSummary:
      type: object
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
        income:
          type: number
        expense:
          type: number
        closingBalance:
          type: number
          description: >
            Saldo con el que cerró la cuenta al final de este mes (arrastrado desde antes del
            año consultado + el neto acumulado del año hasta este mes inclusive) — no es solo
            el neto del mes, sino el saldo real de la cuenta en ese punto en el tiempo.

    AccountingSummary:
      type: object
      properties:
        year:
          type: integer
        currentBalance:
          type: number
          description: Saldo total acumulado (todo el tiempo, no solo el año consultado).
        months:
          type: array
          items:
            $ref: "#/components/schemas/AccountingMonthSummary"

    InvoiceSource:
      type: string
      readOnly: true
      enum: [manual, hosting_payment, design_debt, movements]
      description: >
        "movements" = facturas creadas seleccionando uno o más Transaction
        existentes (el flujo actual). Los demás valores son históricos, de
        antes de que facturar dejara de ser automático por cada pago.

    Invoice:
      type: object
      properties:
        _id:
          type: string
        client:
          type: string
        folio:
          type: integer
        concept:
          type: string
        amount:
          type: number
        issuedAt:
          type: string
          format: date-time
        source:
          $ref: "#/components/schemas/InvoiceSource"
        transactions:
          type: array
          items:
            type: string
          description: Movimientos (Transaction) cubiertos por esta factura.
        items:
          type: array
          description: Desglose por movimiento (snapshot al facturar) — un renglón por concepto/monto en el PDF. Vacío en facturas antiguas sin desglose.
          items:
            type: object
            properties:
              concept:
                type: string
              amount:
                type: number
      required: [_id, client, folio, concept, amount, issuedAt]

    InvoiceCreateRequest:
      type: object
      description: >
        Crea una factura a partir de uno o más movimientos (Transaction) ya
        existentes del mismo cliente y el mismo mes calendario — no acepta
        monto/fecha arbitrarios.
      properties:
        client:
          type: string
        transactionIds:
          type: array
          minItems: 1
          items:
            type: string
        itemConcepts:
          type: array
          description: >
            Opcional. Concepto que se imprime para cada movimiento, paralelo a
            transactionIds (itemConcepts[i] es el concepto de transactionIds[i]).
            Si se envía, debe tener exactamente la misma longitud que
            transactionIds. Un elemento vacío cae al description/categoría del
            movimiento. El concepto "resumen" de la factura (Invoice.concept, el
            del listado) siempre lo compone el servidor a partir de categorías +
            mes; ya no se acepta del payload.
          items:
            type: string
            maxLength: 300
      required: [client, transactionIds]

    InvoiceUpdateRequest:
      type: object
      description: >
        Edición acotada de una factura ya emitida. Todos los campos son
        opcionales pero debe ir al menos uno.
      properties:
        items:
          type: array
          description: >
            Posicional — items[i].concept reemplaza el concepto del renglón i de
            la factura. La longitud debe ser exactamente la de Invoice.items.
          items:
            type: object
            properties:
              concept:
                type: string
                minLength: 1
                maxLength: 300
            required: [concept]
        issuedAt:
          type: string
          format: date
          description: Fecha de emisión (fecha de calendario, se guarda como medianoche UTC).

    Product:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        sku:
          type: string
        description:
          type: string
          maxLength: 20000
          description: HTML básico (las etiquetas cuentan).
        price:
          type: number
        compareAtPrice:
          type: number
          nullable: true
        category:
          nullable: true
          description: >-
            ObjectId de Category; en los listados (staff y públicos) viene
            poblado como { _id, name, slug }.
          oneOf:
            - type: string
            - $ref: "#/components/schemas/CategoryRef"
        images:
          type: array
          items:
            type: string
        attributes:
          type: array
          maxItems: 30
          description: >-
            Especificaciones libres "Nombre: valor" en orden de visualización
            (p. ej. Notas de cata, Tueste, Material). Solo informativas: lo que
            el cliente elige al comprar son las variantes.
          items:
            $ref: '#/components/schemas/ProductAttribute'
        options:
          type: array
          maxItems: 3
          description: Opciones de variante (Talla, Color…). Vacío = producto sin variantes.
          items:
            $ref: "#/components/schemas/ProductOption"
        variants:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ProductVariant"
        featured:
          type: boolean
        sortOrder:
          type: integer
          minimum: 0
        isActive:
          type: boolean
        ratingAvg:
          type: number
          readOnly: true
          description: Promedio de reseñas aprobadas (1 decimal, 0 sin reseñas). Lo calcula /api/reviews; se ignora en el payload.
        ratingCount:
          type: integer
          readOnly: true
          description: Número de reseñas aprobadas.
        createdAt:
          type: string
          format: date-time
      required: [_id, name, sku, price]

    PublicProduct:
      description: Producto tal como lo expone el catálogo público del storefront.
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          properties:
            purchaseLimit:
              type: integer
              nullable: true
              example: 10
              description: >-
                Tope de unidades por pedido en el checkout público
                (StoreConfig.maxUnitsPerProduct); null = sin tope.
            maxQty:
              type: integer
              minimum: 1
              description: >-
                min(existencias, purchaseLimit) — lo máximo que se puede
                agregar. Sin tope son las existencias; con tope, arriba de él
                el inventario real no se expone. Con variantes, el mayor de
                sus variantes.
            variants:
              type: array
              description: Solo si el producto tiene variantes — solo las activas (las agotadas con inStock false).
              items:
                $ref: "#/components/schemas/PublicProductVariant"
            priceRange:
              type: object
              description: Solo con variantes — precio efectivo mínimo y máximo de las disponibles.
              properties:
                min:
                  type: number
                max:
                  type: number
          required: [purchaseLimit, maxQty]

    PublicProductVariant:
      type: object
      properties:
        _id:
          type: string
        sku:
          type: string
        optionValues:
          type: array
          items:
            type: string
        label:
          type: string
          example: "Talla: M / Color: Rojo"
        price:
          type: number
          description: Precio efectivo (el de la variante o, si no tiene, el del producto).
        compareAtPrice:
          type: number
          nullable: true
        image:
          type: string
          nullable: true
        inStock:
          type: boolean
        maxQty:
          type: integer
          minimum: 0

    ProductOption:
      type: object
      properties:
        name:
          type: string
          maxLength: 40
          example: Talla
        values:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            maxLength: 60
          example: [S, M, L]
      required: [name, values]

    ProductVariant:
      type: object
      description: >-
        Una combinación vendible. Cada una lleva su inventario (Inventory.variant).
        Al editar, mandar el `_id` de las existentes para conservar su
        inventario; no se puede quitar una variante que tenga inventario
        (409 VARIANT_HAS_INVENTORY) — desactivarla con isActive false.
      properties:
        _id:
          type: string
        sku:
          type: string
          maxLength: 60
          description: Único entre todos los productos y variantes (409 SKU_TAKEN).
        optionValues:
          type: array
          description: Un valor de cada opción, en el orden de `options`; combinación única.
          items:
            type: string
        price:
          type: number
          minimum: 0
          nullable: true
          description: Vacío = hereda price/compareAtPrice del producto.
        compareAtPrice:
          type: number
          minimum: 0
          nullable: true
        image:
          type: string
        isActive:
          type: boolean
          default: true
      required: [sku, optionValues]

    CategoryRef:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        slug:
          type: string

    Category:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
          maxLength: 80
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        kind:
          type: string
          enum: [product, service]
        description:
          type: string
        image:
          type: string
        featured:
          type: boolean
        sortOrder:
          type: integer
        isActive:
          type: boolean
        productCount:
          type: integer
          readOnly: true
          description: Solo en GET /api/categories.
      required: [_id, name, slug, kind]

    PublicCategory:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        image:
          type: string
        featured:
          type: boolean
        sortOrder:
          type: integer

    CategoryRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        kind:
          type: string
          enum: [product, service]
          description: Solo en el alta.
        description:
          type: string
        image:
          type: string
          description: Ruta uploads/ de Medios.
        featured:
          type: boolean
        sortOrder:
          type: integer
          minimum: 0
        isActive:
          type: boolean
      required: [name]

    ProductCreateRequest:
      type: object
      properties:
        name:
          type: string
        sku:
          type: string
        description:
          type: string
        price:
          type: number
          minimum: 0
        compareAtPrice:
          type: number
          minimum: 0
        category:
          type: string
          nullable: true
          description: Id de Category (kind product); null o "" = sin categoría.
        featured:
          type: boolean
        sortOrder:
          type: integer
          minimum: 0
        options:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/ProductOption"
        variants:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ProductVariant"
        images:
          type: array
          items:
            type: string
          description: Rutas de uploads/ elegidas o subidas vía POST /api/media.
        attributes:
          type: array
          maxItems: 30
          description: >-
            Especificaciones libres "Nombre: valor" en orden de visualización. Las filas con nombre y valor vacíos se descartan; una fila a medias es VALIDATION_ERROR
            (p. ej. Notas de cata, Tueste, Material, Talla). Genéricas para
            cualquier giro de tienda.
          items:
            $ref: '#/components/schemas/ProductAttribute'
        isActive:
          type: boolean
      required: [name, sku, price]

    ProductAttribute:
      type: object
      properties:
        name:
          type: string
          maxLength: 60
          example: Notas de cata
        value:
          type: string
          maxLength: 300
          example: Cacao, panela, naranja
      required: [name, value]

    Inventory:
      type: object
      properties:
        _id:
          type: string
        product:
          type: string
          description: ObjectId de Product, o el objeto poblado en GET /api/inventory[/{id}].
        variant:
          type: string
          nullable: true
          description: _id de Product.variants; null = producto sin variantes. Único por producto + variante.
        variantLabel:
          type: string
          nullable: true
          readOnly: true
          description: 'Solo en GET — "Talla: M / Color: Rojo".'
        variantSku:
          type: string
          nullable: true
          readOnly: true
        isOrphan:
          type: boolean
          readOnly: true
          description: Solo en GET — el registro ya no corresponde a las variantes actuales del producto.
        quantity:
          type: number
        lowStockThreshold:
          type: number
        status:
          type: string
          readOnly: true
          enum: [in_stock, low_stock, out_of_stock]
          description: Recalculado server-side a partir de quantity/lowStockThreshold — nunca se acepta del cliente.
        notes:
          type: string
      required: [_id, product, quantity, status]

    InventoryCreateRequest:
      type: object
      description: >-
        product y variant solo en el alta (inmutables). Si el producto tiene
        variantes, variant es obligatorio (400 VARIANT_REQUIRED); ya registrado
        = 409 INVENTORY_ALREADY_EXISTS.
      properties:
        product:
          type: string
        variant:
          type: string
        quantity:
          type: number
          minimum: 0
        lowStockThreshold:
          type: number
          minimum: 0
        notes:
          type: string
      required: [product, quantity]

    OrderItem:
      type: object
      properties:
        product:
          type: string
        productName:
          type: string
          readOnly: true
          description: Snapshot del nombre del producto al momento de crear el pedido.
        variant:
          type: string
          description: _id de la variante elegida (obligatorio si el producto tiene variantes — 400 VARIANT_REQUIRED).
        variantLabel:
          type: string
          readOnly: true
          description: 'Snapshot "Talla: M / Color: Rojo".'
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number
          readOnly: true
          description: Snapshot del precio del producto al momento de crear el pedido.
        subtotal:
          type: number
          readOnly: true
      required: [product, quantity]

    ShippingAddress:
      type: object
      description: >
        Mismo set de campos que Address (User.addresses, ver más abajo) —
        una dirección guardada se puede copiar tal cual al hacer el pedido.
        Todos los campos menos interiorNumber son requeridos cuando
        paymentMethod es "transfer" (ver PublicCheckoutRequest); para
        "pickup" es opcional por completo.
      properties:
        recipientName:
          type: string
        phone:
          type: string
        street:
          type: string
        exteriorNumber:
          type: string
        interiorNumber:
          type: string
          nullable: true
          description: Único campo del domicilio que es opcional.
        zipCode:
          type: string
        neighborhood:
          type: string
        city:
          type: string
        state:
          type: string

    Order:
      type: object
      properties:
        _id:
          type: string
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        customer:
          description: >
            Cuenta de User vinculada al pedido, si el comprador estaba
            logueado en el checkout (ver POST /api/orders/public) o si se le
            asignó una manualmente (POST /api/orders). Al crear el pedido
            viene como el id (string); al listar/leer/actualizar
            (GET/PUT /api/orders...) viene poblado con name/email.
          oneOf:
            - type: string
              nullable: true
            - type: object
              properties:
                _id:
                  type: string
                name:
                  type: string
                email:
                  type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        status:
          type: string
          enum: [pending, payment_review, confirmed, processing, shipped, delivered, ready_for_pickup, picked_up, cancelled]
        shippingCost:
          type: number
          readOnly: true
          description: >-
            Envío cobrado, calculado server-side en POST /api/orders/public con
            StoreConfig.shipping. 0 si la tienda no cobra envío, si se alcanzó
            el envío gratis, en `pickup` y en ventas manuales de staff.
        total:
          type: number
          readOnly: true
          description: Suma de items[].subtotal + shippingCost.
        shippingAddress:
          $ref: "#/components/schemas/ShippingAddress"
        notes:
          type: string
        deliveryMethod:
          type: string
          enum: [shipping, pickup]
          description: Envío a domicilio (con shippingAddress) o recoger en punto de venta (pickupPoint).
        pickupPoint:
          $ref: "#/components/schemas/PickupPointSnapshot"
        paymentMethod:
          type: string
          description: >-
            Id del método de StoreConfig.paymentMethods elegido. Pedidos
            anteriores: "transfer" | "pickup". Sin pasarela — el pedido siempre
            entra "pending" y la tienda confirma el pago a mano.
        paymentMethodType:
          type: string
          enum: [spei, manual]
          description: Copia del tipo del método al momento del pedido.
        paymentMethodLabel:
          type: string
          description: Copia del nombre del método al momento del pedido.
        paymentInstructions:
          type: string
          description: Copia de las instrucciones del método (tipo manual).
        orderNumber:
          type: integer
          readOnly: true
          description: Folio legible secuencial, distinto de _id.
        paymentProofs:
          type: array
          readOnly: true
          description: Comprobantes de pago en orden de subida (POST /api/orders/{id}/payment-proof).
          items:
            $ref: "#/components/schemas/PaymentProof"
        shipment:
          $ref: "#/components/schemas/OrderShipment"
        discount:
          $ref: "#/components/schemas/OrderDiscount"
        loyalty:
          $ref: "#/components/schemas/OrderLoyalty"
        giftCard:
          type: object
          readOnly: true
          description: >-
            Pagado con tarjeta de regalo (también cubre el envío). `refunded` = el saldo regresó a
            la tarjeta porque el pedido se canceló o se borró (y se vuelve a cobrar si se reactiva).
          properties:
            card: { type: string }
            code: { type: string }
            amount: { type: number }
            refunded: { type: boolean }
        inventoryDeducted:
          type: boolean
          readOnly: true
          description: >-
            true = lo vendido ya salió del inventario. Se descuenta al entrar a
            confirmed, processing, shipped, delivered, ready_for_pickup o
            picked_up, y se regresa al volver a pending/payment_review/cancelled
            o al borrar el pedido. Nunca se acepta del cliente.
        readyForPickupAt:
          type: string
          format: date-time
          readOnly: true
          description: Recoger en tienda — cuándo pasó a ready_for_pickup.
        pickedUpAt:
          type: string
          format: date-time
          readOnly: true
          description: Recoger en tienda — cuándo pasó a picked_up.
        createdAt:
          type: string
          format: date-time
      required: [_id, customerName, customerEmail, items, status, total]

    Appointment:
      allOf:
        - $ref: "#/components/schemas/CustomerAppointment"
        - type: object
          properties:
            bufferMin: { type: integer }
            blockedUntil: { type: string, format: date-time }
            specialist:
              type: object
              properties:
                _id: { type: string }
                name: { type: string }
                color: { type: string }
            customer: { type: string, nullable: true }
            source: { type: string, enum: [web, phone, walk_in] }
            staffNotes: { type: string }
            cancelledBy: { type: string, nullable: true, enum: [customer, staff, system], description: "system = anticipo vencido." }
            depositAmount: { type: number }
            depositDueAt: { type: string, format: date-time, nullable: true }
            depositPaidAt: { type: string, format: date-time, nullable: true }
            paymentProofs:
              type: array
              items: { $ref: "#/components/schemas/PaymentProof" }
            media:
              type: array
              description: Fotos / videos de la cita, en la biblioteca de medios (URL pública). No salen en la vista de la clienta.
              items:
                type: object
                properties:
                  path: { type: string, example: uploads/media-1700000000000-uuid.jpg }
                  kind: { type: string, enum: [image, gif, video] }
                  addedAt: { type: string, format: date-time }
                  addedBy: { type: string, nullable: true }
            mediaConsent:
              type: object
              nullable: true
              description: La clienta autorizó subir sus fotos al sitio (lo registra el staff).
              properties:
                given: { type: boolean }
                at: { type: string, format: date-time }
                by: { type: string }
            cancelReason: { type: string }
            scheduledAt: { type: string, format: date-time, description: Cuándo se fijó el horario actual (alta o última reprogramación). }
            reminderSentAt: { type: string, format: date-time, nullable: true }
            history:
              type: array
              items:
                type: object
                properties:
                  type: { type: string, enum: [rescheduled, status] }
                  from: {}
                  to: {}
                  by: { type: string, enum: [customer, staff, system] }
                  user: { type: string, nullable: true }
                  at: { type: string, format: date-time }

    CustomerAppointment:
      type: object
      properties:
        _id: { type: string }
        appointmentNumber: { type: integer }
        status: { type: string, enum: [pending_deposit, deposit_review, pending, confirmed, completed, no_show, cancelled] }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        durationMin: { type: integer, description: Suma de los servicios. }
        services:
          type: array
          items:
            type: object
            properties:
              service: { type: string }
              name: { type: string }
              durationMin: { type: integer }
              price: { type: number }
        total: { type: number }
        specialist:
          type: object
          properties:
            _id: { type: string }
            name: { type: string }
        customerName: { type: string }
        customerEmail: { type: string }
        customerPhone: { type: string }
        notes: { type: string }
        timezone: { type: string }
        canChange: { type: boolean, description: Si todavía se puede cancelar o reprogramar desde el sitio. }
        changeDeadline: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time, nullable: true }
        attendanceConfirmedAt: { type: string, format: date-time, nullable: true, description: La clienta confirmó que asiste (desde el recordatorio). }
        deposit:
          type: object
          nullable: true
          description: >-
            Anticipo (Fase 5.1); null si la cita no lo pide. `spei` (cuenta a la que transferir) solo
            mientras espera el anticipo (pending_deposit / deposit_review).
          properties:
            amount: { type: number }
            dueAt: { type: string, format: date-time, nullable: true }
            paidAt: { type: string, format: date-time, nullable: true }
            concept: { type: string, example: Cita 12 }
            spei:
              type: object
              nullable: true
              properties:
                accountHolderName: { type: string }
                bank: { type: string }
                clabe: { type: string }
                phone: { type: string }
        paymentProofs:
          type: array
          items:
            type: object
            properties:
              _id: { type: string }
              status: { type: string, enum: [pending, approved, rejected] }
              uploadedAt: { type: string, format: date-time }
              rejectReason: { type: string }
        canUploadProof: { type: boolean }

    WeeklyShift:
      type: object
      properties:
        day: { type: integer, minimum: 0, maximum: 6, description: 0 = domingo. }
        open: { type: string, example: "10:00" }
        close: { type: string, example: "19:00" }
      required: [day, open, close]

    SpecialistRequest:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        photoUrl: { type: string }
        bio: { type: string, maxLength: 2000 }
        color: { type: string, example: "#4abdfc" }
        user: { type: string, nullable: true, description: Cuenta collaborator/store_admin (una por especialista). }
        services: { type: array, items: { type: string } }
        weeklyHours:
          type: array
          description: Turnos (hasta 4 por día, sin encimarse); día sin turnos = descanso.
          items:
            $ref: "#/components/schemas/WeeklyShift"
        sortOrder: { type: integer }
        isActive: { type: boolean }
      required: [name]

    Specialist:
      allOf:
        - $ref: "#/components/schemas/SpecialistRequest"
        - type: object
          properties:
            _id: { type: string }

    PublicSpecialist:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        photoUrl: { type: string }
        bio: { type: string }
        services: { type: array, items: { type: string } }
        sortOrder: { type: integer }

    AppointmentSettings:
      type: object
      properties:
        autoConfirm: { type: boolean, description: "false = las citas del sitio entran Por confirmar." }
        slotStepMin: { type: integer, enum: [5, 10, 15, 20, 30, 60] }
        minNoticeMin: { type: integer, description: Anticipación mínima para agendar en línea. }
        maxDaysAhead: { type: integer }
        minHoursToChange: { type: integer, description: La clienta cancela o reprograma hasta N horas antes. }
        allowAnySpecialist: { type: boolean }
        timezone: { type: string, example: America/Mexico_City }
        notifyEmail: { type: string, description: Vacío = correo de contacto de la tienda (contactEmail) o CONTACT_EMAIL_TO. }
        emailCustomer: { type: boolean, description: "Correos a la clienta (agendada, confirmada, reprogramada, cancelada) con .ics y enlace a Google Calendar." }
        emailBusiness: { type: boolean, description: Avisos al negocio cuando la clienta agenda, cancela o reprograma desde el sitio. }
        reminderEnabled:
          type: boolean
          description: >-
            Recordatorio por correo antes de cada cita confirmada (módulo `reminders`; la tarea
            programada solo corre si está contratado). Una vez por cita; reprogramar lo reinicia.
        reminderHoursBefore: { type: integer, minimum: 1, maximum: 72, description: Cuántas horas antes (24 por default). }
        reviewRequestEnabled:
          type: boolean
          description: >-
            Reseña post-cita (true por default): correo para calificar una cita completada, una
            vez, con el enlace FRONTEND_URL/cita/<id>?token=…&accion=calificar. La tarea solo corre
            si `reviews` y `appointments` están contratados; no se manda si ya calificó ni a citas
            que terminaron hace más de 14 días.
        reviewRequestHoursAfter: { type: integer, minimum: 1, maximum: 72, description: Horas después de terminar la cita (2 por default). }
        depositHours: { type: integer, minimum: 1, maximum: 168, description: "Anticipo: horas para subir el comprobante (24 por default)." }
        depositCutoffHours:
          type: integer
          minimum: 0
          maximum: 168
          description: >-
            Anticipo: la fecha límite nunca es después de N horas antes de la cita (12 por default).
            Una tarea programada (cada 5 min) cancela las citas pending_deposit vencidas y avisa a la
            clienta y al negocio.

    DashboardPreferences:
      type: object
      properties:
        hidden: { type: array, maxItems: 30, items: { type: string, maxLength: 40 }, description: Tarjetas ocultas. }
        order: { type: array, maxItems: 30, items: { type: string, maxLength: 40 }, description: Orden de las tarjetas. }
        welcomeDismissed: { type: boolean }
        changelogSeen: { type: string, description: "Id de la última novedad leída (frontend-admin/src/changelog.js)." }

    PromoBannerRequest:
      type: object
      properties:
        title: { type: string, maxLength: 120 }
        text: { type: string, maxLength: 300 }
        image: { type: string, maxLength: 300, description: Ruta de la biblioteca de medios. }
        mobileImage: { type: string, maxLength: 300, description: Opcional (vertical, para celular). }
        buttonLabel: { type: string, maxLength: 40 }
        target:
          type: object
          properties:
            type: { type: string, enum: [none, category, coupon, url], default: none }
            value:
              type: string
              description: >-
                category = id de una categoría de productos; coupon = código (se normaliza a
                mayúsculas); url = https://… o una ruta del sitio que empiece con /.
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        isActive: { type: boolean, default: true }
        sortOrder: { type: integer, minimum: 0, default: 0 }
        placement: { type: string, enum: [home, shop, all], default: home }

    PromoBanner:
      allOf:
        - $ref: "#/components/schemas/PromoBannerRequest"
        - type: object
          properties:
            _id: { type: string }
            status: { type: string, enum: [active, scheduled, expired, off], description: Por interruptor y fechas. }
            targetProblem: { type: string, nullable: true, description: "Por qué no se muestra aunque esté activo (destino que ya no sirve)." }
            targetSummary: { $ref: "#/components/schemas/PromoBannerTarget" }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    PromoBannerTarget:
      type: object
      nullable: true
      description: Destino ya resuelto.
      properties:
        type: { type: string, enum: [none, category, coupon, url] }
        categoryId: { type: string }
        slug: { type: string }
        name: { type: string }
        code: { type: string }
        label: { type: string, example: 20% de descuento }
        minPurchase: { type: number, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        url: { type: string }

    WishlistSettings:
      type: object
      description: >-
        Tarea programada cada 15 min (solo si `wishlist` está contratado y `enabled`, true por
        default): revisa los productos que alguien tiene en favoritos (la primera vez solo
        registra su estado) y, cuando uno pasa de agotado a disponible (activo y con existencias,
        el criterio de /api/products/public), avisa una vez por reabastecimiento a cada cliente
        verificado que lo tiene en favoritos y no se dio de baja. Botón a
        FRONTEND_URL/tienda/<productId>. Un reabastecimiento ocurrido con el aviso apagado se
        avisa al encenderlo.
      properties:
        enabled: { type: boolean }
      required: [enabled]

    AbandonedCartSettings:
      type: object
      description: >-
        Tarea programada cada 15 min (solo si el módulo `abandonedCart` está contratado y
        `enabled`): un correo por abandono a clientes verificados que no se dieron de baja,
        con el carrito sin cambios por `delayHours` y de menos de 7 días; omite agotados.
      properties:
        enabled: { type: boolean }
        delayHours: { type: integer, minimum: 1, maximum: 72 }
        coupon:
          type: object
          description: Cupón generado por correo (VUELVE-XXXXXX), un solo uso y solo para ese cliente.
          properties:
            enabled: { type: boolean }
            type: { type: string, enum: [amount, percent, free_shipping] }
            value: { type: number }
            minPurchase: { type: number, nullable: true }
            validDays: { type: integer, minimum: 1, maximum: 60 }

    CartResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              product: { $ref: "#/components/schemas/PublicProduct" }
              variant: { type: string, nullable: true }
              quantity: { type: integer }
        unavailable:
          type: array
          description: Renglones guardados que hoy no se pueden comprar (agotados, inactivos, variante que ya no existe).
          items:
            type: object
            properties:
              product: { type: string }
              variant: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true, description: Último cambio de productos o cantidades. }

    ServiceRequest:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        category: { type: string, nullable: true, description: Id de Category kind service; null o "" = sin categoría. }
        description: { type: string, maxLength: 5000, description: HTML básico. }
        durationMin: { type: integer, minimum: 5, maximum: 600 }
        bufferMin: { type: integer, minimum: 0, maximum: 240, description: Tiempo libre después del servicio. En una cita con varios servicios cuenta el mayor, una vez. }
        price: { type: number, minimum: 0 }
        priceFrom: { type: boolean, description: Mostrar como "Desde $". }
        image: { type: string }
        bookableOnline: { type: boolean }
        deposit:
          type: object
          description: Anticipo (se cobra cuando se activen los anticipos SPEI).
          properties:
            type: { type: string, enum: [none, fixed, percent] }
            value: { type: number, minimum: 0 }
        sortOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean }
      required: [name, durationMin, price]

    Service:
      allOf:
        - $ref: "#/components/schemas/ServiceRequest"
        - type: object
          properties:
            _id: { type: string }
            createdAt: { type: string, format: date-time }

    PublicService:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        category:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PublicCategory"
        description: { type: string }
        durationMin: { type: integer }
        price: { type: number }
        priceFrom: { type: boolean }
        image: { type: string }
        bookableOnline: { type: boolean }
        sortOrder: { type: integer }

    ReviewRequest:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
      required: [rating]

    PublicReview:
      type: object
      properties:
        _id: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        customerName: { type: string, example: "Ana G." }
        createdAt: { type: string, format: date-time }

    OwnReview:
      type: object
      properties:
        _id: { type: string }
        kind: { type: string, enum: [product, appointment] }
        product: { type: string, description: Solo en reseñas de producto. }
        productName: { type: string, description: "Solo en GET /mine, reseñas de producto." }
        appointment:
          type: object
          description: "Solo en GET /mine, calificaciones de cita."
          properties:
            _id: { type: string }
            appointmentNumber: { type: integer, nullable: true }
            services: { type: array, items: { type: string } }
            start: { type: string, format: date-time, nullable: true }
        rating: { type: integer }
        comment: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        rejectionReason: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Review:
      type: object
      description: Modelo genérico (target.kind "product" o "appointment" — reseña post-cita).
      properties:
        _id: { type: string }
        target:
          type: object
          properties:
            kind: { type: string, enum: [product, appointment] }
            id: { type: string }
        product:
          type: object
          nullable: true
          properties:
            _id: { type: string }
            name: { type: string }
            image: { type: string }
        customer:
          type: object
          properties:
            _id: { type: string }
            email: { type: string }
        customerName: { type: string }
        customerEmail: { type: string, description: "Reseñas de cita (la clienta puede ser invitada, `customer` nulo)." }
        appointmentInfo:
          type: object
          description: Reseñas de cita — foto de la cita al calificar.
          properties:
            appointmentNumber: { type: integer }
            services: { type: array, items: { type: string } }
            specialist: { type: string, nullable: true }
            specialistName: { type: string }
            start: { type: string, format: date-time }
        isTestimonial: { type: boolean, description: Solo en la bandeja del staff. }
        order:
          type: object
          nullable: true
          properties:
            _id: { type: string }
            orderNumber: { type: integer }
        rating: { type: integer }
        comment: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        rejectionReason: { type: string }
        reviewedBy: { type: string, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    AppointmentReviewView:
      type: object
      nullable: true
      properties:
        _id: { type: string }
        appointment: { type: string }
        rating: { type: integer }
        comment: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        rejectionReason: { type: string }
        createdAt: { type: string, format: date-time }

    Coupon:
      type: object
      properties:
        _id:
          type: string
        code:
          type: string
          example: BIENVENIDA30
        description:
          type: string
          description: Nota interna.
        type:
          type: string
          enum: [amount, percent, free_shipping]
        value:
          type: number
          description: Pesos (amount), 1–100 (percent) o 0 (free_shipping).
        minPurchase:
          type: number
          nullable: true
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        maxUses:
          type: integer
          nullable: true
        maxUsesPerCustomer:
          type: integer
          nullable: true
        usedCount:
          type: integer
          readOnly: true
          description: Pedidos que lo usan, sin contar cancelados ni borrados.
        isActive:
          type: boolean
        customerEmail:
          type: string
          description: Cupón personal (solo ese correo lo puede usar); lo ponen los cupones generados por el carrito abandonado.
        source:
          type: string
          enum: [manual, abandoned_cart]

    CouponRequest:
      type: object
      properties:
        code:
          type: string
          pattern: "^[A-Z0-9][A-Z0-9_-]{2,29}$"
        description:
          type: string
        type:
          type: string
          enum: [amount, percent, free_shipping]
        value:
          type: number
        minPurchase:
          type: number
          nullable: true
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        maxUses:
          type: integer
          nullable: true
        maxUsesPerCustomer:
          type: integer
          nullable: true
        isActive:
          type: boolean
      required: [code, type]

    OrderDiscount:
      type: object
      readOnly: true
      description: >-
        Cupón aplicado en el checkout. total = subtotal de productos − amount +
        shippingCost. `counted` = el pedido cuenta como uso del cupón (false si
        está cancelado).
      properties:
        code:
          type: string
        coupon:
          type: string
        type:
          type: string
          enum: [amount, percent, free_shipping]
        value:
          type: number
        amount:
          type: number
        counted:
          type: boolean

    OrderLoyalty:
      type: object
      readOnly: true
      description: >-
        Puntos de lealtad (packages/core-api/lib/loyalty.js). `redeemed` = puntos usados en el
        checkout (se restan del total; se devuelven si se cancela o borra, `redeemRefunded`).
        `earned` = puntos abonados al pagarse (5% default sobre productos − cupón − puntos usados,
        sin envío), con `earnedCounted` true mientras el pedido está pagado; se retiran si se
        cancela. Los pedidos de invitado con el correo de una cuenta también abonan.
      properties:
        customer: { type: string, nullable: true }
        earned: { type: number }
        earnedCounted: { type: boolean }
        redeemed: { type: number }
        redeemRefunded: { type: boolean }

    LoyaltySettings:
      type: object
      properties:
        points:
          type: object
          properties:
            enabled: { type: boolean, default: false }
            earnPercent: { type: number, minimum: 0.1, maximum: 50, default: 5 }
            maxRedeemPercent: { type: number, minimum: 1, maximum: 100, default: 100, description: "% del subtotal de productos (ya con cupón) que se puede pagar con puntos." }
            minRedeem: { type: number, minimum: 0, default: 0 }
            expiryMonths: { type: integer, minimum: 1, maximum: 60, nullable: true, description: "Vencen tras N meses sin movimiento; null = nunca (default)." }
            expiryWarningDays: { type: integer, minimum: 1, maximum: 60, default: 15, description: "Correo de aviso N días antes de vencer (tarea programada diaria)." }
        stamps:
          type: object
          properties:
            enabled: { type: boolean, default: false }
            goal: { type: integer, minimum: 2, maximum: 50, default: 10 }
            reward: { type: string, maxLength: 120, default: Un servicio gratis }

    LoyaltyPrograms:
      type: object
      description: "Solo los programas activos traen sus reglas; los demás `{ enabled: false }`."
      properties:
        points:
          type: object
          properties:
            enabled: { type: boolean }
            earnPercent: { type: number }
            maxRedeemPercent: { type: number }
            minRedeem: { type: number }
            expiryMonths: { type: integer, nullable: true }
        stamps:
          type: object
          properties:
            enabled: { type: boolean }
            goal: { type: integer }
            reward: { type: string }

    LoyaltyLedgerEntry:
      type: object
      properties:
        _id: { type: string }
        program: { type: string, enum: [points, stamps] }
        delta: { type: number }
        balanceAfter: { type: number }
        reason: { type: string, enum: [earn, redeem, refund, reverse, expire, adjust, reward, reward_redeemed] }
        order: { type: string, nullable: true }
        appointment: { type: string, nullable: true }
        note: { type: string }
        by: { type: object, nullable: true, properties: { name: { type: string } } }
        createdAt: { type: string, format: date-time }

    LoyaltyAccountDetail:
      type: object
      properties:
        customer: { type: object, properties: { _id: { type: string }, name: { type: string }, email: { type: string } } }
        points: { type: number }
        stamps: { type: integer }
        rewardsAvailable: { type: integer }
        goal: { type: integer }
        reward: { type: string }
        pointsExpireAt: { type: string, format: date-time, nullable: true }
        ledger:
          type: array
          items: { $ref: "#/components/schemas/LoyaltyLedgerEntry" }

    PaymentProof:
      type: object
      properties:
        _id:
          type: string
        mimeType:
          type: string
          enum: [image/jpeg, image/png, application/pdf]
        size:
          type: integer
        originalName:
          type: string
        uploadedBy:
          type: string
          enum: [customer, staff]
        uploadedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, approved, rejected]
        reviewedAt:
          type: string
          format: date-time
        rejectReason:
          type: string

    OrderShipment:
      type: object
      description: Guía de envío. shippedAt/deliveredAt los pone el servidor al pasar a shipped/delivered.
      properties:
        carrier:
          type: string
          maxLength: 80
        trackingNumber:
          type: string
          maxLength: 120
        trackingUrl:
          type: string
          maxLength: 500
          description: http(s); si viene, el correo de "va en camino" lleva botón de rastreo.
        shippedAt:
          type: string
          format: date-time
          readOnly: true
        deliveredAt:
          type: string
          format: date-time
          readOnly: true

    OrderCreateRequest:
      type: object
      description: total/productName/unitPrice/subtotal/orderNumber se calculan en el servidor a partir del precio actual de cada producto — no se aceptan del cliente.
      properties:
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        customer:
          type: string
          description: Opcional — ObjectId de un User existente.
        items:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              product:
                type: string
              variant:
                type: string
                description: Obligatorio si el producto tiene variantes. El precio sale de la variante.
              quantity:
                type: integer
                minimum: 1
            required: [product, quantity]
        shippingAddress:
          $ref: "#/components/schemas/ShippingAddress"
        notes:
          type: string
      required: [customerName, customerEmail, items]

    PublicCheckoutRequest:
      type: object
      description: >
        Igual que OrderCreateRequest más la entrega y el pago elegidos. Un
        `customer` en este body siempre se ignora — la única forma de vincular
        el pedido a una cuenta es un header `Authorization: Bearer <token>`
        opcional (ver el endpoint POST /api/orders/public). Se valida contra
        StoreConfig (homeDeliveryEnabled, pickupPoints, paymentMethods):
        `400 DELIVERY_METHOD_UNAVAILABLE`, `400 PICKUP_POINT_UNAVAILABLE`,
        `400 PAYMENT_METHOD_UNAVAILABLE`. Compatibilidad: sin
        `deliveryMethod`, `paymentMethod: pickup` significa recoger.
      properties:
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        items:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              product:
                type: string
              variant:
                type: string
                description: Obligatorio si el producto tiene variantes. El precio sale de la variante.
              quantity:
                type: integer
                minimum: 1
            required: [product, quantity]
        deliveryMethod:
          type: string
          enum: [shipping, pickup]
          default: shipping
        pickupPointId:
          type: string
          description: >-
            Id de StoreConfig.pickupPoints; requerido con deliveryMethod pickup
            si la tienda tiene puntos de venta activos.
        paymentMethod:
          type: string
          default: transfer
          description: >-
            Id de un método activo de StoreConfig.paymentMethods que aplique a
            la entrega elegida (los de GET /api/store-config/public).
        shippingAddress:
          allOf:
            - $ref: "#/components/schemas/ShippingAddress"
          description: Todos los campos (menos interiorNumber) son requeridos con deliveryMethod shipping.
        notes:
          type: string
        couponCode:
          type: string
          description: >-
            Código de cupón (packages/core-api/lib/coupons.js). El descuento se
            calcula en el servidor sobre el subtotal de productos; free_shipping
            deja el envío en $0. Un cupón inválido rechaza el pedido con el
            código del cupón (COUPON_NOT_FOUND, COUPON_EXPIRED,
            COUPON_MIN_PURCHASE, COUPON_EXHAUSTED, COUPON_LIMIT_PER_CUSTOMER…).
        usePoints:
          type: number
          minimum: 0.01
          description: >-
            Puntos de lealtad a usar (1 punto = $1), solo con sesión (401
            LOGIN_REQUIRED_FOR_POINTS) y con el programa activo (400
            LOYALTY_NOT_AVAILABLE). Tope = maxRedeemPercent del subtotal ya con
            cupón (400 POINTS_OVER_LIMIT), mínimo minRedeem (400
            POINTS_UNDER_MINIMUM). Se apartan de forma atómica al crear el
            pedido; sin saldo suficiente → 409 INSUFFICIENT_POINTS. total =
            productos − cupón − puntos + envío.
        giftCardCode:
          type: string
          description: >-
            Tarjeta de regalo (Fase 5.2): paga lo que quede (productos − cupón − puntos + envío)
            hasta su saldo; se cobra de forma atómica al crear el pedido. Si cubre todo, el pedido
            entra `confirmed` (total 0). Errores GIFT_CARD_NOT_FOUND (404), GIFT_CARD_NOT_ACTIVE,
            GIFT_CARD_EXPIRED, GIFT_CARD_EMPTY, GIFT_CARD_CANCELLED o GIFT_CARD_INSUFFICIENT (409).
            total = productos − cupón − puntos + envío − tarjeta.
      required: [customerName, customerEmail, items]

    OrderUpdateRequest:
      type: object
      description: >-
        Solo status/shippingAddress/notes/shipment — items/customer no se reabren
        después de creado el pedido. shipped/delivered son solo de envío a
        domicilio y ready_for_pickup/picked_up solo de recoger en tienda: la
        mezcla responde 400 STATUS_NOT_FOR_DELIVERY_METHOD. Al cambiar a
        confirmed, shipped, delivered, ready_for_pickup, picked_up o cancelled
        se avisa al cliente por correo (StoreConfig.orderNotifications);
        confirmar a mano aprueba los comprobantes pendientes.
      properties:
        status:
          type: string
          enum: [pending, payment_review, confirmed, processing, shipped, delivered, ready_for_pickup, picked_up, cancelled]
        shippingAddress:
          $ref: "#/components/schemas/ShippingAddress"
        notes:
          type: string
        shipment:
          type: object
          properties:
            carrier:
              type: string
            trackingNumber:
              type: string
            trackingUrl:
              type: string

    StoreTheme:
      type: object
      properties:
        primaryColor:
          type: string
          example: "#0B1F3A"
        secondaryColor:
          type: string
          example: "#F2F5F9"
        accentColor:
          type: string
          example: "#FF6B00"
        fontFamilyHeading:
          type: string
        fontFamilyBody:
          type: string

    SocialLinks:
      type: object
      properties:
        whatsapp:
          type: string
        instagram:
          type: string
        facebook:
          type: string
        threads:
          type: string

    LegalIdentity:
      type: object
      properties:
        legalName:
          type: string
        rfc:
          type: string
        legalRepresentative:
          type: string
        legalAddress:
          type: string
        legalEmail:
          type: string
        legalPhone:
          type: string

    HeroSlide:
      type: object
      properties:
        title:
          type: string
          maxLength: 160
        description:
          type: string
          maxLength: 300
        sortOrder:
          type: integer
          minimum: 0
        isActive:
          type: boolean
        mediaType:
          type: string
          enum: [none, image, gif, video_direct, video_youtube]
          default: none
          description: >
            Tipo de media del header. "image"/"gif" leen mediaPath (subido vía
            POST /api/media); "video_direct" (enlace a
            .mp4/.webm) y "video_youtube" (enlace de YouTube) leen mediaUrl.
        mediaPath:
          type: string
          maxLength: 300
          description: Ruta relativa de uploads/ (de POST /api/media; solo image/gif).
        mediaUrl:
          type: string
          maxLength: 500
          description: URL externa del video (solo video_direct/video_youtube).
      required: [title]

    Metric:
      type: object
      properties:
        source:
          type: string
          enum: [manual, active_clients, active_containers]
          default: manual
          description: >
            "manual": value se edita a mano. "active_clients"/"active_containers": value se
            recalcula en cada GET /public a partir de datos reales (conteo de AgencyClient
            activos / contenedores corriendo vía Portainer) — el value guardado es solo un
            placeholder cuando source no es "manual".
        value:
          type: string
          maxLength: 20
          example: "99.9%"
        label:
          type: string
          maxLength: 80
        sortOrder:
          type: integer
          minimum: 0
      required: [label]

    Command:
      type: object
      properties:
        cmd:
          type: string
          maxLength: 80
          example: "desplegar hosting"
        note:
          type: string
          maxLength: 160
        icon:
          type: string
          maxLength: 60
          description: Clase de ícono FontAwesome (ej. "fas fa-server"). Opcional.
        sortOrder:
          type: integer
          minimum: 0
        isActive:
          type: boolean
      required: [cmd]

    ServiceItem:
      type: object
      properties:
        icon:
          type: string
          description: Clase de icono (ej. FontAwesome)
        route:
          type: string
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        sortOrder:
          type: integer
          minimum: 0
        isActive:
          type: boolean
      required: [title]

    PricingPlan:
      type: object
      properties:
        name:
          type: string
          maxLength: 60
        description:
          type: string
          maxLength: 300
        features:
          type: array
          maxItems: 20
          description: >-
            Características libres "Nombre: valor" (Sesiones: 4, Almacenamiento: 10 GB…).
            Reemplazan a los campos de hosting storage/emailAccounts/bandwidth/ssl: si un
            payload todavía los manda, se convierten a features al guardar (ver
            backend/scripts/migrate-pricing-plan-features.mongo.js).
          items:
            type: object
            properties:
              name: { type: string, maxLength: 60 }
              value: { type: string, maxLength: 80 }
            required: [name, value]
        originalPrice:
          type: number
          minimum: 0
          nullable: true
        price:
          type: number
          minimum: 0
          nullable: true
        discountPercent:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        featured:
          type: boolean
        extraFeaturesTitle:
          type: string
        extraFeatures:
          type: array
          items:
            type: string
        sortOrder:
          type: integer
          minimum: 0
        isActive:
          type: boolean
      required: [name]

    Faq:
      type: object
      properties:
        q:
          type: string
          maxLength: 200
        a:
          type: string
          maxLength: 1000
        sortOrder:
          type: integer
          minimum: 0
        isActive:
          type: boolean
      required: [q, a]

    TeamMember:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        role:
          type: string
        bio:
          type: string
          maxLength: 500
        email:
          type: string
        phone:
          type: string
        photoUrl:
          type: string
          example: uploads/store-config-1718282784-uuid.jpg
        sortOrder:
          type: integer
          minimum: 0
        isActive:
          type: boolean
      required: [name]

    Testimonial:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        rubro:
          type: string
        description:
          type: string
          maxLength: 500
        url:
          type: string
        photoUrl:
          type: string
          example: uploads/store-config-1718282784-uuid.jpg
        rating:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
          description: Calificación en estrellas; null = sin calificación.
        fromReview:
          type: string
          nullable: true
          description: >-
            Reseña de la que salió (POST /api/reviews/{id}/testimonial). Mandarlo de vuelta al
            guardar la lista para que la reseña no se pueda publicar dos veces.
        sortOrder:
          type: integer
          minimum: 0
        isActive:
          type: boolean
      required: [name]

    StoreConfig:
      type: object
      properties:
        storeName:
          type: string
        storeSlug:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        logoUrl:
          type: string
        theme:
          $ref: "#/components/schemas/StoreTheme"
        socialLinks:
          $ref: "#/components/schemas/SocialLinks"
        legalIdentity:
          $ref: "#/components/schemas/LegalIdentity"
        heroSlides:
          type: array
          items:
            $ref: "#/components/schemas/HeroSlide"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"
        commands:
          type: array
          items:
            $ref: "#/components/schemas/Command"
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceItem"
        pricingPlans:
          type: array
          items:
            $ref: "#/components/schemas/PricingPlan"
        commonPlanChecks:
          type: array
          items:
            type: string
        faqs:
          type: array
          items:
            $ref: "#/components/schemas/Faq"
        teamMembers:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"
        testimonials:
          type: array
          items:
            $ref: "#/components/schemas/Testimonial"
        shipping:
          type: object
          description: >-
            Envío del storefront. Se expone en GET /api/store-config/public para
            que la canasta muestre lo mismo que cobra POST /api/orders/public.
          properties:
            enabled:
              type: boolean
              description: Si los productos cobran envío.
            cost:
              type: number
              nullable: true
              minimum: 0
              example: 99
              description: Costo de envío; requerido (> 0) si enabled es true.
            freeFrom:
              type: number
              nullable: true
              minimum: 0
              example: 600
              description: >-
                Subtotal de productos (con descuentos) desde el que el envío
                es gratis. null, vacío o 0 = nunca es gratis.
        homeDeliveryEnabled:
          type: boolean
          default: true
          description: Si el checkout ofrece envío a domicilio.
        pickupPoints:
          type: array
          description: >-
            Puntos de venta para recoger. En GET /api/store-config/public solo
            vienen los activos.
          items:
            $ref: "#/components/schemas/PickupPoint"
        paymentMethods:
          type: array
          description: >-
            Métodos de pago del checkout. En GET /api/store-config/public solo
            vienen los activos; si la tienda no ha configurado ninguno, vienen
            los de default (ids "transfer" y "pickup").
          items:
            $ref: "#/components/schemas/PaymentMethod"
        maxUnitsPerProduct:
          type: integer
          nullable: true
          minimum: 0
          maximum: 9999
          example: 10
          description: >-
            Tope de piezas de un mismo producto por pedido en el storefront
            (POST /api/orders/public). null, vacío o 0 = sin tope; solo limita
            el inventario.
        orderNotifications:
          type: object
          description: >-
            Qué avisos por correo del pedido se mandan (todos true por default).
            No sale en GET /public.
          properties:
            confirmed:
              type: boolean
            proofRejected:
              type: boolean
            shipped:
              type: boolean
            delivered:
              type: boolean
            readyForPickup:
              type: boolean
            pickedUp:
              type: boolean
            cancelled:
              type: boolean
            proofUploaded:
              type: boolean
              description: A la tienda, cuando el cliente sube un comprobante.
        customerProofUpload:
          type: boolean
          default: false
          description: >-
            El cliente sube su comprobante de transferencia desde el sitio: el
            correo de confirmación y el de comprobante rechazado llevan el
            botón a FRONTEND_URL/pedido/{id}?token=… (GET
            /api/orders/{id}/summary). Encenderlo solo cuando el storefront
            tenga esa página. Sí sale en GET /public.
        lowStockAlerts:
          type: boolean
          default: true
          description: >-
            Correo a la tienda cuando un producto (o variante) pasa a stock bajo
            o se agota. No sale en GET /public.
        businessHours:
          type: array
          maxItems: 14
          description: >-
            Horario de atención, un renglón por turno (hasta dos por día, sin
            encimarse). day 0 = domingo … 6 = sábado; open/close "HH:MM" en 24 h.
            Un día sin renglones o con closed true = cerrado.
          items:
            type: object
            properties:
              day:
                type: integer
                minimum: 0
                maximum: 6
              open:
                type: string
                example: "10:00"
              close:
                type: string
                example: "19:00"
              closed:
                type: boolean
            required: [day]
        holidays:
          type: array
          maxItems: 60
          items:
            type: object
            properties:
              date:
                type: string
                example: "2026-12-25"
                description: Fecha de calendario AAAA-MM-DD (sin zona horaria).
              label:
                type: string
                maxLength: 80
            required: [date]
        location:
          type: object
          description: Ubicación del negocio (contacto y "Cómo llegar"); distinta de pickupPoints.
          properties:
            address:
              type: string
              maxLength: 400
            lat:
              type: number
              nullable: true
            lng:
              type: number
              nullable: true
            mapsUrl:
              type: string
              description: http(s)
        whatsappButton:
          type: object
          properties:
            enabled:
              type: boolean
            phone:
              type: string
              description: Lada de país + número, solo dígitos (10 a 15). Se limpian espacios y signos.
              example: "525512345678"
            defaultMessage:
              type: string
              maxLength: 300
            itemMessage:
              type: string
              maxLength: 300
              description: "{item} se reemplaza por el servicio o producto."
        privacyNotice:
          type: string
          maxLength: 50000
          description: >-
            Aviso de privacidad (HTML básico). Vacío = el storefront muestra su
            aviso por defecto, armado con legalIdentity.
        legalNotice:
          type: string
          maxLength: 50000
          description: >-
            Aviso legal (HTML básico). Vacío = el storefront muestra su aviso por
            defecto, armado con legalIdentity.
        returnsPolicy:
          type: string
          maxLength: 50000
          description: Política de devoluciones (HTML básico). Vacío = sin página.
        isActive:
          type: boolean
      required: [storeName, storeSlug]

    PickupPoint:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
          maxLength: 120
        address:
          type: string
          maxLength: 400
        schedule:
          type: string
          maxLength: 200
        instructions:
          type: string
          maxLength: 500
        lat:
          type: number
          nullable: true
          minimum: -90
          maximum: 90
        lng:
          type: number
          nullable: true
          minimum: -180
          maximum: 180
        sortOrder:
          type: integer
        isActive:
          type: boolean
      required: [name]

    PickupPointSnapshot:
      type: object
      description: Copia del punto de venta elegido, tal como estaba al hacer el pedido.
      properties:
        name:
          type: string
        address:
          type: string
        schedule:
          type: string
        instructions:
          type: string
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true

    PaymentMethod:
      type: object
      properties:
        _id:
          type: string
        type:
          type: string
          enum: [spei, manual]
          description: >-
            spei = manda por correo los datos de `spei` (o, sin CLABE propia,
            los de StoreConfig.speiPayment); manual = solo las instrucciones.
            Una pasarela se agregaría como un tipo nuevo.
        spei:
          type: object
          description: >-
            Cuenta a la que se transfiere (solo con type spei). Nunca se
            expone en GET /api/store-config/public.
          properties:
            accountHolderName:
              type: string
              maxLength: 160
            bank:
              type: string
              description: Uno de los bancos de MEXICAN_BANKS.
            clabe:
              type: string
              pattern: '^\d{18}$'
            phone:
              type: string
              maxLength: 20
        label:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 200
        instructions:
          type: string
          maxLength: 1000
        forShipping:
          type: boolean
          default: true
        forPickup:
          type: boolean
          default: true
        sortOrder:
          type: integer
        isActive:
          type: boolean
      required: [label]

    StoreConfigUpdateRequest:
      description: Todos los campos son opcionales — solo se actualizan los presentes en el body.
      allOf:
        - $ref: "#/components/schemas/StoreConfig"

    StoreConfigUpdateResponse:
      type: object
      properties:
        message:
          type: string
        storeConfig:
          $ref: "#/components/schemas/StoreConfig"
      required: [message, storeConfig]
