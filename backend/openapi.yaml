        "200":
          description: Transacción eliminada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Transacción no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Transacción no editable (no es manual)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/accounting/opening-balance:
    post:
      tags: [Accounting]
      summary: Configurar (o actualizar) el saldo inicial de la cuenta
      operationId: setOpeningBalance
      description: Idempotente — si ya existe un saldo inicial, lo actualiza en vez de duplicarlo.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  minimum: 0
                date:
                  type: string
                  format: date
              required: [amount]
      responses:
        "200":
          description: Saldo inicial actualizado
        "201":
          description: Saldo inicial configurado por primera vez
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/accounting/summary:
    get:
      tags: [Accounting]
      summary: Resumen mes a mes de ingresos/egresos (dashboard de contabilidad)
      operationId: getAccountingSummary
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: year
          schema:
            type: integer
      responses:
        "200":
          description: Resumen mensual + saldo actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountingSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/invoices:
    get:
      tags: [Invoices]
      summary: Listar facturas (filtrable por client)
      operationId: listInvoices
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: client
          schema:
            type: string
      responses:
        "200":
          description: Listado de facturas
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Invoices]
      summary: Crear factura a partir de movimientos seleccionados
      operationId: createInvoice
      description: >
        Los transactionIds deben ser ingresos (type "income") del mismo
        cliente, ninguno ya facturado, y todos del mismo mes calendario (UTC)
        — si no, responde 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceCreateRequest"
      responses:
        "201":
          description: Factura creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  invoice:
                    $ref: "#/components/schemas/Invoice"
        "400":
          description: transactionIds inválidos, mezclan clientes/tipos/meses, o alguno ya está facturado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Cliente o algún movimiento no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/invoices/{id}:
    get:
      tags: [Invoices]
      summary: Obtener una factura por id
      operationId: getInvoice
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Factura
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoice:
                    $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Factura no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Invoices]
      summary: Editar una factura ya emitida (edición acotada)
      operationId: updateInvoice
      description: >
        Solo se pueden cambiar el concepto de cada renglón (items, posicional —
        items[i].concept reemplaza el renglón i) y la fecha de emisión. El
        monto, el cliente, el folio y los movimientos cubiertos no se editan
        acá; para eso se cancela y se re-emite. Si se envía `items`, su longitud
        debe ser exactamente la de invoice.items.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceUpdateRequest"
      responses:
        "200":
          description: Factura actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  invoice:
                    $ref: "#/components/schemas/Invoice"
        "400":
          description: Payload inválido o largo de items distinto al de la factura
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Factura no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/invoices/{id}/pdf:
    get:
      tags: [Invoices]
      summary: Generar y descargar el PDF de la factura (sin validez fiscal)
      operationId: getInvoicePdf
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PDF generado
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Factura no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/infra/status:
    get:
      tags: [Infra]
      summary: Estado de las herramientas de infraestructura del servidor
      operationId: getInfraStatus
      description: >
        Módulo `panel` de los permisos por tienda (por default solo super_admin). Hace un GET (timeout 5 s) a cada herramienta del
        servidor (Portainer, NPM, deploy, FTP, Mongo, PMA). 502/503/504 del
        proxy o sin respuesta = `down`; cualquier otra respuesta = `up`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Estado de cada herramienta
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        label:
                          type: string
                        url:
                          type: string
                        status:
                          type: string
                          enum: [up, down]
                        httpStatus:
                          type: integer
                        reason:
                          type: string
                          enum: [gateway_error, timeout, unreachable]
                        latencyMs:
                          type: integer
                  checkedAt:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/infra/metrics:
    get:
      tags: [Infra]
      summary: Uso de recursos del servidor (vía Portainer)
      operationId: getInfraMetrics
      description: >
        Módulo `panel` de los permisos por tienda (por default solo super_admin). CPU/memoria/disco/red aproximados sumando el uso de
        todos los contenedores del host (ver backend/utils/portainerClient.js).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Métricas del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  cpu:
                    type: object
                    properties:
                      percent:
                        type: number
                      cores:
                        type: integer
                  memory:
                    $ref: "#/components/schemas/InfraUsage"
                  disk:
                    $ref: "#/components/schemas/InfraUsage"
                  network:
                    type: object
                    properties:
                      download:
                        $ref: "#/components/schemas/InfraTransfer"
                      upload:
                        $ref: "#/components/schemas/InfraTransfer"
                  containersRunning:
                    type: integer
                  checkedAt:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          description: Portainer no configurado (PORTAINER_NOT_CONFIGURED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: No fue posible consultar Portainer (PORTAINER_UNREACHABLE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/products/public:
    get:
      tags: [Products]
      summary: Catálogo público (storefront)
      operationId: listPublicProducts
      security: []
      description: >
        Sin autenticación. Solo productos con `isActive: true` Y con inventario
        cargado con quantity > 0 — un producto sin registro de inventario se
        considera sin existencias, no se muestra. Con variantes, basta una
        variante activa con existencias. Consumido por frontend-user para la
        tienda pública. Cada producto trae `maxQty`/`purchaseLimit` y, si tiene
        variantes, `variants`/`priceRange` (ver PublicProduct). Filtros de
        precio, orden y paginación se aplican después del filtro de stock, así
        que `total` cuenta solo lo visible. Sin `limit` devuelve todo.
      parameters:
        - in: query
          name: category
          description: Id o slug de la categoría. Inexistente o inactiva = lista vacía.
          schema:
            type: string
        - in: query
          name: q
          description: Busca en nombre, descripción, SKU y SKU de variantes (máx. 100 caracteres).
          schema:
            type: string
        - in: query
          name: featured
          schema:
            type: string
            enum: ["true"]
        - in: query
          name: minPrice
          description: Precio efectivo mínimo (con variantes, cualquiera disponible).
          schema:
            type: number
        - in: query
          name: maxPrice
          schema:
            type: number
        - in: query
          name: sort
          schema:
            type: string
            enum: [relevance, price_asc, price_desc, newest, name]
            default: relevance
          description: relevance = sortOrder del producto y luego nombre.
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Listado de productos activos
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicProduct"
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                    nullable: true
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/products/public/{id}:
    get:
      tags: [Products]
      summary: Obtener un producto público (storefront)
      operationId: getPublicProduct
      security: []
      description: >
        Sin autenticación. 404 tanto si el producto no existe, como si está
        inactivo, como si no tiene existencias — no distingue entre los tres,
        para no filtrar información.
      parameters:
        - $ref: "#/components/parameters/ProductIdParam"
      responses:
        "200":
          description: Producto activo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Producto no encontrado o inactivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/products/public/{id}/related:
    get:
      tags: [Products]
      summary: Productos relacionados (misma categoría)
      operationId: listRelatedProducts
      security: []
      description: >
        Productos activos y con existencias de la misma categoría, sin el
        propio, por sortOrder y nombre. Producto sin categoría = lista vacía.
      parameters:
        - $ref: "#/components/parameters/ProductIdParam"
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 4
      responses:
        "200":
          description: Relacionados
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Producto no encontrado o inactivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/categories/public:
    get:
      tags: [Categories]
      summary: Categorías públicas (storefront / app)
      operationId: listPublicCategories
      security: []
      description: Solo activas, por sortOrder y nombre.
      parameters:
        - in: query
          name: kind
          schema:
            type: string
            enum: [product, service]
            default: product
        - in: query
          name: featured
          schema:
            type: string
            enum: ["true"]
      responses:
        "200":
          description: Categorías
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicCategory"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/categories:
    get:
      tags: [Categories]
      summary: Listar categorías (staff)
      operationId: listCategories
      description: >-
        Con `kind=product`, lectura con el módulo `products`, o con `inventory`, `orders` o
        `appConfig` aunque Productos no esté contratado. Con `kind=service`, con `services` o
        `appointments`. Trae `productCount` (productos o servicios de la categoría, según el kind).
      parameters:
        - in: query
          name: kind
          schema:
            type: string
            enum: [product, service]
            default: product
        - in: query
          name: isActive
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: Categorías
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Categories]
      summary: Crear categoría
      operationId: createCategory
      description: Módulo `products`. Sin `slug` se genera del nombre ("Café de Olla" → "cafe-de-olla").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  category:
                    $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: CATEGORY_SLUG_TAKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/categories/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      tags: [Categories]
      summary: Obtener categoría
      operationId: getCategory
      responses:
        "200":
          description: Categoría
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: CATEGORY_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Categories]
      summary: Actualizar categoría
      operationId: updateCategory
      description: Módulo `products` (o `services` si la categoría es kind service). `kind` no se puede cambiar. Cambiar el slug no actualiza las secciones del home de la app que lo usan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
      responses:
        "200":
          description: Actualizada
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: CATEGORY_NOT_FOUND
        "409":
          description: CATEGORY_SLUG_TAKEN
    delete:
      tags: [Categories]
      summary: Eliminar categoría
      operationId: deleteCategory
      description: Módulo `products` (o `services` si es kind service). Bloqueado (409 CATEGORY_HAS_PRODUCTS / CATEGORY_HAS_SERVICES) si algún producto o servicio la usa.
      responses:
        "200":
          description: Eliminada
        "404":
          description: CATEGORY_NOT_FOUND
        "409":
          description: CATEGORY_HAS_PRODUCTS o CATEGORY_HAS_SERVICES

