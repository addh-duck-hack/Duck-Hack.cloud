        - $ref: "#/components/parameters/ProductIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateRequest"
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  product:
                    $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Producto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Products]
      summary: Eliminar producto
      operationId: deleteProduct
      description: Módulo `products` de los permisos por tienda. Bloqueado si el producto tiene inventario o pedidos ligados.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductIdParam"
      responses:
        "200":
          description: Producto eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Producto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Producto con inventario o pedidos ligados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/services/public:
    get:
      tags: [Services]
      summary: Catálogo público de servicios
      operationId: listPublicServices
      security: []
      description: Activos y con categoría activa (o sin categoría), ordenados por categoría y luego por servicio. No expone anticipo ni tiempo entre citas.
      parameters:
        - { in: query, name: category, schema: { type: string }, description: Id o slug de una categoría kind service. }
        - { in: query, name: bookable, schema: { type: string, enum: ["true"] }, description: Solo los que se agendan en línea. }
      responses:
        "200":
          description: Servicios
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicService"

  /api/services/public/{id}/media:
    get:
      tags: [Services]
      summary: Fotos y videos públicos de un servicio
      operationId: getPublicServiceMedia
      security: []
      description: >-
        Fotos y videos de citas con este servicio cuya clienta autorizó subirlos al sitio
        (`Appointment.mediaConsent`). Solo `path` y `kind` (nada de la clienta), los más recientes
        primero; se omiten los archivos que ya no existen. Servicio inactivo → lista vacía.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 48, default: 24 } }
      responses:
        "200":
          description: "`{ items: [{ path, kind: image|gif|video }] }`"
        "400":
          description: INVALID_OBJECT_ID

  /api/services/public/{id}:
    get:
      tags: [Services]
      summary: Servicio público
      operationId: getPublicService
      security: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Servicio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicService"
        "404":
          description: SERVICE_NOT_FOUND (no existe, inactivo o de categoría inactiva)

  /api/services:
    get:
      tags: [Services]
      summary: Listar servicios (staff)
      operationId: listServices
      description: Módulo `services`, o `appointments` aunque Servicios no esté contratado.
      parameters:
        - { in: query, name: isActive, schema: { type: string, enum: ["true", "false"] } }
        - { in: query, name: category, schema: { type: string } }
      responses:
        "200":
          description: Servicios (categoría poblada)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Service"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Services]
      summary: Crear servicio
      operationId: createService
      description: Módulo `services`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequest"
      responses:
        "201":
          description: Creado
        "400":
          description: VALIDATION_ERROR o CATEGORY_NOT_FOUND (la categoría debe ser kind service)

  /api/services/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [Services]
      summary: Obtener servicio
      operationId: getService
      responses:
        "200":
          description: Servicio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          description: SERVICE_NOT_FOUND
    put:
      tags: [Services]
      summary: Actualizar servicio
      operationId: updateService
      description: Módulo `services`. Solo cambia lo que se manda.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequest"
      responses:
        "200":
          description: Actualizado
        "400":
          description: VALIDATION_ERROR o CATEGORY_NOT_FOUND
        "404":
          description: SERVICE_NOT_FOUND
    delete:
      tags: [Services]
      summary: Eliminar servicio
      operationId: deleteService
      description: Módulo `services`. Bloqueado (409 SERVICE_IN_USE) si alguna cita lo usa; en ese caso se desactiva. Se quita de las especialistas que lo hacían.
      responses:
        "200":
          description: Eliminado
        "409":
          description: SERVICE_IN_USE

  /api/appointments:
    get:
      tags: [Appointments]
      summary: Agenda del panel (por rango)
      operationId: listAppointments
      description: >-
        Módulo `appointments`. Citas que se cruzan con [from, to) (hasta 62 días). Una
        collaborator solo ve las de su especialista (sin especialista ligada, lista vacía).
      parameters:
        - { in: query, name: from, required: true, schema: { type: string, format: date-time } }
        - { in: query, name: to, required: true, schema: { type: string, format: date-time } }
        - { in: query, name: specialist, schema: { type: string } }
        - { in: query, name: status, schema: { type: string }, description: "Uno o varios separados por coma." }
      responses:
        "200":
          description: Citas (con la especialista y su color)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Appointment" }
        "400":
          description: VALIDATION_ERROR (rango)
    post:
      tags: [Appointments]
      summary: Alta manual (teléfono / mostrador)
      operationId: createAppointment
      description: >-
        Módulo `appointments` (collaborator solo en su agenda). Sin anticipación, límite de días
        ni paso; cualquier servicio activo (también los que no se agendan en línea). Fuera del
        horario de la especialista o sobre un bloqueo → 409 OUTSIDE_HOURS; con un servicio que
        ella no tiene asignado → 409 SPECIALIST_DOESNT_DO_SERVICE; con `force: true` se guarda
        igual. Empalmada con otra cita, nunca (409 SLOT_TAKEN). Con `requireDeposit: true` la cita
        entra `pending_deposit` con el anticipo de sus servicios (400 DEPOSIT_NOT_CONFIGURED si
        ninguno lo pide).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                services: { type: array, items: { type: string }, maxItems: 5 }
                specialist: { type: string }
                start: { type: string, format: date-time }
                customerName: { type: string }
                customerEmail: { type: string, description: Opcional. }
                customerPhone: { type: string, description: "Opcional, 10 dígitos." }
                notes: { type: string }
                staffNotes: { type: string }
                source: { type: string, enum: [phone, walk_in] }
                status: { type: string, enum: [confirmed, pending] }
                requireDeposit: { type: boolean, description: "Pedir el anticipo de los servicios (Fase 5.1)." }
                force: { type: boolean }
                notifyCustomer: { type: boolean, default: true, description: false = no mandar el correo a la clienta. }
              required: [services, specialist, start, customerName]
      responses:
        "201":
          description: Agendada
        "403":
          description: APPOINTMENTS_MANAGER_ONLY (collaborator en agenda ajena)
        "409":
          description: SLOT_TAKEN, OUTSIDE_HOURS o SPECIALIST_DOESNT_DO_SERVICE

  /api/appointments/list:
    get:
      tags: [Appointments]
      summary: Listado de citas del panel (paginado)
      operationId: listAppointmentsPaged
      description: >-
        Módulo `appointments`. Sin límite de rango, por pestaña: `today` (el día en la zona de la
        agenda), `upcoming` (desde ahora, la más cercana primero) o `past` (la más reciente
        primero). `counts` trae cuántas hay en cada pestaña con los mismos filtros. Mismo alcance
        que la agenda: una collaborator solo ve su especialista (sin especialista ligada, vacío).
      parameters:
        - { in: query, name: when, schema: { type: string, enum: [today, upcoming, past], default: upcoming } }
        - { in: query, name: status, schema: { type: string }, description: "Uno o varios separados por coma." }
        - { in: query, name: specialist, schema: { type: string } }
        - { in: query, name: q, schema: { type: string, maxLength: 80 }, description: "Nombre, correo, servicio o teléfono (3+ dígitos)." }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: "`{ items, total, page, pages, counts: { today, upcoming, past }, timezone }`"
        "400":
          description: VALIDATION_ERROR (specialist no válido)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: MODULE_NOT_ALLOWED

  /api/appointments/{id}/media-consent:
    put:
      tags: [Appointments]
      summary: Registrar si la clienta autoriza subir sus fotos al sitio
      operationId: setAppointmentMediaConsent
      description: >-
        Módulo `appointments` (una collaborator, solo citas de su especialista). Sin autorización
        no se pueden subir medios. No se puede retirar mientras la cita tenga medios
        (`409 MEDIA_ATTACHED`): primero se quitan.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [given], properties: { given: { type: boolean } } }
      responses:
        "200":
          description: "`{ message, appointment }`"
        "400":
          description: VALIDATION_ERROR
        "404":
          description: APPOINTMENT_NOT_FOUND
        "409":
          description: MEDIA_ATTACHED

  /api/appointments/{id}/media:
    post:
      tags: [Appointments]
      summary: Agregar una foto o video a la cita
      operationId: addAppointmentMedia
      description: >-
        Multipart, campo `media`. Mismo procesamiento que POST /api/media (JPG/PNG re-codificados,
        GIF, MP4/WebM por firma; imágenes hasta 10 MB, videos hasta 50 MB) y queda en la biblioteca
        de medios con el título "Cita #N · clienta". Requiere `mediaConsent.given` (si no, 409
        MEDIA_CONSENT_REQUIRED, antes de leer el archivo). Hasta 30 por cita (409 MEDIA_LIMIT).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [media], properties: { media: { type: string, format: binary } } }
      responses:
        "201":
          description: "`{ message, appointment }`"
        "400":
          description: FILE_REQUIRED / INVALID_FILE_TYPE
        "404":
          description: APPOINTMENT_NOT_FOUND
        "409":
          description: MEDIA_CONSENT_REQUIRED / MEDIA_LIMIT
        "413":
          description: FILE_TOO_LARGE

  /api/appointments/{id}/media/{fileName}:
    delete:
      tags: [Appointments]
      summary: Quitar una foto o video de la cita
      operationId: removeAppointmentMedia
      description: >-
        Sale de la cita y, si nada más lo usa (productos, Configurar tienda, home de la app, otra
        cita, la galería del sitio), también se borra de la biblioteca de medios. El mensaje dice
        cuál de los dos pasó.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: fileName, required: true, schema: { type: string } }
      responses:
        "200":
          description: "`{ message, appointment }`"
        "400":
          description: INVALID_FILE_NAME
        "404":
          description: APPOINTMENT_NOT_FOUND / MEDIA_NOT_FOUND

  /api/appointments/{id}/reviews:
    get:
      tags: [Appointments]
      summary: Reseñas de la cita y de la clienta
      operationId: getAppointmentReviews
      description: >-
        La reseña de esta cita y hasta 20 más de la misma clienta (por cuenta o correo: otras citas y
        productos). Sin el módulo `reviews` contratado → `{ enabled: false }`. Moderar sigue siendo
        PUT /api/reviews/{id} (módulo `reviews`).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: "`{ enabled, review, history: [{ _id, kind, targetId, label, rating, comment, status, rejectionReason, createdAt }] }`"
        "404":
          description: APPOINTMENT_NOT_FOUND

  /api/appointments/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [Appointments]
      summary: Detalle de una cita (staff)
      operationId: getAppointment
      responses:
        "200":
          description: Cita
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "404":
          description: APPOINTMENT_NOT_FOUND (o de otra especialista, para una collaborator)
    put:
      tags: [Appointments]
      summary: Actualizar cita (staff)
      operationId: updateAppointment
      description: >-
        Cualquiera de start, specialist, services (recalcula fin y total), status, datos de
        contacto, notes, staffNotes, cancelReason, force. Si cambia horario, especialista o
        servicios, o se reactiva una cancelada, se revisa el lugar (mismas reglas que el alta);
        lo demás se guarda directo. Queda en `history`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                start: { type: string, format: date-time }
                specialist: { type: string }
                services: { type: array, items: { type: string } }
                status: { type: string, enum: [pending_deposit, deposit_review, pending, confirmed, completed, no_show, cancelled] }
                customerName: { type: string }
                customerEmail: { type: string }
                customerPhone: { type: string }
                notes: { type: string }
                staffNotes: { type: string }
                cancelReason: { type: string }
                force: { type: boolean }
                notifyCustomer:
                  type: boolean
                  default: true
                  description: >-
                    Un solo correo a la clienta por cambio (cancelada > reprogramada > confirmada);
                    false = sin correo. Notas, contacto y completada/no asistió no mandan correo.
      responses:
        "200":
          description: Actualizada
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: SLOT_TAKEN, OUTSIDE_HOURS o SPECIALIST_DOESNT_DO_SERVICE

  /api/appointments/availability:
    get:
      tags: [Appointments]
      summary: Horarios libres
      operationId: getAvailability
      security: []
      description: >-
        Horario del negocio ∩ especialista − festivos − citas (con su tiempo entre citas) −
        bloqueos, cada `slotStepMin`, desde ahora + `minNoticeMin` hasta hoy + `maxDaysAhead`.
        Duración = suma de los servicios; tiempo entre citas = el mayor. Con `date`, los
        horarios del día; con `from`/`to` (hasta 62 días), qué días tienen lugar. Rate limit
        300 / 10 min.
      parameters:
        - { in: query, name: services, required: true, schema: { type: string }, description: "Ids separados por coma, en orden (máx. 5)." }
        - { in: query, name: specialist, schema: { type: string }, description: "Id o \"any\" (default)." }
        - { in: query, name: date, schema: { type: string, format: date } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        "200":
          description: "`slots` (con date) o `days` (con from/to)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  timezone: { type: string }
                  durationMin: { type: integer }
                  total: { type: number }
                  depositAmount: { type: number, description: "Anticipo de esos servicios (0 = no piden)." }
                  date: { type: string }
                  slots:
                    type: array
                    items:
                      type: object
                      properties:
                        start: { type: string, format: date-time }
                        time: { type: string, example: "10:30", description: Hora local de la tienda. }
                        specialists: { type: array, items: { type: string } }
                  days:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string }
                        available: { type: boolean }
                        slots: { type: integer }
        "400":
          description: VALIDATION_ERROR, SERVICE_NOT_AVAILABLE, SPECIALIST_NOT_AVAILABLE o SPECIALIST_REQUIRED (sin "cualquiera")

  /api/appointments/public:
    post:
      tags: [Appointments]
      summary: Agendar desde el sitio
      operationId: createPublicAppointment
      security: []
      description: >-
        Bearer opcional de clienta (la cita queda en su cuenta). "any" asigna a la especialista
        con menos citas ese día. Un candado por especialista evita citas empalmadas; dentro
        se vuelve a revisar la disponibilidad. Estado `confirmed` o `pending` según
        `autoConfirm`; si los servicios piden anticipo y la tienda tiene cuenta SPEI,
        `pending_deposit` con `deposit` (monto, fecha límite y cuenta; el correo lleva los datos
        para transferir). Manda el correo a la clienta (.ics + Google Calendar + enlace
        FRONTEND_URL/cita/<id>?token=…, ruta que cada storefront debe implementar) y el aviso
        al negocio. Devuelve `appointmentAccessToken` (header X-Appointment-Token para
        ver/cancelar/reprogramar sin cuenta; vence 30 días después de la cita). Rate limit 20 / 10 min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                services: { type: array, items: { type: string }, maxItems: 5 }
                specialist: { type: string, description: "Id o \"any\"." }
                start: { type: string, format: date-time }
                customerName: { type: string }
                customerEmail: { type: string }
                customerPhone: { type: string, description: 10 dígitos. }
                notes: { type: string, maxLength: 500 }
              required: [services, start, customerName, customerEmail, customerPhone]
      responses:
        "201":
          description: Agendada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  appointment: { $ref: "#/components/schemas/CustomerAppointment" }
                  appointmentAccessToken: { type: string }
        "400":
          description: VALIDATION_ERROR, SERVICE_NOT_AVAILABLE, SPECIALIST_NOT_AVAILABLE o SPECIALIST_REQUIRED
        "409":
          description: >-
            SLOT_TAKEN (ocupado, fuera de horario, no alineado o fuera de anticipación / días) o
            DEPOSIT_TOO_LATE (los servicios piden anticipo y ya no hay tiempo antes del corte)
        "503":
          description: TRY_AGAIN (no se pudo tomar el candado)

  /api/appointments/public/{id}:
    get:
      tags: [Appointments]
      summary: Ver mi cita
      operationId: getPublicAppointment
      security: []
      description: Con X-Appointment-Token, o Bearer de la dueña (cuenta ligada o mismo correo).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: header, name: X-Appointment-Token, schema: { type: string } }
      responses:
        "200":
          description: Cita (sin notas internas)
          content:
            application/json:
              schema:
                type: object
                properties:
                  appointment: { $ref: "#/components/schemas/CustomerAppointment" }
        "401":
          description: APPOINTMENT_TOKEN_INVALID, TOKEN_REQUIRED o TOKEN_INVALID_OR_EXPIRED
        "404":
          description: APPOINTMENT_NOT_FOUND

  /api/appointments/public/{id}/cancel:
    post:
      tags: [Appointments]
      summary: Cancelar mi cita
      operationId: cancelPublicAppointment
      security: []
      description: Mismo acceso que GET. Solo pending/confirmed y hasta `minHoursToChange` horas antes.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        "200":
          description: Cancelada
        "409":
          description: APPOINTMENT_NOT_CHANGEABLE o CHANGE_WINDOW_CLOSED

  /api/appointments/public/{id}/confirm-attendance:
    post:
      tags: [Appointments]
      summary: Confirmar asistencia (desde el recordatorio)
      operationId: confirmAppointmentAttendance
      security: []
      description: >-
        Mismo acceso que GET /public/{id} (X-Appointment-Token o sesión de la dueña). Marca
        `attendanceConfirmedAt` (idempotente). Solo citas por venir en pending/confirmed. El
        enlace del correo de recordatorio lleva a FRONTEND_URL/cita/<id>?token=…&accion=confirmar;
        el storefront llama a este endpoint con un botón (el clic del correo no confirma solo).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Confirmada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  appointment: { $ref: "#/components/schemas/CustomerAppointment" }
        "401":
          description: APPOINTMENT_TOKEN_INVALID o TOKEN_REQUIRED
        "409":
          description: APPOINTMENT_NOT_CHANGEABLE (cancelada, completada o ya pasó)

  /api/appointments/public/{id}/deposit-proof:
    post:
      tags: [Appointments]
      summary: Subir el comprobante del anticipo
      operationId: uploadAppointmentDepositProof
      security: []
      description: >-
        Fase 5.1. Mismo acceso que GET /public/{id} (X-Appointment-Token o sesión de la dueña).
        Multipart con el archivo en `file` (JPG/PNG/PDF, hasta 8 MB, carpeta privada). Solo citas
        pending_deposit / deposit_review con anticipo, hasta 10 comprobantes; la cita pasa a
        deposit_review y se avisa al negocio. Rate limit 20 / 15 min.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: header, name: X-Appointment-Token, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
              required: [file]
      responses:
        "201":
          description: "Recibido: `{ message, appointment }` (CustomerAppointment)"
        "400":
          description: Archivo no válido
        "401":
          description: APPOINTMENT_TOKEN_INVALID o TOKEN_REQUIRED
        "409":
          description: APPOINTMENT_NOT_AWAITING_DEPOSIT o TOO_MANY_PAYMENT_PROOFS

  /api/appointments/{id}/deposit-proof:
    post:
      tags: [Appointments]
      summary: Subir el comprobante del anticipo a nombre de la clienta (staff)
      operationId: uploadAppointmentDepositProofStaff
      description: Módulo `appointments`. Igual que la ruta pública; queda `uploadedBy staff`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
              required: [file]
      responses:
        "201":
          description: "`{ message, appointment }` (Appointment)"
        "409":
          description: APPOINTMENT_NOT_AWAITING_DEPOSIT o TOO_MANY_PAYMENT_PROOFS

  /api/appointments/{id}/deposit-proofs/{proofId}/file:
    get:
      tags: [Appointments]
      summary: Archivo de un comprobante de anticipo (staff)
      operationId: getAppointmentDepositProofFile
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: proofId, required: true, schema: { type: string } }
      responses:
        "200":
          description: El archivo (inline, sin caché)
        "404":
          description: PAYMENT_PROOF_NOT_FOUND o PAYMENT_PROOF_FILE_NOT_FOUND

  /api/appointments/{id}/deposit-proofs/{proofId}/review:
    post:
      tags: [Appointments]
      summary: Aprobar o rechazar un comprobante de anticipo
      operationId: reviewAppointmentDepositProof
      description: >-
        Módulo `appointments`. Aprobar marca `depositPaidAt` y confirma la cita (o la deja
        `pending` si la agenda no confirma sola); correo "Recibimos tu anticipo". Rechazar (con
        motivo, se le manda a la clienta) la regresa a pending_deposit con una fecha límite nueva
        si no quedan otros comprobantes por revisar.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: proofId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason: { type: string, maxLength: 500 }
              required: [decision]
      responses:
        "200":
          description: "`{ message, appointment }` (Appointment)"
        "400":
          description: VALIDATION_ERROR (decisión o motivo faltante)
        "404":
          description: PAYMENT_PROOF_NOT_FOUND
        "409":
          description: PAYMENT_PROOF_ALREADY_REVIEWED

  /api/appointments/public/{id}/reschedule:
    post:
      tags: [Appointments]
      summary: Reprogramar mi cita
      operationId: reschedulePublicAppointment
      security: []
      description: >-
        Mismos servicios; sin `specialist` se queda con la misma ("any" busca entre las que hacen
        todos). Política de horas sobre la cita actual y reglas de agendado sobre la nueva.
        Devuelve un token nuevo.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                start: { type: string, format: date-time }
                specialist: { type: string }
              required: [start]
      responses:
        "200":
          description: Reprogramada
        "400":
          description: VALIDATION_ERROR o SPECIALIST_NOT_AVAILABLE
        "409":
          description: SLOT_TAKEN, APPOINTMENT_NOT_CHANGEABLE o CHANGE_WINDOW_CLOSED

  /api/appointments/mine:
    get:
      tags: [Appointments]
      summary: Mis citas
      operationId: listMyAppointments
      description: Con sesión. Por cuenta ligada o mismo correo (incluye las agendadas como invitada).
      parameters:
        - { in: query, name: scope, schema: { type: string, enum: [upcoming, past] } }
      responses:
        "200":
          description: Citas
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CustomerAppointment" }

  /api/appointments/specialists/public:
    get:
      tags: [Appointments]
      summary: Especialistas (público)
      operationId: listPublicSpecialists
      security: []
      parameters:
        - { in: query, name: services, schema: { type: string }, description: "Ids separados por coma: solo las que hacen TODOS esos servicios." }
      responses:
        "200":
          description: Activas, por orden
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicSpecialist"
        "400":
          description: VALIDATION_ERROR (services no válido)

  /api/appointments/settings/public:
    get:
      tags: [Appointments]
      summary: Reglas de la agenda para el storefront
      operationId: getPublicAppointmentSettings
      security: []
      responses:
        "200":
          description: Sin autoConfirm ni notifyEmail
          content:
            application/json:
              schema:
                type: object
                properties:
                  slotStepMin: { type: integer }
                  minNoticeMin: { type: integer }
                  maxDaysAhead: { type: integer }
                  minHoursToChange: { type: integer }
                  allowAnySpecialist: { type: boolean }
                  timezone: { type: string }

  /api/appointments/settings:
    get:
      tags: [Appointments]
      summary: Ajustes de la agenda
      operationId: getAppointmentSettings
      description: Módulo `appointments` (cualquier rol con el módulo).
      responses:
        "200":
          description: Ajustes efectivos (los guardados sobre los defaults)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentSettings"
    put:
      tags: [Appointments]
      summary: Guardar ajustes de la agenda
      operationId: updateAppointmentSettings
      description: Solo super_admin/store_admin. Solo cambia lo que se manda.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentSettings"
      responses:
        "200":
          description: Guardado
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: APPOINTMENTS_MANAGER_ONLY o MODULE_NOT_ALLOWED

  /api/appointments/specialists:
    get:
      tags: [Appointments]
      summary: Listar especialistas (staff)
      operationId: listSpecialists
      description: Encargadas ven todas; una collaborator, solo la ligada a su cuenta.
      parameters:
        - { in: query, name: isActive, schema: { type: string, enum: ["true"] } }
      responses:
        "200":
          description: Con cuenta y servicios poblados
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Specialist"
    post:
      tags: [Appointments]
      summary: Crear especialista
      operationId: createSpecialist
      description: Solo super_admin/store_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialistRequest"
      responses:
        "201":
          description: Creada
        "400":
          description: VALIDATION_ERROR (turnos al revés o encimados, color), USER_NOT_LINKABLE o SERVICE_NOT_FOUND
        "409":
          description: USER_ALREADY_LINKED

  /api/appointments/specialists/linkable-users:
    get:
      tags: [Appointments]
      summary: Cuentas de staff que se pueden ligar
      operationId: listLinkableUsers
      description: Solo super_admin/store_admin. Colaboradoras y administradoras, con `linkedTo` si ya están ligadas.
      responses:
        "200":
          description: Cuentas

  /api/appointments/specialists/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [Appointments]
      summary: Obtener especialista
      operationId: getSpecialist
      responses:
        "200":
          description: Especialista
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specialist"
        "404":
          description: SPECIALIST_NOT_FOUND (o no es la suya, para una collaborator)
    put:
      tags: [Appointments]
      summary: Actualizar especialista
      operationId: updateSpecialist
      description: "Solo super_admin/store_admin. `user: null` la desliga."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialistRequest"
      responses:
        "200":
          description: Actualizada
        "409":
          description: USER_ALREADY_LINKED
    delete:
      tags: [Appointments]
      summary: Eliminar especialista
      operationId: deleteSpecialist
      description: Solo super_admin/store_admin. Borra también sus bloqueos. Con citas, 409 (se desactiva).
      responses:
        "200":
          description: Eliminada
        "409":
          description: SPECIALIST_HAS_APPOINTMENTS

  /api/appointments/blocks:
    get:
      tags: [Appointments]
      summary: Bloqueos de horario
      operationId: listTimeBlocks
      description: Los que se cruzan con [from, to). Collaborator ve los suyos y los de todo el negocio.
      parameters:
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
        - { in: query, name: specialist, schema: { type: string }, description: Los de esa especialista y los de todo el negocio. }
      responses:
        "200":
          description: Bloqueos (especialista poblada)
    post:
      tags: [Appointments]
      summary: Bloquear horario
      operationId: createTimeBlock
      description: "`specialist: null` = todo el negocio (solo encargadas). Una collaborator bloquea siempre su propia especialista."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                specialist: { type: string, nullable: true }
                start: { type: string, format: date-time }
                end: { type: string, format: date-time }
                reason: { type: string, maxLength: 120 }
              required: [start, end]
      responses:
        "201":
          description: Creado
        "400":
          description: VALIDATION_ERROR o SPECIALIST_NOT_FOUND
        "403":
          description: NOT_A_SPECIALIST o APPOINTMENTS_MANAGER_ONLY

  /api/appointments/blocks/{id}:
    delete:
      tags: [Appointments]
      summary: Quitar bloqueo
      operationId: deleteTimeBlock
      description: Collaborator solo los de su especialista.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Eliminado
        "403":
          description: APPOINTMENTS_MANAGER_ONLY
        "404":
          description: BLOCK_NOT_FOUND

  /api/cart:
    get:
      tags: [Cart]
      summary: Mi carrito
      operationId: getCart
      description: >-
        Con sesión. Cada renglón trae el producto como lo da el catálogo público (activo, con
        existencias, variantes y topes). Lo que ya no se puede comprar va en `unavailable` (el
        carrito guardado no se toca: si vuelve a haber existencias, reaparece).
      responses:
        "200":
          description: Carrito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Cart]
      summary: Guardar mi carrito (reemplaza)
      operationId: putCart
      description: >-
        Reemplaza el carrito completo (el storefront une el del navegador con el guardado al
        iniciar sesión y manda cada cambio). Renglones repetidos se suman; hasta 50 productos
        distintos. `updatedAt` solo cambia si cambian productos o cantidades. El checkout con
        sesión (POST /api/orders/public) lo vacía.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    properties:
                      product: { type: string }
                      variant: { type: string, nullable: true }
                      quantity: { type: integer, minimum: 1, maximum: 999 }
                    required: [product, quantity]
              required: [items]
      responses:
        "200":
          description: Carrito guardado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [Cart]
      summary: Vaciar mi carrito
      operationId: clearCart
      responses:
        "200":
          description: Vacío

  /api/cart/unsubscribe:
    get:
      tags: [Cart]
      summary: Página para dejar de recibir el correo de carrito abandonado
      operationId: getCartUnsubscribePage
      security: []
      description: >-
        Enlace del correo (token JWT `email_preferences`, 180 días). Devuelve una página HTML
        con un botón que hace POST: abrir el enlace (p. ej. un antivirus) no da de baja a nadie.
      parameters:
        - { in: query, name: token, required: true, schema: { type: string } }
      responses:
        "200":
          description: Página HTML con el botón
          content: { text/html: { schema: { type: string } } }
        "400":
          description: Enlace no válido o vencido (HTML)
    post:
      tags: [Cart]
      summary: Dejar de recibir el correo de carrito abandonado
      operationId: postCartUnsubscribe
      security: []
      description: Pone User.emailPreferences.abandonedCart = false. Los correos de pedidos y citas no se afectan.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token: { type: string }
              required: [token]
      responses:
        "200":
          description: Confirmación (HTML)
          content: { text/html: { schema: { type: string } } }
        "400":
          description: Enlace no válido o vencido (HTML)

  /api/promo-banners/public:
    get:
      tags: [PromoBanners]
      summary: Banners vigentes para el sitio
      operationId: listPublicPromoBanners
      security: []
      description: >-
        Activos, dentro de sus fechas y con destino vigente, por `sortOrder` (máx. 20). Con
        `placement` solo los de ese lugar más los de "all". Un banner cuyo destino ya no sirve
        (categoría borrada u oculta; cupón apagado, vencido, agotado, aún no vigente o personal)
        no sale. Las imágenes son rutas relativas (uploads/...).
      parameters:
        - { in: query, name: placement, schema: { type: string, enum: [home, shop] } }
      responses:
        "200":
          description: Banners
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        _id: { type: string }
                        title: { type: string }
                        text: { type: string }
                        image: { type: string }
                        mobileImage: { type: string }
                        buttonLabel: { type: string, description: "Vacío si target.type es none." }
                        placement: { type: string, enum: [home, shop, all] }
                        endsAt: { type: string, format: date-time, nullable: true }
                        target: { $ref: "#/components/schemas/PromoBannerTarget" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/promo-banners/options:
    get:
      tags: [PromoBanners]
      summary: Destinos para el formulario del banner
      operationId: getPromoBannerOptions
      description: >-
        Módulo `promoBanner` (sin pedir Productos ni Cupones). Categorías de productos visibles y
        cupones que se pueden anunciar (no personales, activos, sin vencer ni agotar; incluye
        los programados).
      responses:
        "200":
          description: Opciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items: { type: object, properties: { _id: { type: string }, name: { type: string }, slug: { type: string } } }
                  coupons:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string }
                        label: { type: string }
                        startsAt: { type: string, format: date-time, nullable: true }
                        endsAt: { type: string, format: date-time, nullable: true }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/promo-banners:
    get:
      tags: [PromoBanners]
      summary: Lista de banners (staff)
      operationId: listPromoBanners
      description: Módulo `promoBanner`. Todos, con estado por fechas y si el destino ya no sirve.
      responses:
        "200":
          description: Banners
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PromoBanner" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [PromoBanners]
      summary: Crear banner
      operationId: createPromoBanner
      description: >-
        Módulo `promoBanner`. Requiere `title` e `image`. Al guardar, la categoría debe existir
        (de productos) y el cupón también y no ser personal; que después venza solo lo oculta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromoBannerRequest" }
      responses:
        "201":
          description: "Creado: `{ message, banner }`"
        "400":
          description: VALIDATION_ERROR, CATEGORY_NOT_FOUND, COUPON_NOT_FOUND o COUPON_IS_PERSONAL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/promo-banners/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [PromoBanners]
      summary: Un banner (staff)
      operationId: getPromoBanner
      responses:
        "200":
          description: Banner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromoBanner" }
        "404":
          description: PROMO_BANNER_NOT_FOUND
    put:
      tags: [PromoBanners]
      summary: Editar banner (parcial)
      operationId: updatePromoBanner
      description: Solo cambia lo que se manda; las reglas se revisan sobre el banner ya combinado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromoBannerRequest" }
      responses:
        "200":
          description: "Actualizado: `{ message, banner }`"
        "400":
          description: VALIDATION_ERROR, CATEGORY_NOT_FOUND, COUPON_NOT_FOUND o COUPON_IS_PERSONAL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: PROMO_BANNER_NOT_FOUND
    delete:
      tags: [PromoBanners]
      summary: Eliminar banner
      operationId: deletePromoBanner
      responses:
        "200":
          description: Eliminado
        "404":
          description: PROMO_BANNER_NOT_FOUND

  /api/wishlist/unsubscribe:
    get:
      tags: [Wishlist]
      summary: Página para dejar de recibir el aviso de favoritos
      operationId: getWishlistUnsubscribePage
      security: []
      description: >-
        Enlace del correo (token JWT `email_preferences` con pref "wishlist", 180 días). Página
        HTML con un botón que hace POST: abrir el enlace no da de baja a nadie.
      parameters:
        - { in: query, name: token, required: true, schema: { type: string } }
      responses:
        "200":
          description: Página HTML con el botón
          content: { text/html: { schema: { type: string } } }
        "400":
          description: Enlace no válido o vencido (HTML)
    post:
      tags: [Wishlist]
      summary: Dejar de recibir el aviso de favoritos
      operationId: postWishlistUnsubscribe
      security: []
      description: Pone User.emailPreferences.wishlist = false. Los demás correos no se afectan.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token: { type: string }
              required: [token]
      responses:
        "200":
          description: Confirmación (HTML)
          content: { text/html: { schema: { type: string } } }
        "400":
          description: Enlace no válido o vencido (HTML)

  /api/wishlist/settings:
    get:
      tags: [Wishlist]
      summary: Ajustes del aviso de favoritos
      operationId: getWishlistSettings
      description: Módulo `wishlist`.
      responses:
        "200":
          description: Ajustes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WishlistSettings" }
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Wishlist]
      summary: Encender o apagar el aviso de favoritos
      operationId: updateWishlistSettings
      description: Módulo `wishlist`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WishlistSettings" }
      responses:
        "200":
          description: "Guardado: `{ message, settings }`"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/wishlist/stats:
    get:
      tags: [Wishlist]
      summary: Cifras del aviso de favoritos
      operationId: getWishlistStats
      description: >-
        Módulo `wishlist`. Avisos enviados en 30 días (sin los omitidos) y a cuántos clientes,
        totales de favoritos, los 20 avisos más recientes y los 20 productos más guardados en
        favoritos con sus existencias (suma de inventario) y si hoy se pueden comprar.
      responses:
        "200":
          description: Cifras
          content:
            application/json:
              schema:
                type: object
                properties:
                  last30Days:
                    type: object
                    properties:
                      sent: { type: integer }
                      customers: { type: integer }
                  favorites:
                    type: object
                    properties:
                      customers: { type: integer }
                      total: { type: integer }
                  recent:
                    type: array
                    items:
                      type: object
                      properties:
                        customer: { type: object, nullable: true, properties: { name: { type: string }, email: { type: string } } }
                        product: { type: object, nullable: true, properties: { _id: { type: string }, name: { type: string } } }
                        sentAt: { type: string, format: date-time }
                  topProducts:
                    type: array
                    items:
                      type: object
                      properties:
                        product:
                          type: object
                          properties:
                            _id: { type: string }
                            name: { type: string }
                            image: { type: string }
                            isActive: { type: boolean }
                        favorites: { type: integer }
                        stock: { type: number }
                        available: { type: boolean }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/cart/abandoned/settings:
    get:
      tags: [Cart]
      summary: Ajustes del carrito abandonado
      operationId: getAbandonedCartSettings
      description: Módulo `abandonedCart`.
      responses:
        "200":
          description: Ajustes efectivos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AbandonedCartSettings" }
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Cart]
      summary: Guardar ajustes del carrito abandonado
      operationId: updateAbandonedCartSettings
      description: Módulo `abandonedCart`. Solo cambia lo que se manda.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AbandonedCartSettings" }
      responses:
        "200":
          description: Guardado
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/cart/abandoned/stats:
    get:
      tags: [Cart]
      summary: Cifras del carrito abandonado
      operationId: getAbandonedCartStats
      description: >-
        Módulo `abandonedCart`. Últimos 30 días: correos enviados, compras recuperadas (compra
        con sesión dentro de 7 días del correo) y monto; carritos que hoy cumplen para correo;
        los 20 correos más recientes con su resultado.
      responses:
        "200":
          description: Cifras
          content:
            application/json:
              schema:
                type: object
                properties:
                  last30Days:
                    type: object
                    properties:
                      sent: { type: integer }
                      recovered: { type: integer }
                      recoveredTotal: { type: number }
                  waiting: { type: integer }
                  recent:
                    type: array
                    items:
                      type: object
                      properties:
                        customer: { type: object, nullable: true, properties: { name: { type: string }, email: { type: string } } }
                        remindedAt: { type: string, format: date-time }
                        coupon: { type: string }
                        items: { type: integer }
                        recoveredAt: { type: string, format: date-time, nullable: true }
                        recoveredTotal: { type: number, nullable: true }

  /api/coupons/validate:
    post:
      tags: [Coupons]
      summary: Vista previa de un cupón (canasta)
      operationId: validateCoupon
      security: []
      description: >
        Sin autenticación, rate limit 30 / 10 min por IP. Solo es una vista
        previa: el checkout (POST /api/orders/public con couponCode) vuelve a
        validar y fija el descuento. `subtotal` = subtotal de productos de la
        canasta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                subtotal:
                  type: number
                deliveryMethod:
                  type: string
                  enum: [shipping, pickup]
                customerEmail:
                  type: string
                  description: Opcional, para el límite de usos por cliente.
              required: [code]
      responses:
        "200":
          description: Cupón válido
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  code:
                    type: string
                  type:
                    type: string
                    enum: [amount, percent, free_shipping]
                  value:
                    type: number
                  discount:
                    type: number
                    description: Descuento sobre el subtotal (0 en free_shipping).
                  freeShipping:
                    type: boolean
                  message:
                    type: string
        "400":
          description: COUPON_REQUIRED, COUPON_NOT_STARTED, COUPON_EXPIRED, COUPON_MIN_PURCHASE o COUPON_NOT_APPLICABLE (envío gratis en pedido para recoger)
        "404":
          description: COUPON_NOT_FOUND (no existe o inactivo)
        "403":
          description: COUPON_NOT_FOR_YOU (cupón personal de otro correo, p. ej. el del carrito abandonado)
        "409":
          description: COUPON_EXHAUSTED o COUPON_LIMIT_PER_CUSTOMER
        "429":
          description: RATE_LIMIT_COUPON_EXCEEDED

  /api/coupons:
    get:
      tags: [Coupons]
      summary: Listar cupones
      operationId: listCoupons
      description: Módulo `coupons`.
      responses:
        "200":
          description: Cupones (más recientes primero)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Coupon"
    post:
      tags: [Coupons]
      summary: Crear cupón
      operationId: createCoupon
      description: Módulo `coupons`. El código se guarda en mayúsculas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CouponRequest"
      responses:
        "201":
          description: Creado
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: COUPON_CODE_TAKEN

  /api/coupons/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      tags: [Coupons]
      summary: Obtener cupón
      operationId: getCoupon
      responses:
        "200":
          description: Cupón
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coupon"
        "404":
          description: COUPON_NOT_FOUND
    put:
      tags: [Coupons]
      summary: Actualizar cupón
      operationId: updateCoupon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CouponRequest"
      responses:
        "200":
          description: Actualizado
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: COUPON_CODE_TAKEN
    delete:
      tags: [Coupons]
      summary: Eliminar cupón
      operationId: deleteCoupon
      description: Bloqueado (409 COUPON_IN_USE) si algún pedido lo usó; en ese caso se desactiva.
      responses:
        "200":
          description: Eliminado
        "409":
          description: COUPON_IN_USE

  /api/loyalty/me:
    get:
      tags: [Loyalty]
      summary: Mis puntos y sellos
      operationId: getMyLoyalty
      description: >-
        Cualquier usuario con sesión. `programs` solo trae activo un programa si el módulo
        `loyalty` está contratado y el programa encendido (si no, `{ enabled: false }`).
        Últimos 20 movimientos.
      responses:
        "200":
          description: Saldo, reglas y movimientos
          content:
            application/json:
              schema:
                type: object
                properties:
                  programs: { $ref: "#/components/schemas/LoyaltyPrograms" }
                  account:
                    type: object
                    properties:
                      points: { type: number }
                      stamps: { type: integer }
                      rewardsAvailable: { type: integer }
                      pointsExpireAt: { type: string, format: date-time, nullable: true, description: "null = no vencen (o no hay saldo)." }
                  ledger:
                    type: array
                    items: { $ref: "#/components/schemas/LoyaltyLedgerEntry" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/loyalty/settings:
    get:
      tags: [Loyalty]
      summary: Ajustes de lealtad
      operationId: getLoyaltySettings
      description: Módulo `loyalty`.
      responses:
        "200":
          description: Ajustes efectivos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoyaltySettings" }
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Loyalty]
      summary: Guardar ajustes de lealtad
      operationId: updateLoyaltySettings
      description: Módulo `loyalty`. Solo cambia lo que se manda.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoyaltySettings" }
      responses:
        "200":
          description: Guardado (`{ message, settings }`)
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/loyalty/accounts:
    get:
      tags: [Loyalty]
      summary: Buscar cuentas de lealtad
      operationId: listLoyaltyAccounts
      description: >-
        Módulo `loyalty`. Con `q` busca clientes (rol customer) por nombre o correo, tengan o
        no saldo (máx. 30); sin `q`, las 50 cuentas con más saldo.
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 80 }
      responses:
        "200":
          description: Cuentas
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        customer: { type: object, properties: { _id: { type: string }, name: { type: string }, email: { type: string } } }
                        points: { type: number }
                        stamps: { type: integer }
                        rewardsAvailable: { type: integer }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/loyalty/accounts/{customerId}:
    get:
      tags: [Loyalty]
      summary: Cuenta de lealtad de un cliente
      operationId: getLoyaltyAccount
      description: Módulo `loyalty`. Con los últimos 100 movimientos (`by` = quién hizo el ajuste).
      parameters:
        - $ref: "#/components/parameters/LoyaltyCustomerId"
      responses:
        "200":
          description: Cuenta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoyaltyAccountDetail" }
        "404":
          description: Cliente no encontrado (CUSTOMER_NOT_FOUND)

  /api/loyalty/accounts/{customerId}/adjust:
    post:
      tags: [Loyalty]
      summary: Ajuste manual de puntos o sellos
      operationId: adjustLoyaltyAccount
      description: >-
        Módulo `loyalty`. Motivo obligatorio; los sellos van en enteros. Un ajuste que dejaría el
        saldo negativo → `409 INSUFFICIENT_BALANCE`.
      parameters:
        - $ref: "#/components/parameters/LoyaltyCustomerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [program, delta, note]
              properties:
                program: { type: string, enum: [points, stamps] }
                delta: { type: number, description: "Positivo suma, negativo resta; distinto de 0." }
                note: { type: string, maxLength: 300 }
      responses:
        "200":
          description: "`{ message, account }` (LoyaltyAccountDetail)"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Dejaría el saldo negativo (INSUFFICIENT_BALANCE)

  /api/loyalty/accounts/{customerId}/redeem-reward:
    post:
      tags: [Loyalty]
      summary: Canjear un beneficio de la tarjeta de sellos
      operationId: redeemLoyaltyReward
      description: >-
        Módulo `loyalty`. Se usa en el local al dar el beneficio; resta uno de forma atómica.
        Sin beneficios → `409 NO_REWARD_AVAILABLE`.
      parameters:
        - $ref: "#/components/parameters/LoyaltyCustomerId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 300 }
      responses:
        "200":
          description: "`{ message, account }` (LoyaltyAccountDetail)"
        "409":
          description: No tiene beneficios disponibles (NO_REWARD_AVAILABLE)

  /api/loyalty/lookup:
    get:
      tags: [Loyalty]
      summary: Resumen de lealtad de un cliente (agenda / pedido)
      operationId: lookupLoyalty
      description: >-
        Módulo `loyalty`, o `appointments`/`orders` si `loyalty` está contratado (lo usan el
        diálogo de la cita y el detalle del pedido). Por id o por correo de la cuenta.
      parameters:
        - { in: query, name: customer, schema: { type: string } }
        - { in: query, name: email, schema: { type: string } }
      responses:
        "200":
          description: "`{ found: false }` si no hay cuenta de cliente; si no, saldo y reglas."
          content:
            application/json:
              schema:
                type: object
                properties:
                  found: { type: boolean }
                  customer: { type: object, properties: { _id: { type: string }, name: { type: string }, email: { type: string } } }
                  programs: { $ref: "#/components/schemas/LoyaltyPrograms" }
                  points: { type: number }
                  stamps: { type: integer }
                  rewardsAvailable: { type: integer }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/gift-cards/public/settings:
    get:
      tags: [GiftCards]
      summary: Reglas de venta para el storefront
      operationId: getPublicGiftCardSettings
      security: []
      responses:
        "200":
          description: "`available` = contratado, encendido y con cuenta SPEI."
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  suggestedAmounts: { type: array, items: { type: number } }
                  minAmount: { type: number }
                  maxAmount: { type: number }
                  allowCustomAmount: { type: boolean }
                  validityMonths: { type: integer, description: "0 = no vence." }

  /api/gift-cards/public:
    post:
      tags: [GiftCards]
      summary: Comprar una tarjeta (queda esperando su pago)
      operationId: buyGiftCard
      security: []
      description: >-
        Bearer opcional de cliente. Monto entre min y max (o uno de los sugeridos si no se
        permite otro). Correo a quien compra con los datos SPEI y el enlace
        FRONTEND_URL/tarjeta-regalo/<id>?token=… (página que cada storefront que venda tarjetas
        debe implementar) y aviso al negocio. Devuelve `giftCardAccessToken` (header
        X-Gift-Card-Token). Rate limit 10 / 10 min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: number }
                buyerName: { type: string }
                buyerEmail: { type: string }
                buyerPhone: { type: string }
                recipientName: { type: string }
                recipientEmail: { type: string, description: "Vacío = la tarjeta le llega a quien compra." }
                message: { type: string, maxLength: 300 }
              required: [amount, buyerName, buyerEmail]
      responses:
        "201":
          description: "`{ message, giftCard (PublicGiftCard), giftCardAccessToken }`"
        "400":
          description: INVALID_AMOUNT o VALIDATION_ERROR
        "409":
          description: GIFT_CARDS_NOT_AVAILABLE

  /api/gift-cards/check:
    post:
      tags: [GiftCards]
      summary: Saldo de un código
      operationId: checkGiftCard
      security: []
      description: Acepta el código con o sin guiones. Rate limit 30 / 10 min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, example: GC-7KQ2-M9XW }
              required: [code]
      responses:
        "200":
          description: "`{ code, balance, expiresAt }`"
        "404":
          description: GIFT_CARD_NOT_FOUND
        "409":
          description: GIFT_CARD_NOT_ACTIVE, GIFT_CARD_EXPIRED, GIFT_CARD_EMPTY o GIFT_CARD_CANCELLED

  /api/gift-cards/public/{id}:
    get:
      tags: [GiftCards]
      summary: Mi compra de tarjeta
      operationId: getPublicGiftCard
      security: []
      description: >-
        Con X-Gift-Card-Token o sesión de quien compró (cuenta o mismo correo). `code` y
        `balance` solo cuando ya está activa; `payment` (cuenta SPEI y concepto) mientras espera
        su pago.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: header, name: X-Gift-Card-Token, schema: { type: string } }
      responses:
        "200":
          description: "`{ giftCard }` (PublicGiftCard)"
        "401":
          description: GIFT_CARD_TOKEN_INVALID o TOKEN_REQUIRED
        "404":
          description: GIFT_CARD_NOT_FOUND

  /api/gift-cards/public/{id}/payment-proof:
    post:
      tags: [GiftCards]
      summary: Subir el comprobante de pago de la tarjeta
      operationId: uploadGiftCardProof
      security: []
      description: Mismo acceso que GET /public/{id}. Multipart `file` (JPG/PNG/PDF). Avisa al negocio.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: "`{ message, giftCard }`"
        "409":
          description: GIFT_CARD_NOT_AWAITING_PAYMENT o TOO_MANY_PAYMENT_PROOFS

  /api/gift-cards/public/{id}/pdf:
    get:
      tags: [GiftCards]
      summary: Tarjeta imprimible en PDF (quien compró)
      operationId: getPublicGiftCardPdf
      security: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: PDF
        "409":
          description: GIFT_CARD_NOT_ACTIVE

  /api/gift-cards/mine:
    get:
      tags: [GiftCards]
      summary: Mis tarjetas (compradas y recibidas)
      operationId: listMyGiftCards
      responses:
        "200":
          description: "`{ items }` (PublicGiftCard + `role`: bought | received)"

  /api/gift-cards/settings:
    get:
      tags: [GiftCards]
      summary: Ajustes de tarjetas
      operationId: getGiftCardSettings
      responses:
        "200":
          description: Ajustes
    put:
      tags: [GiftCards]
      summary: Guardar ajustes de tarjetas
      operationId: updateGiftCardSettings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                suggestedAmounts: { type: array, items: { type: number }, maxItems: 8 }
                minAmount: { type: number }
                maxAmount: { type: number }
                allowCustomAmount: { type: boolean }
                validityMonths: { type: integer, minimum: 0, maximum: 60 }
      responses:
        "200":
          description: "`{ message, settings }`"
        "400":
          description: VALIDATION_ERROR (p. ej. mínimo mayor al máximo)

  /api/gift-cards:
    get:
      tags: [GiftCards]
      summary: Listar tarjetas
      operationId: listGiftCards
      parameters:
        - { in: query, name: status, schema: { type: string }, description: "Uno o varios separados por coma." }
        - { in: query, name: q, schema: { type: string }, description: Código, folio, nombre o correo. }
      responses:
        "200":
          description: "`{ items, pendingReview }` (sin movimientos ni comprobantes)"
    post:
      tags: [GiftCards]
      summary: Venta en mostrador (queda activa y se envía)
      operationId: sellGiftCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: number }
                buyerName: { type: string }
                buyerEmail: { type: string }
                buyerPhone: { type: string }
                recipientName: { type: string }
                recipientEmail: { type: string }
                message: { type: string }
                paymentNote: { type: string, example: Efectivo }
              required: [amount, buyerName]
      responses:
        "201":
          description: "`{ message, giftCard }`"

  /api/gift-cards/lookup:
    get:
      tags: [GiftCards]
      summary: Consultar por código (staff)
      operationId: lookupGiftCard
      description: Módulo giftCards, o appointments / orders si giftCards está contratado (cobrar una cita).
      parameters:
        - { in: query, name: code, required: true, schema: { type: string } }
      responses:
        "200":
          description: "`{ _id, number, code, status, balance, amount, expiresAt, recipientName }`"
        "404":
          description: GIFT_CARD_NOT_FOUND

  /api/gift-cards/redeem:
    post:
      tags: [GiftCards]
      summary: Canjear por código (staff)
      operationId: redeemGiftCardByCode
      description: Mismo acceso que /lookup. Cargo atómico; `appointment` liga el movimiento a una cita.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                amount: { type: number }
                note: { type: string }
                appointment: { type: string }
              required: [code, amount]
      responses:
        "200":
          description: "`{ message, giftCard }`"
        "409":
          description: GIFT_CARD_INSUFFICIENT, GIFT_CARD_EXPIRED o GIFT_CARD_NOT_ACTIVE

  /api/gift-cards/{id}:
    get:
      tags: [GiftCards]
      summary: Detalle (con movimientos y comprobantes)
      operationId: getGiftCard
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Tarjeta
        "404":
          description: GIFT_CARD_NOT_FOUND

  /api/gift-cards/{id}/pdf:
    get:
      tags: [GiftCards]
      summary: Tarjeta en PDF (staff)
      operationId: getGiftCardPdf
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: PDF

  /api/gift-cards/{id}/payment-proof:
    post:
      tags: [GiftCards]
      summary: Subir comprobante a nombre de quien compró (staff)
      operationId: uploadGiftCardProofStaff
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: "`{ message, giftCard }`"

  /api/gift-cards/{id}/payment-proofs/{proofId}/file:
    get:
      tags: [GiftCards]
      summary: Archivo de un comprobante (staff)
      operationId: getGiftCardProofFile
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: proofId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Archivo

  /api/gift-cards/{id}/payment-proofs/{proofId}/review:
    post:
      tags: [GiftCards]
      summary: Aprobar (activa y envía la tarjeta) o rechazar un comprobante
      operationId: reviewGiftCardProof
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: proofId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason: { type: string }
              required: [decision]
      responses:
        "200":
          description: "`{ message, giftCard }`"
        "409":
          description: PAYMENT_PROOF_ALREADY_REVIEWED

  /api/gift-cards/{id}/redeem:
    post:
      tags: [GiftCards]
      summary: Canjear (staff)
      operationId: redeemGiftCard
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: number }
                note: { type: string }
                appointment: { type: string }
              required: [amount]
      responses:
        "200":
          description: "`{ message, giftCard }`"
        "409":
          description: GIFT_CARD_INSUFFICIENT, GIFT_CARD_EXPIRED o GIFT_CARD_NOT_ACTIVE

  /api/gift-cards/{id}/adjust:
    post:
      tags: [GiftCards]
      summary: Ajustar saldo (+/−, con motivo)
      operationId: adjustGiftCard
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                delta: { type: number }
                note: { type: string }
              required: [delta, note]
      responses:
        "200":
          description: "`{ message, giftCard }`"

  /api/gift-cards/{id}/extend:
    post:
      tags: [GiftCards]
      summary: Cambiar la vigencia (reactiva una vencida)
      operationId: extendGiftCard
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresAt: { type: string, format: date-time, nullable: true, description: "null = no vence." }
      responses:
        "200":
          description: "`{ message, giftCard }`"

  /api/gift-cards/{id}/cancel:
    post:
      tags: [GiftCards]
      summary: Cancelar la tarjeta (el saldo se pierde)
      operationId: cancelGiftCard
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: "`{ message, giftCard }`"

  /api/gift-cards/{id}/resend:
    post:
      tags: [GiftCards]
      summary: Reenviar la tarjeta por correo
      operationId: resendGiftCard
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                recipientEmail: { type: string, description: "Corrige el correo de quien la recibe." }
      responses:
        "200":
          description: "`{ message, giftCard }`"

  /api/appointments/public/{id}/deposit-gift-card:
    post:
      tags: [Appointments]
      summary: Pagar el anticipo con una tarjeta de regalo
      operationId: payAppointmentDepositWithGiftCard
      security: []
      description: >-
        Mismo acceso que GET /api/appointments/public/{id}. La tarjeta debe cubrir el anticipo
        completo; se cobra de forma atómica y la cita se confirma (o queda `pending` sin
        autoConfirm). `deposit.giftCard` queda en la cita.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: header, name: X-Appointment-Token, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
              required: [code]
      responses:
        "200":
          description: "`{ message, appointment }`"
        "409":
          description: APPOINTMENT_NOT_AWAITING_DEPOSIT, GIFT_CARD_INSUFFICIENT u otro error de la tarjeta

  /api/dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Resumen del Inicio
      operationId: getDashboardSummary
      description: >-
        Staff (customer → 403). Solo trae las secciones de los módulos que el rol tiene
        (contratado + permitido; super_admin todo): `atAGlance` (orders: ventas de hoy, del mes y
        7 días, mismas consultas que Reportes), `todo` (conteos con enlace: comprobantes,
        pedidos por enviar, citas por confirmar, anticipos, tarjetas, reseñas, inventario),
        `todayAppointments` (appointments; una colaboradora solo su especialista, `notLinked` si
        no tiene), `latestOrders`, `lowStock` (inventory) y `balances` (giftCards / loyalty).
      responses:
        "200":
          description: "`{ modules, timezone, widgets }`"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No es staff

  /api/dashboard/preferences:
    get:
      tags: [Dashboard]
      summary: Mis preferencias del Inicio
      operationId: getDashboardPreferences
      responses:
        "200":
          description: Preferencias
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardPreferences" }
    put:
      tags: [Dashboard]
      summary: Guardar mis preferencias del Inicio
      operationId: updateDashboardPreferences
      description: Solo cambia los campos que vienen. No se editan por PUT /api/users/{id}.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardPreferences" }
      responses:
        "200":
          description: Preferencias guardadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardPreferences" }
        "400":
          description: VALIDATION_ERROR (id de tarjeta no válido o más de 30)

  /api/reports/summary:
    get:
      tags: [Reports]
      summary: Reporte del rango
      operationId: getReportSummary
      description: >-
        Módulo reports. Fechas locales de la agenda (AppointmentSettings.timezone). Sin fechas:
        últimos 30 días; hasta 366 días. `groupBy` automático: por día hasta 62 días, si no por
        mes. Cada sección es null si su módulo (orders, appointments, giftCards, loyalty) no está
        contratado. Ventas = pedidos pagados por fecha de alta (total + lo pagado con tarjeta).
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: groupBy, schema: { type: string, enum: [day, week, month] } }
      responses:
        "200":
          description: "`{ range, sales, appointments, giftCards, loyalty }`"
        "400":
          description: VALIDATION_ERROR (rango)

  /api/reports/export:
    get:
      tags: [Reports]
      summary: Exportar a CSV
      operationId: exportReport
      description: CSV UTF-8 con BOM (abre bien en Excel), una fila por pedido o por cita del rango.
      parameters:
        - { in: query, name: type, schema: { type: string, enum: [orders, appointments], default: orders } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        "200":
          description: text/csv
        "400":
          description: VALIDATION_ERROR

  /api/wholesale/customers:
    get:
      tags: [Wholesale]
      summary: Listar clientes mayoristas (con saldo y vencido)
      operationId: listWholesaleCustomers
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: active, schema: { type: string, enum: ["true", "false"] } }
      responses:
        "200": { description: "`{ customers: [{ ...WholesaleCustomer, balance, overdue, openSales }] }`" }
    post:
      tags: [Wholesale]
      summary: Registrar cliente mayorista
      operationId: createWholesaleCustomer
      security: [{ bearerAuth: [] }]
      description: >-
        `businessName` obligatorio; `phone` 10 dígitos MX; `creditDays` 0–365 (0 = contado); `creditLimit`
        null = sin límite; `discountPct` 0–90 (precio sugerido = catálogo − descuento).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WholesaleCustomerInput" }
      responses:
        "201": { description: "`{ message, customer }`" }
        "400": { description: VALIDATION_ERROR }
  /api/wholesale/customers/{id}:
    parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
    get:
      tags: [Wholesale]
      summary: Detalle de cliente mayorista
      operationId: getWholesaleCustomer
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: WholesaleCustomer + balance/overdue/openSales }
        "404": { description: WHOLESALE_CUSTOMER_NOT_FOUND }
    put:
      tags: [Wholesale]
      summary: Editar cliente mayorista (incluye isActive)
      operationId: updateWholesaleCustomer
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WholesaleCustomerInput" }
      responses:
        "200": { description: "`{ message, customer }`" }
    delete:
      tags: [Wholesale]
      summary: Borrar cliente sin ventas
      operationId: deleteWholesaleCustomer
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Eliminado }
        "409": { description: WHOLESALE_CUSTOMER_HAS_SALES (desactivarlo en su lugar) }
  /api/wholesale/customers/{id}/statement:
    get:
      tags: [Wholesale]
      summary: Estado de cuenta
      operationId: getWholesaleStatement
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        "200":
          description: "`{ customer, totals: { sold, paid, balance, overdue }, entries: [{ date, kind: charge|payment, folio, amount, balance }], sales }`"
  /api/wholesale/sales:
    get:
      tags: [Wholesale]
      summary: Listar ventas de mayoreo (sin renglones, máx. 500)
      operationId: listWholesaleSales
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: customer, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [draft, delivered, cancelled] } }
        - { in: query, name: paymentStatus, schema: { type: string, enum: [pending, partial, paid] } }
        - { in: query, name: overdue, schema: { type: string, enum: ["true"] } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        "200": { description: "`{ sales }`" }
    post:
      tags: [Wholesale]
      summary: Registrar venta en borrador
      operationId: createWholesaleSale
      security: [{ bearerAuth: [] }]
      description: >-
        Folio consecutivo. Sin `unitPrice` el renglón toma el precio de catálogo (o de la variante) menos
        `discountPct` del cliente. Cantidades con decimales permitidas. Sin tope de piezas por pedido.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WholesaleSaleInput" }
      responses:
        "201": { description: "`{ message, sale }`" }
        "400": { description: VALIDATION_ERROR }
        "409": { description: WHOLESALE_CUSTOMER_INACTIVE }
  /api/wholesale/sales/{id}:
    parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
    get:
      tags: [Wholesale]
      summary: Detalle de venta (cliente y quién registró cada abono, poblados)
      operationId: getWholesaleSale
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: WholesaleSale }
        "404": { description: WHOLESALE_SALE_NOT_FOUND }
    put:
      tags: [Wholesale]
      summary: Editar venta (renglones/cliente/descuento solo en borrador; notas siempre)
      operationId: updateWholesaleSale
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WholesaleSaleInput" }
      responses:
        "200": { description: "`{ message, sale }`" }
        "409": { description: WHOLESALE_SALE_NOT_EDITABLE }
    delete:
      tags: [Wholesale]
      summary: Borrar borrador
      operationId: deleteWholesaleSale
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Eliminada }
        "409": { description: WHOLESALE_SALE_NOT_EDITABLE }
  /api/wholesale/sales/{id}/deliver:
    post:
      tags: [Wholesale]
      summary: Entregar (descuenta inventario, abre la cuenta por cobrar)
      operationId: deliverWholesaleSale
      security: [{ bearerAuth: [] }]
      description: >-
        Atómico (solo desde draft). `dueDate` = `deliveredAt` + `creditDays`. Con `payment.method` registra el
        cobro completo (contado). Si el saldo del cliente + la venta rebasa `creditLimit`, 409 salvo `force: true`.
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deliveredAt: { type: string, format: date }
                payment: { type: object, properties: { method: { type: string, enum: [cash, transfer, card, other] }, note: { type: string } } }
                force: { type: boolean }
      responses:
        "200": { description: "`{ message, sale }`" }
        "409": { description: WHOLESALE_SALE_NOT_DRAFT | CREDIT_LIMIT_EXCEEDED }
  /api/wholesale/sales/{id}/cancel:
    post:
      tags: [Wholesale]
      summary: Cancelar (regresa el inventario si estaba entregada)
      operationId: cancelWholesaleSale
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses:
        "200": { description: "`{ message, sale }`" }
        "409": { description: WHOLESALE_SALE_HAS_PAYMENTS | WHOLESALE_SALE_CANCELLED }
  /api/wholesale/sales/{id}/payments:
    post:
      tags: [Wholesale]
      summary: Registrar abono (solo ventas entregadas, no mayor al saldo)
      operationId: addWholesalePayment
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number }
                paidAt: { type: string, format: date }
                method: { type: string, enum: [cash, transfer, card, other] }
                note: { type: string }
      responses:
        "201": { description: "`{ message, sale }`" }
        "409": { description: WHOLESALE_SALE_NOT_DELIVERED | PAYMENT_EXCEEDS_BALANCE }
  /api/wholesale/sales/{id}/payments/{paymentId}:
    delete:
      tags: [Wholesale]
      summary: Borrar abono
      operationId: deleteWholesalePayment
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: paymentId, required: true, schema: { type: string } }
      responses:
        "200": { description: "`{ message, sale }`" }
  /api/wholesale/receivables:
    get:
      tags: [Wholesale]
      summary: Cuentas por cobrar con antigüedad
      operationId: getWholesaleReceivables
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: "`{ totals: { balance, current, d1_30, d31_60, d61plus }, customers: [{ customer, customerName, balance, ..., sales }] }`"

  /api/store-accounting/ledger:
    get:
      tags: [StoreAccounting]
      summary: Movimientos del periodo (manuales + compras + ingresos automáticos)
      operationId: getStoreLedger
      security: [{ bearerAuth: [] }]
      description: >-
        Sin fechas: del día 1 del mes a hoy (zona de la agenda); hasta 366 días. Los renglones `automatic: true`
        se calculan al vuelo desde pedidos pagados (`total`), tarjetas de regalo activadas, anticipos de cita
        (sin la parte pagada con tarjeta) y abonos de mayoreo, cada fuente solo si su módulo está contratado.
        Los totales excluyen el saldo inicial.
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: type, schema: { type: string, enum: [income, expense] } }
        - { in: query, name: automatic, schema: { type: string, enum: ["true", "false"] } }
        - { in: query, name: category, schema: { type: string } }
      responses:
        "200": { description: "`{ from, to, totals: { income, expense, net }, rows }`" }
  /api/store-accounting/export:
    get:
      tags: [StoreAccounting]
      summary: Exportar movimientos a CSV
      operationId: exportStoreLedger
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        "200": { description: text/csv (UTF-8 con BOM) }
  /api/store-accounting/categories:
    get:
      tags: [StoreAccounting]
      summary: Categorías sugeridas + las ya usadas
      operationId: listStoreCategories
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "`{ categories: string[] }`" }
  /api/store-accounting/transactions:
    post:
      tags: [StoreAccounting]
      summary: Registrar gasto o ingreso manual
      operationId: createStoreTransaction
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreTransactionInput" }
      responses:
        "201": { description: "`{ message, transaction }`" }
        "400": { description: VALIDATION_ERROR }
  /api/store-accounting/transactions/{id}:
    parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
    put:
      tags: [StoreAccounting]
      summary: Editar movimiento manual
      operationId: updateStoreTransaction
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreTransactionInput" }
      responses:
        "200": { description: "`{ message, transaction }`" }
        "409": { description: TRANSACTION_NOT_EDITABLE (gasto de compra o saldo inicial) }
    delete:
      tags: [StoreAccounting]
      summary: Borrar movimiento manual
      operationId: deleteStoreTransaction
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Eliminado }
        "409": { description: TRANSACTION_NOT_EDITABLE }
  /api/store-accounting/opening-balance:
    get:
      tags: [StoreAccounting]
      summary: Saldo inicial guardado
      operationId: getStoreOpeningBalance
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "`{ openingBalance: StoreTransaction & { signedAmount } | null }`" }
    post:
      tags: [StoreAccounting]
      summary: Guardar saldo inicial (idempotente; con signo; 0 lo borra)
      operationId: setStoreOpeningBalance
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [amount], properties: { amount: { type: number }, date: { type: string, format: date } } }
      responses:
        "200": { description: "`{ message, openingBalance }`" }
  /api/store-accounting/summary:
    get:
      tags: [StoreAccounting]
      summary: Resumen anual por mes
      operationId: getStoreAccountingSummary
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: year, schema: { type: integer } }
      responses:
        "200":
          description: >-
            `{ year, openingBalance, months: [{ month, income, expense, net, closingBalance, incomeBySource: { orders,
            giftCards, deposits, wholesale, manual }, expenseByCategory }], totals, expenseByCategory, currentBalance
            (solo año en curso), receivable (null sin wholesale), payable, sources }`
  /api/store-accounting/suppliers:
    get:
      tags: [StoreAccounting]
      summary: Listar proveedores (con lo que se les debe)
      operationId: listSuppliers
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: active, schema: { type: string, enum: ["true"] } }
      responses:
        "200": { description: "`{ suppliers: [{ ...Supplier, payable }] }`" }
    post:
      tags: [StoreAccounting]
      summary: Registrar proveedor
      operationId: createSupplier
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierInput" }
      responses:
        "201": { description: "`{ message, supplier }`" }
  /api/store-accounting/suppliers/{id}:
    parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
    get:
      tags: [StoreAccounting]
      summary: Proveedor con sus compras
      operationId: getSupplier
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Supplier + purchases }
    put:
      tags: [StoreAccounting]
      summary: Editar proveedor
      operationId: updateSupplier
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierInput" }
      responses:
        "200": { description: "`{ message, supplier }`" }
    delete:
      tags: [StoreAccounting]
      summary: Borrar proveedor sin compras
      operationId: deleteSupplier
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Eliminado }
        "409": { description: SUPPLIER_HAS_PURCHASES }
  /api/store-accounting/purchases:
    get:
      tags: [StoreAccounting]
      summary: Listar compras (sin renglones, máx. 500)
      operationId: listPurchases
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: supplier, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [draft, received, cancelled] } }
        - { in: query, name: paid, schema: { type: string, enum: ["true", "false"] } }
      responses:
        "200": { description: "`{ purchases }`" }
    post:
      tags: [StoreAccounting]
      summary: Registrar compra en borrador
      operationId: createPurchase
      security: [{ bearerAuth: [] }]
      description: Renglones con `product` (suben inventario al recibir) o solo `description` (insumos, solo gasto).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseInput" }
      responses:
        "201": { description: "`{ message, purchase }`" }
        "400": { description: VALIDATION_ERROR }
  /api/store-accounting/purchases/{id}:
    parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
    get:
      tags: [StoreAccounting]
      summary: Detalle de compra
      operationId: getPurchase
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Purchase }
        "404": { description: PURCHASE_NOT_FOUND }
    put:
      tags: [StoreAccounting]
      summary: Editar compra (proveedor/renglones solo en borrador sin pagar)
      operationId: updatePurchase
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseInput" }
      responses:
        "200": { description: "`{ message, purchase }` (su gasto se sincroniza)" }
        "409": { description: PURCHASE_NOT_EDITABLE | PURCHASE_CANCELLED }
    delete:
      tags: [StoreAccounting]
      summary: Borrar compra en borrador sin pagar
      operationId: deletePurchase
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Eliminada }
        "409": { description: PURCHASE_NOT_EDITABLE }
  /api/store-accounting/purchases/{id}/receive:
    post:
      tags: [StoreAccounting]
      summary: Recibir (sube inventario; crea el registro si no existía)
      operationId: receivePurchase
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { receivedAt: { type: string, format: date } } }
      responses:
        "200": { description: "`{ message, purchase }`" }
        "409": { description: PURCHASE_NOT_DRAFT }
  /api/store-accounting/purchases/{id}/pay:
    parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
    post:
      tags: [StoreAccounting]
      summary: Registrar o corregir pago (genera/actualiza su gasto, source purchase)
      operationId: payPurchase
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                paidAt: { type: string, format: date }
                paymentMethod: { type: string, enum: [cash, transfer, card, other] }
      responses:
        "200": { description: "`{ message, purchase }`" }
        "409": { description: PURCHASE_CANCELLED }
    delete:
      tags: [StoreAccounting]
      summary: Quitar pago (borra su gasto)
      operationId: unpayPurchase
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "`{ message, purchase }`" }
  /api/store-accounting/purchases/{id}/cancel:
    post:
      tags: [StoreAccounting]
      summary: Cancelar (si estaba recibida, saca lo que entró al inventario)
      operationId: cancelPurchase
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        "200": { description: "`{ message, purchase }`" }
        "409": { description: PURCHASE_PAID (quitar el pago primero) | PURCHASE_CANCELLED }

  /api/reviews/public:
    get:
      tags: [Reviews]
      summary: Reseñas aprobadas de un producto o de un servicio
      operationId: listPublicReviews
      security: []
      description: >-
        `product` o `service` (uno de los dos). Con `service`: las reseñas post-cita aprobadas de
        las citas que incluyeron ese servicio; cada una trae `services` (lo que se hizo en esa
        cita), sin especialista ni fecha de la cita.
      parameters:
        - { in: query, name: product, schema: { type: string } }
        - { in: query, name: service, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        "200":
          description: Más recientes primero. `customerName` es el nombre corto ("Ana G."); nunca se expone el correo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicReview"
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  summary:
                    type: object
                    properties:
                      average:
                        type: number
                      count:
                        type: integer
                      distribution:
                        type: object
                        description: Cuántas reseñas de cada estrella (claves "1" a "5").
                        additionalProperties:
                          type: integer
        "400":
          description: VALIDATION_ERROR (product no válido)

  /api/reviews/eligibility:
    get:
      tags: [Reviews]
      summary: ¿Puede el cliente calificar este producto?
      operationId: getReviewEligibility
      description: >
        Con sesión. Elegible si tiene un pedido entregado (`delivered`) o
        recogido (`picked_up`) con el producto, ligado a su cuenta o con su
        mismo correo (igual que GET /api/orders/mine). Si ya calificó,
        devuelve su reseña para editarla.
      parameters:
        - { in: query, name: product, required: true, schema: { type: string } }
      responses:
        "200":
          description: Resultado
          content:
            application/json:
              schema:
                type: object
                properties:
                  eligible:
                    type: boolean
                  reason:
                    type: string
                    description: Solo si no es elegible.
                  review:
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/OwnReview"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/reviews/mine:
    get:
      tags: [Reviews]
      summary: Mis reseñas
      operationId: listMyReviews
      description: >-
        Reseñas de productos de la cuenta y calificaciones de citas (por la cuenta o por el correo de
        la clienta, para incluir las que dejó desde el enlace del correo sin sesión), las más
        recientes primero.
      responses:
        "200":
          description: Reseñas del cliente con su estado (y motivo si se rechazó)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OwnReview"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/reviews/mine/{id}:
    put:
      tags: [Reviews]
      summary: Editar mi reseña
      operationId: updateMyReview
      description: Vuelve a moderación (`pending`); si estaba publicada deja de contar en el promedio hasta que la aprueben.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: Actualizada
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: REVIEW_NOT_FOUND (no existe o no es suya)

  /api/reviews/appointment/{id}:
    get:
      tags: [Reviews]
      summary: ¿Puede calificar esta cita?
      operationId: getAppointmentReviewStatus
      description: >-
        Para la página de la cita del storefront (`/cita/<id>?token=…&accion=calificar`). Con el
        header X-Appointment-Token de la cita (invitada) o con sesión de la dueña (cuenta ligada o
        mismo correo). `canReview` = la cita está `completed` y aún no tiene reseña.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: header, name: X-Appointment-Token, schema: { type: string } }
      responses:
        "200":
          description: Estado
          content:
            application/json:
              schema:
                type: object
                properties:
                  canReview: { type: boolean }
                  reason: { type: string }
                  review: { $ref: "#/components/schemas/AppointmentReviewView" }
                  appointment:
                    type: object
                    properties:
                      _id: { type: string }
                      appointmentNumber: { type: integer }
                      status: { type: string }
                      start: { type: string, format: date-time }
                      services: { type: array, items: { type: string } }
                      specialistName: { type: string }
        "401":
          description: TOKEN_REQUIRED, APPOINTMENT_TOKEN_INVALID o TOKEN_INVALID_OR_EXPIRED
        "404":
          description: APPOINTMENT_NOT_FOUND (también si la sesión no es de la dueña)

  /api/reviews/appointment:
    post:
      tags: [Reviews]
      summary: Calificar una cita completada
      operationId: createAppointmentReview
      description: >-
        Reseña post-cita (Fase 4.2). Mismo acceso que GET /api/reviews/appointment/{id}; rate
        limit 20 / hora por IP. Una por cita. Queda en la cuenta ligada a la cita o en la de su
        mismo correo (invitada sin cuenta = `customer` nulo), con una foto de servicios y
        especialista. Entra `pending` (moderación en el admin).
      parameters:
        - { in: header, name: X-Appointment-Token, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ReviewRequest"
                - type: object
                  properties:
                    appointment: { type: string }
                  required: [appointment]
      responses:
        "201":
          description: "Creada (pendiente): `{ message, review }` (AppointmentReviewView)"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: TOKEN_REQUIRED, APPOINTMENT_TOKEN_INVALID o TOKEN_INVALID_OR_EXPIRED
        "404":
          description: APPOINTMENT_NOT_FOUND
        "409":
          description: APPOINTMENT_NOT_COMPLETED o REVIEW_EXISTS (ya se calificó)
        "429":
          description: RATE_LIMIT_REVIEWS_EXCEEDED

  /api/reviews/{id}/testimonial:
    post:
      tags: [Reviews]
      summary: Publicar una reseña como testimonio
      operationId: publishReviewAsTestimonial
      description: >-
        Módulo `reviews`. Solo aprobadas. Copia nombre corto ("Ana G."), comentario, estrellas y
        servicios (o producto) como `rubro` al final de StoreConfig.testimonials, activo, con
        `fromReview`. Condicionado a que no esté ya (sin duplicar aunque se pulse dos veces); si
        se borra el testimonio en "Configurar tienda", se puede volver a publicar.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "201":
          description: "Publicada: `{ message, testimonial }`"
        "404":
          description: REVIEW_NOT_FOUND
        "409":
          description: REVIEW_NOT_APPROVED, TESTIMONIAL_EXISTS o STORE_CONFIG_MISSING

  /api/reviews:
    post:
      tags: [Reviews]
      summary: Calificar un producto
      operationId: createReview
      description: Con sesión; rate limit 20 / hora por IP. Entra `pending` y se publica al aprobarla en el admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ReviewRequest"
                - type: object
                  properties:
                    product:
                      type: string
                  required: [product]
      responses:
        "201":
          description: Creada (pendiente)
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: REVIEW_NOT_ELIGIBLE (sin pedido entregado o recogido con el producto)
        "404":
          description: PRODUCT_NOT_FOUND
        "409":
          description: REVIEW_EXISTS (una por cliente y producto; editarla con PUT /mine/{id})
        "429":
          description: RATE_LIMIT_REVIEWS_EXCEEDED
    get:
      tags: [Reviews]
      summary: Bandeja de reseñas (staff)
      operationId: listReviews
      description: >-
        Módulo `reviews`. Hasta 500 de un tipo (`kind`, product por default), más recientes
        primero: las de producto con producto, folio del pedido y correo del cliente; las de cita
        con `appointmentInfo`. `isTestimonial` = ya está en StoreConfig.testimonials.
      parameters:
        - { in: query, name: kind, schema: { type: string, enum: [product, appointment], default: product } }
        - { in: query, name: status, schema: { type: string, enum: [pending, approved, rejected] } }
        - { in: query, name: product, schema: { type: string } }
      responses:
        "200":
          description: Reseñas + conteo por estado
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Review"
                  counts:
                    type: object
                    properties:
                      pending: { type: integer }
                      approved: { type: integer }
                      rejected: { type: integer }
                  pendingByKind:
                    type: object
                    description: Pendientes de cada tipo (para las pestañas).
                    properties:
                      product: { type: integer }
                      appointment: { type: integer }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/reviews/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    put:
      tags: [Reviews]
      summary: Aprobar o rechazar
      operationId: moderateReview
      description: Módulo `reviews`. Si cambia lo publicado, recalcula Product.ratingAvg / ratingCount.
      requestBody:
        required: true
        content:
