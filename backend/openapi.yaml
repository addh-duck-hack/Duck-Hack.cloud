          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Orders]
      summary: Crear pedido (manual, panel)
      operationId: createOrder
      description: >
        Módulo `orders` de los permisos por tienda. Venta manual desde el
        panel (telefónica, mostrador, etc.) — el checkout real del storefront
        usa POST /api/orders/public. unitPrice se toma del precio actual de
        cada producto, no del payload; a diferencia del checkout público,
        acepta productos inactivos.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateRequest"
      responses:
        "201":
          description: Pedido creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  order:
                    $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Alguno de los productos referenciados no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Obtener un pedido
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderIdParam"
      responses:
        "200":
          description: Pedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Orders]
      summary: Actualizar estado/notas/dirección de envío de un pedido
      operationId: updateOrder
      description: >
        Módulo `orders` de los permisos por tienda. items/customer no se reabren
        después de creado. Si `status` transiciona hacia "confirmed", se descuenta
        el inventario de cada producto del pedido; si transiciona fuera de
        "confirmed" (cancelado, regresado a pending, etc.), el stock se restaura
        automáticamente. No bloquea la actualización si el inventario queda en 0.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdateRequest"
      responses:
        "200":
          description: Pedido actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  order:
                    $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Orders]
      summary: Eliminar pedido
      operationId: deleteOrder
      description: Módulo `orders` de los permisos por tienda.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderIdParam"
      responses:
        "200":
          description: Pedido eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/orders/{id}/payment-proof:
    post:
      tags: [Orders]
      summary: Subir comprobante de pago (SPEI)
      operationId: uploadOrderPaymentProof
      security:
        - bearerAuth: []
        - orderToken: []
      description: >
        Lo puede subir el staff con el módulo `orders` (a nombre del cliente),
        el cliente dueño con su sesión (cuenta vinculada o mismo correo, como
        GET /mine) o el invitado con el header `X-Order-Token` que devolvió
        POST /api/orders/public. Solo mientras el pedido espera su pago
        (`pending` o `payment_review`; si no, 409 ORDER_NOT_AWAITING_PAYMENT) y
        hasta 10 comprobantes por pedido. El archivo (campo `file`: JPG o PNG,
        que se re-codifican, o PDF, hasta 8 MB) se guarda en una carpeta privada
        que nunca se sirve en /uploads. Un pedido `pending` pasa a
        `payment_review`; si lo subió el cliente se avisa a la tienda por
        correo (StoreConfig.orderNotifications.proofUploaded). Rate limit 20 /
        15 min por IP.
      parameters:
        - $ref: "#/components/parameters/OrderIdParam"
        - in: header
          name: X-Order-Token
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "201":
          description: >-
            Comprobante guardado. Al staff le devuelve el pedido completo; al
            cliente/invitado solo `status` y `proof`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  order:
                    $ref: "#/components/schemas/Order"
                  status:
                    type: string
                  proof:
                    type: object
                    properties:
                      _id:
                        type: string
                      status:
                        type: string
                      uploadedAt:
                        type: string
                        format: date-time
        "400":
          description: FILE_REQUIRED, INVALID_FILE_TYPE o INVALID_FILE_CONTENT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sin sesión ni token, o ORDER_TOKEN_INVALID (otro pedido / vencido)
        "403":
          description: El usuario no es staff con `orders` ni dueño del pedido
        "404":
          description: ORDER_NOT_FOUND
        "409":
          description: ORDER_NOT_AWAITING_PAYMENT o TOO_MANY_PAYMENT_PROOFS
        "413":
          description: FILE_TOO_LARGE
        "429":
          description: RATE_LIMIT_PAYMENT_PROOF_EXCEEDED

  /api/orders/{id}/payment-proofs/{proofId}/file:
    get:
      tags: [Orders]
      summary: Ver el archivo de un comprobante de pago
      operationId: getOrderPaymentProofFile
      security:
        - bearerAuth: []
        - orderToken: []
      description: >
        Mismos permisos que subirlo (staff con `orders`, dueño o invitado con
        X-Order-Token). Responde el archivo inline con Cache-Control
        `private, no-store`.
      parameters:
        - $ref: "#/components/parameters/OrderIdParam"
        - in: path
          name: proofId
          required: true
          schema:
            type: string
        - in: header
          name: X-Order-Token
          required: false
          schema:
            type: string
      responses:
        "200":
          description: El archivo (image/jpeg, image/png o application/pdf)
          content:
            image/jpeg: {}
            image/png: {}
            application/pdf: {}
        "401":
          description: Sin sesión ni token válido
        "403":
          description: Sin permiso sobre el pedido
        "404":
          description: ORDER_NOT_FOUND, PAYMENT_PROOF_NOT_FOUND o PAYMENT_PROOF_FILE_NOT_FOUND

  /api/orders/{id}/payment-proofs/{proofId}/review:
    post:
      tags: [Orders]
      summary: Aprobar o rechazar un comprobante de pago
      operationId: reviewOrderPaymentProof
      description: >
        Módulo `orders`. Solo comprobantes `pending` (si no, 409
        PAYMENT_PROOF_ALREADY_REVIEWED). `approve`: si el pedido esperaba su
        pago pasa a `confirmed` (descuenta inventario) y se avisa al cliente.
        `reject` exige `reason`, que se le envía al cliente; un pedido en
        `payment_review` vuelve a `pending` si ya no le quedan comprobantes por
        revisar.
      parameters:
        - $ref: "#/components/parameters/OrderIdParam"
        - in: path
          name: proofId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                reason:
                  type: string
                  maxLength: 500
              required: [decision]
      responses:
        "200":
          description: Revisado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  order:
                    $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: ORDER_NOT_FOUND o PAYMENT_PROOF_NOT_FOUND
        "409":
          description: PAYMENT_PROOF_ALREADY_REVIEWED

  /api/orders/{id}/summary:
    get:
      tags: [Orders]
      summary: Pedido para la página del cliente en el storefront
      operationId: getOrderSummary
      security:
        - bearerAuth: []
        - orderToken: []
      description: >
        Lo que muestra la página del pedido del storefront
        (FRONTEND_URL/pedido/{id}?token=…, el enlace que va en el correo de
        confirmación cuando StoreConfig.customerProofUpload está encendido).
        Mismos permisos que los comprobantes: staff con `orders`, dueño con
        sesión o invitado con X-Order-Token. Sin notas internas ni datos de
        revisión. `payment.spei` (cuenta a la que transferir) solo mientras el
        pedido espera su pago; `canUploadProof` = pago por SPEI, esperando el
        pago y con espacio para otro comprobante.
      parameters:
        - $ref: "#/components/parameters/OrderIdParam"
        - in: header
          name: X-Order-Token
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Resumen del pedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    type: object
                    description: >-
                      _id, orderNumber, createdAt, status, customerName,
                      customerEmail, items (productName, variantLabel,
                      quantity, unitPrice, compareAtPrice, subtotal),
                      shippingCost, total, deliveryMethod, pickupPoint,
                      shippingAddress, paymentMethodLabel, shipment,
                      discount, loyalty ({ redeemed, earned }).
                  payment:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [spei, manual]
                      spei:
                        type: object
                        nullable: true
                        properties:
                          accountHolderName:
                            type: string
                          bank:
                            type: string
                          clabe:
                            type: string
                          phone:
                            type: string
                      instructions:
                        type: string
                        description: Solo en pagos manuales.
                  paymentProofs:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        status:
                          type: string
                          enum: [pending, approved, rejected]
                        mimeType:
                          type: string
                        uploadedAt:
                          type: string
                          format: date-time
                        rejectReason:
                          type: string
                  canUploadProof:
                    type: boolean
        "401":
          description: Sin sesión ni token válido
        "403":
          description: Sin permiso sobre el pedido
        "404":
          description: ORDER_NOT_FOUND

  /api/orders/{id}/customer-link:
    get:
      tags: [Orders]
      summary: Enlace a la página del pedido para el cliente
      operationId: getOrderCustomerLink
      description: >
        Módulo `orders`. Enlace firmado FRONTEND_URL/pedido/{id}?token=… para
        mandarlo al cliente (p. ej. por WhatsApp). `url` null si la tienda no
        activó StoreConfig.customerProofUpload o falta FRONTEND_URL.
      parameters:
        - $ref: "#/components/parameters/OrderIdParam"
      responses:
        "200":
          description: Enlace
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  url:
                    type: string
                    nullable: true
                  expiresIn:
                    type: string
                    example: 30d
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/orders/{id}/pdf:
    get:
      tags: [Orders]
      summary: Descargar el ticket del pedido en PDF
      operationId: getOrderPdf
      description: >
        Accesible por staff con el módulo `orders`, por el cliente dueño del
        pedido (cuenta vinculada vía `customer`, o cuenta cuyo correo coincide
        con `customerEmail` — mismo criterio que GET /api/orders/mine) o por el
        invitado con su X-Order-Token (página del pedido). El PDF se genera al
        vuelo a partir del pedido y los datos de la tienda (StoreConfig) —
        nunca se guarda en disco.
      security:
        - bearerAuth: []
        - orderToken: []
      parameters:
        - $ref: "#/components/parameters/OrderIdParam"
        - in: header
          name: X-Order-Token
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Comprobante en PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No eres staff ni el dueño del pedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/permissions/me:
    get:
      tags: [Permissions]
      summary: Módulos que puede usar la sesión actual
      operationId: getMyPermissions
      description: >
        Cualquier staff. `modules` = módulos contratados por la tienda y
        permitidos para su rol (super_admin: todos). El panel arma su menú y
        sus rutas con esto; el backend lo hace cumplir en cada endpoint
        (`403 MODULE_NOT_ALLOWED`).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Módulos permitidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    type: string
                  modules:
                    type: array
                    items:
                      $ref: "#/components/schemas/PermissionModuleKey"
                required: [role, modules]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/permissions:
    get:
      tags: [Permissions]
      summary: Configuración de permisos de la tienda
      operationId: getPermissions
      description: Solo `super_admin`. Sin configuración guardada devuelve los defaults (`updatedAt` null).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Configuración efectiva + catálogo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorePermissionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Permissions]
      summary: Guardar permisos de la tienda
      operationId: updatePermissions
      description: >
        Solo `super_admin`. Reemplaza módulos contratados y permisos de
        `store_admin` y `collaborator` (ambos obligatorios; super_admin no se
        configura). Un módulo no contratado queda inaccesible para todos salvo
        super_admin aunque el rol lo tenga; lo marcado por rol se conserva.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorePermissions"
      responses:
        "200":
          description: Guardado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StorePermissionsResponse"
                  - type: object
                    properties:
                      message:
                        type: string
        "400":
          description: Módulo o rol desconocido, o falta un rol (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/app-home/public:
    get:
      tags: [AppHome]
      summary: Home de la app móvil (público)
      operationId: getPublicAppHome
      security: []
      description: >
        Secciones visibles del home, en el orden en que se muestran. Los
        carruseles de productos vienen resueltos en `products` (mismas reglas
        que `GET /api/products/public`: activos y con existencias); un
        carrusel sin productos no se envía. Las secciones `store*` (hero,
        métricas, comandos, servicios, planes, FAQs, equipo, testimonios)
        reutilizan el contenido de Configurar tienda y vienen resueltas en
        `items`. La sección `promoBanners` muestra los banners de promociones
        del Inicio (placement `home` o `all`; mismas reglas y forma que
        `GET /api/promo-banners/public?placement=home`) en `items`; no se envía
        si no hay banners vigentes o la tienda no contrató `promoBanner`.
        **La app debe ignorar los `type`
        que no conozca**, para que una versión vieja siga funcionando cuando
        se agregue un tipo nuevo. Si nunca se ha configurado, `sections` es `[]`.
      responses:
        "200":
          description: Home de la app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAppHome"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/app-profile/public:
    get:
      tags: [AppProfile]
      summary: Menú del perfil de la app (público)
      operationId: getPublicAppProfile
      security: []
      description: >
        Grupos (el título es el separador) con sus opciones ya resueltas, en orden. Cada opción trae
        `visibility` (always | auth = solo con sesión | guest = solo invitados; la app filtra según su
        sesión) y `action` lista para abrir: screen {screen}, phone {phone, href tel:}, whatsapp {phone,
        message, href https://wa.me/…}, email {email, href mailto:}, legal {page, title, path, href,
        openIn: webview} o url {href, openIn: webview|browser}. Se omiten las opciones que no aplican
        (pantalla de un módulo no contratado, tienda sin teléfono/correo, legal sin texto) y los grupos
        que quedan vacíos. `logout` = null si está apagado (la app lo muestra solo con sesión); `rateApp`
        = null si está apagado, con `iosUrl`/`androidUrl` de las tiendas. Sin perfil guardado devuelve uno
        sugerido. **La app debe ignorar `action.type` y `screen` que no conozca.**
        Pantallas: login, profile, orders, addresses, changePassword, deleteAccount, favorites, loyalty,
        giftCards, reviews, appointments, notifications.
      responses:
        "200":
          description: Perfil de la app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAppProfile"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/app-profile/legal/{page}:
    get:
      tags: [AppProfile]
      summary: Página legal para el web view de la app
      operationId: getAppLegalPage
      security: []
      description: >
        HTML sencillo (nombre, logo y color de la tienda) con el texto de Configurar tienda → Identidad
        legal: privacy = privacyNotice, legal = legalNotice, returns = returnsPolicy. El texto se sanitiza
        (lib/safeHtml.js: etiquetas de texto básicas, sin atributos salvo href http(s)/mailto/tel en <a>).
      parameters:
        - { in: path, name: page, required: true, schema: { type: string, enum: [privacy, legal, returns] } }
      responses:
        "200":
          description: text/html
        "404":
          description: LEGAL_PAGE_NOT_FOUND | LEGAL_PAGE_EMPTY

  /api/app-profile:
    get:
      tags: [AppProfile]
      summary: Perfil de la app para el editor
      operationId: getAppProfile
      security: [{ bearerAuth: [] }]
      description: >
        Módulo appConfig. Perfil guardado (o el sugerido, `isDefault: true`) + catálogos para el editor
        (`screens`, `legalPages`), contacto de la tienda (`store`) y `problems` (id de opción → por qué hoy
        no se mostraría en la app).
      responses:
        "200": { description: "`{ groups, logout, rateApp, isDefault, updatedAt, problems, screens, legalPages, store }`" }
    put:
      tags: [AppProfile]
      summary: Guardar y publicar el perfil de la app
      operationId: updateAppProfile
      security: [{ bearerAuth: [] }]
      description: >
        Reemplaza el perfil completo. Hasta 10 grupos y 20 opciones por grupo; texto de opción obligatorio
        (60). phone/whatsapp: 10 dígitos o vacío (= los de la tienda); url: http(s). rateApp habilitado
        exige iosAppId (solo números) o androidPackage (com.tienda.app).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppProfileInput"
      responses:
        "200": { description: Igual que GET, con `message` }
        "400": { description: VALIDATION_ERROR }

  /api/app-home:
    get:
      tags: [AppHome]
      summary: Home de la app para editar (incluye secciones ocultas)
      operationId: getAppHome
      description: Módulo `appConfig` de los permisos por tienda (por default solo super_admin).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Home completo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AppHome"
                  - type: object
                    properties:
                      sectionTypes:
                        type: array
                        description: Tipos de sección que acepta el backend
                        items:
                          type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [AppHome]
      summary: Guardar y publicar el home de la app
      operationId: updateAppHome
      description: >
        Módulo `appConfig` de los permisos por tienda (por default solo super_admin). Reemplaza todas las secciones (el orden del
        arreglo es el orden en pantalla) y publica al instante. Cada sección
        se valida contra su tipo; los campos desconocidos se descartan y
        `id` se genera si falta. Los productos de un carrusel manual deben
        existir (`400 APP_HOME_PRODUCT_NOT_FOUND`), aunque estén inactivos o
        sin stock (eso solo los oculta en la app).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sections:
                  type: array
                  maxItems: 30
                  items:
                    $ref: "#/components/schemas/AppHomeSection"
              required: [sections]
      responses:
        "200":
          description: Guardado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AppHome"
                  - type: object
                    properties:
                      message:
                        type: string
        "400":
          description: Sección inválida (VALIDATION_ERROR, con la ruta del campo en el mensaje) o producto inexistente (APP_HOME_PRODUCT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/store-config/public:
    get:
      tags: [StoreConfig]
      summary: Consultar configuración pública de la tienda
      operationId: getPublicStoreConfig
      security: []
      description: >
        Sin autenticación. Devuelve la configuración de tienda activa
        (`isActive: true`) para que el storefront la consuma en runtime.
      responses:
        "200":
          description: Configuración de tienda activa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreConfig"
        "404":
          description: No hay configuración de tienda activa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/store-config:
    get:
      tags: [StoreConfig]
      summary: Consultar configuración de tienda (administración)
      operationId: getStoreConfig
      description: Requiere autenticación y rol `super_admin` o `store_admin`. Devuelve el documento completo, activo o no.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Configuración de tienda
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No hay configuración de tienda
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [StoreConfig]
      summary: Actualizar configuración de tienda (parcial por campo)
      operationId: updateStoreConfig
      description: >
        Requiere autenticación y rol `super_admin` o `store_admin`. Solo actualiza los
        campos presentes en el body (allowlist) — se puede enviar una sola sección
        (ej. solo `heroSlides`) sin afectar el resto del documento.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreConfigUpdateRequest"
      responses:
        "200":
          description: Configuración de tienda actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreConfigUpdateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Conflicto de unicidad en configuración de tienda
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    orderToken:
      type: apiKey
      in: header
      name: X-Order-Token
      description: >
        Token de acceso a un pedido (tokenType=order_access) que devuelve
        POST /api/orders/public. Solo sirve para ese pedido y para subir/ver
        su comprobante de pago.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT de acceso (tokenType=access) firmado con HS256.
        Validación estricta de issuer (JWT_ISSUER) y audience (JWT_AUDIENCE).

  parameters:
    LoyaltyCustomerId:
      in: path
      name: customerId
      required: true
      schema:
        type: string
