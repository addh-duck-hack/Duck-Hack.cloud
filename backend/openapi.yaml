openapi: 3.0.3
info:
  title: Duck-Hack Cloud API
  version: 1.0.0
  description: >
    API base del proyecto CRM/eCommerce (estado actual).
    Incluye autenticación, gestión de usuarios, contacto por correo y archivos públicos.
servers:
  - url: http://localhost:5000
    description: Local backend
  - url: http://localhost:83
    description: Docker Compose backend
tags:
  - name: Auth
  - name: Users
  - name: Mail
  - name: Uploads
  - name: AgencyClients
paths:
  /api/users/register:
    post:
      tags: [Auth]
      summary: Registrar usuario customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/EmailAlreadyRegistered"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/users/verify:
    get:
      tags: [Auth]
      summary: Verificar cuenta por token de correo
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cuenta verificada o ya verificada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Token faltante o inválido/expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/UserNotFound"

  /api/users/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Cuenta no verificada o rol no soportado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/users:
    get:
      tags: [Users]
      summary: Listar usuarios
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Obtener usuario por id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      responses:
        "200":
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags: [Users]
      summary: Actualizar usuario (datos generales y/o rol)
      description: >
        No permite cambiar email. Soporta multipart/form-data para profileImage.
        El archivo se valida por contenido real (no solo mimetype) y se aceptan únicamente JPG/PNG.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateUserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags: [Users]
      summary: Eliminar usuario por id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      responses:
        "200":
          description: Usuario eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteUserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/users/{id}/password:
    patch:
      tags: [Users]
      summary: Cambiar contraseña del usuario autenticado
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/mail/send-email:
    post:
      tags: [Mail]
      summary: Enviar correo de contacto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactEmailRequest"
      responses:
        "200":
          description: Correo enviado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: Error SMTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/uploads/products-image:
    post:
      tags: [Uploads]
      summary: Subir imagen de producto
      description: >
        Requiere autenticación y rol administrativo (`super_admin`, `store_admin`, `catalog_manager`).
        El archivo se valida por contenido real y se acepta únicamente JPG/PNG (máx. 5MB).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                productImage:
                  type: string
                  format: binary
                  description: Imagen del producto en JPG o PNG
              required: [productImage]
      responses:
        "201":
          description: Imagen de producto subida correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImageUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /uploads/{fileName}:
    get:
      tags: [Uploads]
      summary: Obtener archivo estático subido
      parameters:
        - in: path
          name: fileName
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Archivo servido por Express static
        "404":
          $ref: "#/components/responses/RouteNotFound"

  /api/agency-clients:
    get:
      tags: [AgencyClients]
      summary: Listar clientes de agencia con estado calculado
      description: >
        Información confidencial de facturación interna de la agencia (no confundir con el rol `customer`).
        Acceso exclusivo a `super_admin`. Cada item incluye `hostingPaidUntil` (fecha del último pago vigente)
        y `pendingDebtTotal`/`pendingDebtCount` (deuda de diseño pendiente), calculados vía agregación.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Listado de clientes de agencia
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgencyClientListItem"
                required: [items]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [AgencyClients]
      summary: Crear cliente de agencia
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencyClientCreateRequest"
      responses:
        "201":
          description: Cliente de agencia creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  client:
                    $ref: "#/components/schemas/AgencyClient"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/agency-clients/{id}:
    get:
      tags: [AgencyClients]
      summary: Obtener ficha de un cliente de agencia
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyClientIdParam"
      responses:
        "200":
          description: Cliente de agencia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencyClient"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AgencyClientNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [AgencyClients]
      summary: Editar cliente de agencia
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyClientIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencyClientCreateRequest"
      responses:
        "200":
          description: Cliente de agencia actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  client:
                    $ref: "#/components/schemas/AgencyClient"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AgencyClientNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [AgencyClients]
      summary: Eliminar cliente de agencia
      description: >
        Bloqueado con 409 si el cliente tiene pagos de hosting o deudas de diseño asociados
        (sin borrado en cascada, para no destruir historial financiero por accidente).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyClientIdParam"
      responses:
        "200":
          description: Cliente de agencia eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AgencyClientNotFound"
        "409":
          $ref: "#/components/responses/AgencyClientHasRelatedRecords"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/agency-clients/{id}/hosting-payments:
    get:
      tags: [AgencyClients]
      summary: Listar historial de pagos de hosting de un cliente
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyClientIdParam"
      responses:
        "200":
          description: Historial de pagos
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/HostingPayment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AgencyClientNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [AgencyClients]
      summary: Registrar pago de hosting
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyClientIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostingPaymentCreateRequest"
      responses:
        "201":
          description: Pago de hosting registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  payment:
                    $ref: "#/components/schemas/HostingPayment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AgencyClientNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/agency-clients/{id}/hosting-payments/{paymentId}:
    put:
      tags: [AgencyClients]
      summary: Editar pago de hosting
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyClientIdParam"
        - $ref: "#/components/parameters/HostingPaymentIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostingPaymentCreateRequest"
      responses:
        "200":
          description: Pago de hosting actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  payment:
                    $ref: "#/components/schemas/HostingPayment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Cliente o pago de hosting no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [AgencyClients]
      summary: Eliminar pago de hosting
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyClientIdParam"
        - $ref: "#/components/parameters/HostingPaymentIdParam"
      responses:
        "200":
          description: Pago de hosting eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Cliente o pago de hosting no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/agency-clients/{id}/design-debts:
    get:
      tags: [AgencyClients]
      summary: Listar deudas de diseño de un cliente
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyClientIdParam"
      responses:
        "200":
          description: Historial de deudas de diseño
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DesignDebt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AgencyClientNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [AgencyClients]
      summary: Registrar deuda de diseño
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyClientIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesignDebtCreateRequest"
      responses:
        "201":
          description: Deuda de diseño registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  debt:
                    $ref: "#/components/schemas/DesignDebt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AgencyClientNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/agency-clients/{id}/design-debts/{debtId}:
    put:
      tags: [AgencyClients]
      summary: Editar deuda de diseño (incluye marcar pagada vía amountPaid)
      description: >
        `status` no se acepta del cliente: se recalcula server-side a partir de `amount`/`amountPaid`
        (`pending`/`partial`/`paid`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyClientIdParam"
        - $ref: "#/components/parameters/DesignDebtIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesignDebtCreateRequest"
      responses:
        "200":
          description: Deuda de diseño actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  debt:
                    $ref: "#/components/schemas/DesignDebt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Cliente o deuda de diseño no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [AgencyClients]
      summary: Eliminar deuda de diseño
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyClientIdParam"
        - $ref: "#/components/parameters/DesignDebtIdParam"
      responses:
        "200":
          description: Deuda de diseño eliminada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Cliente o deuda de diseño no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT de acceso (tokenType=access) firmado con HS256.
        Validación estricta de issuer (JWT_ISSUER) y audience (JWT_AUDIENCE).

  parameters:
    UserIdParam:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: ObjectId de usuario

    AgencyClientIdParam:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: ObjectId del cliente de agencia

    HostingPaymentIdParam:
      in: path
      name: paymentId
      required: true
      schema:
        type: string
      description: ObjectId del pago de hosting

    DesignDebtIdParam:
      in: path
      name: debtId
      required: true
      schema:
        type: string
      description: ObjectId de la deuda de diseño

  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: No autenticado o token inválido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Sin permisos para la operación
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UserNotFound:
      description: Usuario no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    EmailAlreadyRegistered:
      description: El correo ya está registrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Demasiadas solicitudes en una ventana de tiempo
      headers:
        Retry-After:
          description: Segundos recomendados para reintentar
          schema:
            type: integer
        X-RateLimit-Limit:
          description: Límite de solicitudes para la ventana
          schema:
            type: integer
        X-RateLimit-Remaining:
          description: Solicitudes restantes en la ventana actual
          schema:
            type: integer
        X-RateLimit-Reset:
          description: Epoch en segundos cuando se reinicia la ventana
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            rateLimitExceeded:
              summary: Ejemplo de límite excedido
              value:
                ok: false
                error:
                  status: 429
                  code: RATE_LIMIT_LOGIN_EXCEEDED
                  message: Demasiados intentos de inicio de sesión. Intenta nuevamente más tarde.
                  details:
                    retryAfterSec: 120
    RouteNotFound:
      description: Ruta no encontrada
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AgencyClientNotFound:
      description: Cliente de agencia no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AgencyClientHasRelatedRecords:
      description: No se puede eliminar el cliente porque tiene pagos de hosting o deudas de diseño asociados
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Role:
      type: string
      enum:
        - super_admin
        - store_admin
        - catalog_manager
        - order_manager
        - customer

    UserPublic:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        profileImage:
          type: string
          nullable: true
        isVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [_id, name, email, role, isVerified, createdAt]

    UserListItem:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        isVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [_id, name, email, role, isVerified, createdAt]

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
      required: [name, email, password]

    RegisterResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: "#/components/schemas/UserPublic"
      required: [message, user]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserPublic"
      required: [message, token, user]

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        role:
          $ref: "#/components/schemas/Role"
        profileImage:
          type: string
          format: binary
          description: Imagen real en formato JPG o PNG (máximo 5MB).

    UpdateUserResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: "#/components/schemas/UserPublic"
      required: [message, user]

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6
      required: [currentPassword, newPassword]

    DeleteUserResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: "#/components/schemas/UserPublic"
      required: [message, user]

    ContactEmailRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 30
        service:
          type: string
          maxLength: 120
        message:
          type: string
          minLength: 10
          maxLength: 2000
      required: [fullName, email, service, message]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    ProductImageUploadResponse:
      type: object
      properties:
        message:
          type: string
        imagePath:
          type: string
          example: uploads/productImage-1718282784-uuid.jpg
      required: [message, imagePath]

    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: object
          properties:
            status:
              type: integer
              example: 400
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            details:
              oneOf:
                - type: string
                - type: object
                - type: array
                  items: {}
          required: [status, code, message]
      required: [ok, error]

    AgencyClient:
      type: object
      description: >
        Registro interno de agencia (negocio-cliente de Duck-Hack). No confundir con el rol `customer`
        (comprador final de una tienda). Información confidencial, solo accesible a `super_admin`.
      properties:
        _id:
          type: string
        businessName:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
        siteUrl:
          type: string
        hostingPlan:
          $ref: "#/components/schemas/HostingPlan"
        hostingMonthlyCost:
          type: number
          description: >
            Para basic/medium/advanced se deriva server-side del precio de lista
            (no editable); solo se captura a mano cuando hostingPlan es "enterprise".
        dockerImage:
          type: string
        domain:
          type: string
        domainExpiresAt:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [_id, businessName, isActive, createdAt, updatedAt]

    AgencyClientCreateRequest:
      type: object
      properties:
        businessName:
          type: string
          minLength: 2
          maxLength: 150
        contactName:
          type: string
          maxLength: 120
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
          maxLength: 30
        siteUrl:
          type: string
          maxLength: 300
        hostingPlan:
          $ref: "#/components/schemas/HostingPlan"
        hostingMonthlyCost:
          type: number
          description: Requerido y > 0 solo cuando hostingPlan es "enterprise"; para los demás planes se ignora y se deriva del precio de lista.
        dockerImage:
          type: string
          maxLength: 200
        domain:
          type: string
          maxLength: 200
        domainExpiresAt:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          maxLength: 2000
        isActive:
          type: boolean
      required: [businessName]

    AgencyClientListItem:
      allOf:
        - $ref: "#/components/schemas/AgencyClient"
        - type: object
          properties:
            hostingPaidUntil:
              type: string
              format: date-time
              nullable: true
              description: coversUntil del último pago de hosting registrado (null si nunca se registró uno).
            pendingDebtTotal:
              type: number
              description: Suma de (amount - amountPaid) de las deudas de diseño con status != paid.
            pendingDebtCount:
              type: integer
          required: [pendingDebtTotal, pendingDebtCount]

    HostingPayment:
      type: object
      properties:
        _id:
          type: string
        client:
          type: string
          description: ObjectId del AgencyClient
        paidAt:
          type: string
          format: date-time
        coversUntil:
          type: string
          format: date-time
        amount:
          type: number
          nullable: true
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [_id, client, paidAt, coversUntil]

    HostingPaymentCreateRequest:
      type: object
      properties:
        paidAt:
          type: string
          format: date
        coversUntil:
          type: string
          format: date
        amount:
          type: number
          minimum: 0
        notes:
          type: string
          maxLength: 500
      required: [paidAt, coversUntil]

    DesignDebtStatus:
      type: string
      readOnly: true
      enum: [pending, partial, paid]
      description: Recalculado server-side a partir de amount/amountPaid; nunca se acepta del cliente.

    HostingPlan:
      type: string
      enum: [basic, medium, advanced, enterprise]
      description: >
        Plan de hosting contratado (ver backend/utils/hostingPlans.js, debe coincidir con los precios
        publicados en frontend-user). "enterprise" es "bajo cotización" — sin precio de lista fijo.

    DesignDebt:
      type: object
      properties:
        _id:
          type: string
        client:
          type: string
          description: ObjectId del AgencyClient
        description:
          type: string
        amount:
          type: number
        amountPaid:
          type: number
        status:
          $ref: "#/components/schemas/DesignDebtStatus"
        invoicedAt:
          type: string
          format: date-time
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [_id, client, description, amount, amountPaid, status]

    DesignDebtCreateRequest:
      type: object
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 300
        amount:
          type: number
          exclusiveMinimum: 0
        amountPaid:
          type: number
          minimum: 0
          description: No puede superar amount.
        invoicedAt:
          type: string
          format: date
        notes:
          type: string
          maxLength: 500
      required: [description, amount]
