openapi: 3.0.3
info:
  title: Duck-Hack Cloud API
  version: 1.0.0
  description: >
    API base del proyecto CRM/eCommerce (estado actual).
    Incluye autenticación, gestión de usuarios, contacto por correo y archivos públicos.
servers:
  - url: http://localhost:5000
    description: Local backend
  - url: http://localhost:83
    description: Docker Compose backend
tags:
  - name: Auth
  - name: Users
  - name: Mail
  - name: Uploads
  - name: AgencyClients
  - name: Accounting
  - name: Invoices
  - name: Products
  - name: Inventory
  - name: Orders
  - name: StoreConfig
paths:
  /api/users/register:
    post:
      tags: [Auth]
      summary: Registrar usuario customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/EmailAlreadyRegistered"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/users/verify:
    get:
      tags: [Auth]
      summary: Verificar cuenta por token de correo
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cuenta verificada o ya verificada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Token faltante o inválido/expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/UserNotFound"

  /api/users/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Cuenta no verificada o rol no soportado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/users:
    get:
      tags: [Users]
      summary: Listar usuarios
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Obtener usuario por id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      responses:
        "200":
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags: [Users]
      summary: Actualizar usuario (datos generales y/o rol)
      description: >
        No permite cambiar email. Soporta multipart/form-data para profileImage.
        El archivo se valida por contenido real (no solo mimetype) y se aceptan únicamente JPG/PNG.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateUserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags: [Users]
      summary: Eliminar usuario por id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      responses:
        "200":
          description: Usuario eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteUserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/users/{id}/password:
    patch:
      tags: [Users]
      summary: Cambiar contraseña del usuario autenticado
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/mail/send-email:
    post:
      tags: [Mail]
      summary: Enviar correo de contacto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactEmailRequest"
      responses:
        "200":
          description: Correo enviado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: Error SMTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/uploads/products-image:
    post:
      tags: [Uploads]
      summary: Subir imagen de producto
      description: >
        Requiere autenticación y rol administrativo (`super_admin`, `store_admin`, `collaborator`).
        El archivo se valida por contenido real y se acepta únicamente JPG/PNG (máx. 5MB).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                productImage:
                  type: string
                  format: binary
                  description: Imagen del producto en JPG o PNG
              required: [productImage]
      responses:
        "201":
          description: Imagen de producto subida correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImageUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /uploads/{fileName}:
    get:
      tags: [Uploads]
      summary: Obtener archivo estático subido
      parameters:
        - in: path
          name: fileName
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Archivo servido por Express static
        "404":
          $ref: "#/components/responses/RouteNotFound"

  /api/agency-clients:
    get:
      tags: [AgencyClients]
      summary: Listar clientes de agencia con estado calculado
      description: >
        Información confidencial de facturación interna de la agencia (no confundir con el rol `customer`).
        Acceso exclusivo a `super_admin`. Cada item incluye `hostingPaidUntil` (fecha del último pago vigente)
        y `pendingDebtTotal`/`pendingDebtCount` (deuda pendiente), calculados vía agregación.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Listado de clientes de agencia
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgencyClientListItem"
                required: [items]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [AgencyClients]
      summary: Crear cliente de agencia
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencyClientCreateRequest"
      responses:
        "201":
          description: Cliente de agencia creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  client:
                    $ref: "#/components/schemas/AgencyClient"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/agency-clients/{id}:
    get:
      tags: [AgencyClients]
      summary: Obtener ficha de un cliente de agencia
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyClientIdParam"
      responses:
        "200":
          description: Cliente de agencia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencyClient"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AgencyClientNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [AgencyClients]
      summary: Editar cliente de agencia
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyClientIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencyClientCreateRequest"
      responses:
        "200":
          description: Cliente de agencia actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  client:
                    $ref: "#/components/schemas/AgencyClient"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AgencyClientNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [AgencyClients]
      summary: Eliminar cliente de agencia
      description: >
        Bloqueado con 409 si el cliente tiene pagos de hosting o deudas asociados
        (sin borrado en cascada, para no destruir historial financiero por accidente).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyClientIdParam"
      responses:
        "200":
          description: Cliente de agencia eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AgencyClientNotFound"
        "409":
          $ref: "#/components/responses/AgencyClientHasRelatedRecords"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/agency-clients/{id}/hosting-payments:
    get:
      tags: [AgencyClients]
      summary: Listar historial de pagos de hosting de un cliente
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyClientIdParam"
      responses:
        "200":
          description: Historial de pagos
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/HostingPayment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AgencyClientNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [AgencyClients]
      summary: Registrar pago de hosting
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyClientIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostingPaymentCreateRequest"
      responses:
        "201":
          description: Pago de hosting registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  payment:
                    $ref: "#/components/schemas/HostingPayment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AgencyClientNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/agency-clients/{id}/hosting-payments/{paymentId}:
    put:
      tags: [AgencyClients]
      summary: Editar pago de hosting
      description: >
        Además de actualizar el pago, sincroniza la transacción de ingreso
        generada automáticamente al registrarlo (monto y fecha actualizados):
        la crea si el pago no tenía monto y ahora sí, la actualiza si ya
        existía, o la elimina si el monto queda en 0/vacío. Si ese ingreso ya
        fue facturado (ver /api/invoices), responde 409 en vez de editar.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyClientIdParam"
        - $ref: "#/components/parameters/HostingPaymentIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostingPaymentCreateRequest"
      responses:
        "200":
          description: Pago de hosting actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  payment:
                    $ref: "#/components/schemas/HostingPayment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Cliente o pago de hosting no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: El ingreso ligado a este pago ya fue facturado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [AgencyClients]
      summary: Eliminar pago de hosting
      description: >
        También elimina la transacción de ingreso que se generó
        automáticamente al registrar este pago (identificada por
        sourceCollection + sourceId), para que el saldo de contabilidad no
        quede desfasado. Si ese ingreso ya fue facturado, responde 409 en vez
        de eliminar.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyClientIdParam"
        - $ref: "#/components/parameters/HostingPaymentIdParam"
      responses:
        "200":
          description: Pago de hosting eliminado (junto con su ingreso ligado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Cliente o pago de hosting no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: El ingreso ligado a este pago ya fue facturado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/agency-clients/{id}/design-debts:
    get:
      tags: [AgencyClients]
      summary: Listar deudas de un cliente
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyClientIdParam"
      responses:
        "200":
          description: Historial de deudas
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DesignDebt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AgencyClientNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [AgencyClients]
      summary: Registrar deuda
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyClientIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesignDebtCreateRequest"
      responses:
        "201":
          description: Deuda registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  debt:
                    $ref: "#/components/schemas/DesignDebt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AgencyClientNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/agency-clients/{id}/design-debts/{debtId}:
    put:
      tags: [AgencyClients]
      summary: Editar deuda (incluye marcar pagada vía amountPaid)
      description: >
        `status` no se acepta del cliente: se recalcula server-side a partir de `amount`/`amountPaid`
        (`pending`/`partial`/`paid`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyClientIdParam"
        - $ref: "#/components/parameters/DesignDebtIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesignDebtCreateRequest"
      responses:
        "200":
          description: Deuda actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  debt:
                    $ref: "#/components/schemas/DesignDebt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Cliente o deuda no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [AgencyClients]
      summary: Eliminar deuda
      description: >
        También elimina las transacciones de ingreso generadas
        automáticamente por los abonos a esta deuda (puede haber varias si se
        pagó en partes vía ediciones sucesivas), identificadas por
        sourceCollection + sourceId. Si alguno de esos ingresos ya fue
        facturado, responde 409 en vez de eliminar.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyClientIdParam"
        - $ref: "#/components/parameters/DesignDebtIdParam"
      responses:
        "200":
          description: Deuda eliminada (junto con sus ingresos ligados)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Cliente o deuda no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Alguno de los ingresos ligados a esta deuda ya fue facturado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/agency-clients/{id}/docker-status:
    get:
      tags: [AgencyClients]
      summary: Estado en vivo de los contenedores Docker del cliente (vía Portainer)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyClientIdParam"
      responses:
        "200":
          description: Estado por contenedor
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DockerContainerStatus"
                  checkedAt:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AgencyClientNotFound"
        "501":
          description: Portainer no configurado en el backend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Portainer inalcanzable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/accounting/transactions:
    get:
      tags: [Accounting]
      summary: Listar transacciones (filtrable por type/client/rango de fechas)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [income, expense]
        - in: query
          name: client
          schema:
            type: string
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
        - in: query
          name: invoiced
          description: "true = solo ya facturadas, false = solo pendientes de facturar"
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: Listado de transacciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
