        - $ref: "#/components/schemas/AppHomeCategoryGridSection"
        - $ref: "#/components/schemas/AppHomeNoticeSection"
        - $ref: "#/components/schemas/AppHomeStoreHeroSection"
        - $ref: "#/components/schemas/AppHomeStoreMetricsSection"
        - $ref: "#/components/schemas/AppHomeStoreCommandsSection"
        - $ref: "#/components/schemas/AppHomeStoreServicesSection"
        - $ref: "#/components/schemas/AppHomeStorePricingPlansSection"
        - $ref: "#/components/schemas/AppHomeStoreFaqsSection"
        - $ref: "#/components/schemas/AppHomeStoreTeamSection"
        - $ref: "#/components/schemas/AppHomeStoreTestimonialsSection"
        - $ref: "#/components/schemas/AppHomePromoBannersSection"
      discriminator:
        propertyName: type
        mapping:
          banner: "#/components/schemas/AppHomeBannerSection"
          productCarousel: "#/components/schemas/AppHomeProductCarouselSection"
          categoryGrid: "#/components/schemas/AppHomeCategoryGridSection"
          notice: "#/components/schemas/AppHomeNoticeSection"
          storeHero: "#/components/schemas/AppHomeStoreHeroSection"
          storeMetrics: "#/components/schemas/AppHomeStoreMetricsSection"
          storeCommands: "#/components/schemas/AppHomeStoreCommandsSection"
          storeServices: "#/components/schemas/AppHomeStoreServicesSection"
          storePricingPlans: "#/components/schemas/AppHomeStorePricingPlansSection"
          storeFaqs: "#/components/schemas/AppHomeStoreFaqsSection"
          storeTeam: "#/components/schemas/AppHomeStoreTeamSection"
          storeTestimonials: "#/components/schemas/AppHomeStoreTestimonialsSection"
          promoBanners: "#/components/schemas/AppHomePromoBannersSection"

