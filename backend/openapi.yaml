        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Orders]
      summary: Actualizar estado/notas/dirección de envío de un pedido
      description: Solo super_admin, store_admin, collaborator. items/customer no se reabren después de creado.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdateRequest"
      responses:
        "200":
          description: Pedido actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  order:
                    $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Orders]
      summary: Eliminar pedido
      description: Solo super_admin, store_admin, collaborator.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderIdParam"
      responses:
        "200":
          description: Pedido eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/store-config/public:
    get:
      tags: [StoreConfig]
      summary: Consultar configuración pública de la tienda
      description: >
        Sin autenticación. Devuelve la configuración de tienda activa
        (`isActive: true`) para que el storefront la consuma en runtime.
      responses:
        "200":
          description: Configuración de tienda activa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreConfig"
        "404":
          description: No hay configuración de tienda activa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/store-config:
    get:
      tags: [StoreConfig]
      summary: Consultar configuración de tienda (administración)
      description: Requiere autenticación y rol `super_admin` o `store_admin`. Devuelve el documento completo, activo o no.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Configuración de tienda
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No hay configuración de tienda
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [StoreConfig]
      summary: Actualizar configuración de tienda (parcial por campo)
      description: >
        Requiere autenticación y rol `super_admin` o `store_admin`. Solo actualiza los
        campos presentes en el body (allowlist) — se puede enviar una sola sección
        (ej. solo `heroSlides`) sin afectar el resto del documento.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreConfigUpdateRequest"
      responses:
        "200":
          description: Configuración de tienda actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreConfigUpdateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Conflicto de unicidad en configuración de tienda
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/store-config/upload-image:
    post:
      tags: [StoreConfig]
      summary: Subir imagen de store-config (logo, foto de equipo, foto de testimonio)
      description: >
        Requiere autenticación y rol `super_admin` o `store_admin`.
        El archivo se valida por contenido real y se acepta únicamente JPG/PNG (máx. 5MB).
        Endpoint genérico: el cliente decide a qué campo asigna el `imagePath` devuelto.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: Imagen en JPG o PNG
              required: [image]
      responses:
        "201":
          description: Imagen subida correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreImageUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT de acceso (tokenType=access) firmado con HS256.
        Validación estricta de issuer (JWT_ISSUER) y audience (JWT_AUDIENCE).

  parameters:
    UserIdParam:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: ObjectId de usuario

    AgencyClientIdParam:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: ObjectId del cliente de agencia

    HostingPaymentIdParam:
      in: path
      name: paymentId
      required: true
      schema:
        type: string
      description: ObjectId del pago de hosting

    DesignDebtIdParam:
      in: path
      name: debtId
      required: true
      schema:
        type: string
      description: ObjectId de la deuda

    TransactionIdParam:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: ObjectId de la transacción de contabilidad

    ProductIdParam:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: ObjectId del producto

    InventoryIdParam:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: ObjectId del registro de inventario

    OrderIdParam:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: ObjectId del pedido

  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: No autenticado o token inválido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Sin permisos para la operación
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UserNotFound:
      description: Usuario no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    EmailAlreadyRegistered:
      description: El correo ya está registrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Demasiadas solicitudes en una ventana de tiempo
      headers:
        Retry-After:
          description: Segundos recomendados para reintentar
          schema:
            type: integer
        X-RateLimit-Limit:
          description: Límite de solicitudes para la ventana
          schema:
            type: integer
        X-RateLimit-Remaining:
          description: Solicitudes restantes en la ventana actual
          schema:
            type: integer
        X-RateLimit-Reset:
          description: Epoch en segundos cuando se reinicia la ventana
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            rateLimitExceeded:
              summary: Ejemplo de límite excedido
              value:
                ok: false
                error:
                  status: 429
                  code: RATE_LIMIT_LOGIN_EXCEEDED
                  message: Demasiados intentos de inicio de sesión. Intenta nuevamente más tarde.
                  details:
                    retryAfterSec: 120
    RouteNotFound:
      description: Ruta no encontrada
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AgencyClientNotFound:
      description: Cliente de agencia no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AgencyClientHasRelatedRecords:
      description: No se puede eliminar el cliente porque tiene pagos de hosting o deudas asociados
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Role:
      type: string
      enum:
        - super_admin
        - store_admin
        - collaborator
        - customer

    UserPublic:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        profileImage:
          type: string
          nullable: true
        isVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [_id, name, email, role, isVerified, createdAt]

    UserListItem:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        isVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [_id, name, email, role, isVerified, createdAt]

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
      required: [name, email, password]

    RegisterResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: "#/components/schemas/UserPublic"
      required: [message, user]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserPublic"
      required: [message, token, user]

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        role:
          $ref: "#/components/schemas/Role"
        profileImage:
          type: string
          format: binary
          description: Imagen real en formato JPG o PNG (máximo 5MB).

    UpdateUserResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: "#/components/schemas/UserPublic"
      required: [message, user]

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6
      required: [currentPassword, newPassword]

    DeleteUserResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: "#/components/schemas/UserPublic"
      required: [message, user]

    ContactEmailRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 30
        service:
          type: string
          maxLength: 120
        message:
          type: string
          minLength: 10
          maxLength: 2000
      required: [fullName, email, service, message]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    ProductImageUploadResponse:
      type: object
      properties:
        message:
          type: string
        imagePath:
          type: string
          example: uploads/productImage-1718282784-uuid.jpg
      required: [message, imagePath]

    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: object
          properties:
            status:
              type: integer
              example: 400
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            details:
              oneOf:
                - type: string
                - type: object
                - type: array
                  items: {}
          required: [status, code, message]
      required: [ok, error]

    AgencyClient:
      type: object
      description: >
        Registro interno de agencia (negocio-cliente de Duck-Hack). No confundir con el rol `customer`
        (comprador final de una tienda). Información confidencial, solo accesible a `super_admin`.
      properties:
        _id:
          type: string
        businessName:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
        siteUrl:
          type: string
        hostingPlan:
          $ref: "#/components/schemas/HostingPlan"
        hostingMonthlyCost:
          type: number
          description: >
            Para basic/medium/advanced se deriva server-side del precio de lista
            (no editable); solo se captura a mano cuando hostingPlan es "enterprise".
        dockerContainers:
          type: array
          items:
            type: string
          description: Nombres exactos de contenedor en Portainer/Docker (un cliente puede tener varios).
        domain:
          type: string
        domainExpiresAt:
          type: string
          format: date-time
          nullable: true
        billingName:
          type: string
        billingRfc:
          type: string
        billingAddress:
          type: string
        billingEmail:
          type: string
          format: email
        notes:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [_id, businessName, isActive, createdAt, updatedAt]

    AgencyClientCreateRequest:
      type: object
      properties:
        businessName:
          type: string
          minLength: 2
          maxLength: 150
        contactName:
          type: string
          maxLength: 120
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
          maxLength: 30
        siteUrl:
          type: string
          maxLength: 300
        hostingPlan:
          $ref: "#/components/schemas/HostingPlan"
        hostingMonthlyCost:
          type: number
          description: Requerido y > 0 solo cuando hostingPlan es "enterprise"; para los demás planes se ignora y se deriva del precio de lista.
        dockerContainers:
          type: array
          items:
            type: string
            maxLength: 200
        domain:
          type: string
          maxLength: 200
        domainExpiresAt:
          type: string
          format: date
          nullable: true
        billingName:
          type: string
          maxLength: 200
        billingRfc:
          type: string
          maxLength: 20
        billingAddress:
          type: string
          maxLength: 300
        billingEmail:
          type: string
          format: email
        notes:
          type: string
          maxLength: 2000
        isActive:
          type: boolean
      required: [businessName]

    AgencyClientListItem:
      allOf:
        - $ref: "#/components/schemas/AgencyClient"
        - type: object
          properties:
            hostingPaidUntil:
              type: string
              format: date-time
              nullable: true
              description: coversUntil del último pago de hosting registrado (null si nunca se registró uno).
            pendingDebtTotal:
              type: number
              description: Suma de (amount - amountPaid) de las deudas con status != paid.
            pendingDebtCount:
              type: integer
          required: [pendingDebtTotal, pendingDebtCount]

    HostingPayment:
      type: object
      properties:
        _id:
          type: string
        client:
          type: string
          description: ObjectId del AgencyClient
        paidAt:
          type: string
          format: date-time
        coversUntil:
          type: string
          format: date-time
        amount:
          type: number
          nullable: true
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [_id, client, paidAt, coversUntil]

    HostingPaymentCreateRequest:
      type: object
      properties:
        paidAt:
          type: string
          format: date
        coversUntil:
          type: string
          format: date
        amount:
          type: number
          minimum: 0
        notes:
          type: string
          maxLength: 500
      required: [paidAt, coversUntil]

    DesignDebtStatus:
      type: string
      readOnly: true
      enum: [pending, partial, paid]
      description: Recalculado server-side a partir de amount/amountPaid; nunca se acepta del cliente.

    HostingPlan:
      type: string
      enum: [free, basic, medium, advanced, enterprise]
      description: >
        Plan de hosting contratado (ver backend/utils/hostingPlans.js, debe coincidir con los precios
        publicados en frontend-user). "enterprise" es "bajo cotización" — sin precio de lista fijo.
        "free" no es un plan comercial: es para servicios/dominios propios de la agencia (precio
        fijo en 0) que igual se mapean aquí porque generan gasto de dominio/hosting/licencias/docker,
        registrado como egreso en /api/accounting en vez de como cobro de hosting.

    DesignDebt:
      type: object
      properties:
        _id:
          type: string
        client:
          type: string
          description: ObjectId del AgencyClient
        description:
          type: string
        amount:
          type: number
        amountPaid:
          type: number
        status:
          $ref: "#/components/schemas/DesignDebtStatus"
        invoicedAt:
          type: string
          format: date-time
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [_id, client, description, amount, amountPaid, status]

    DesignDebtCreateRequest:
      type: object
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 300
        amount:
          type: number
          exclusiveMinimum: 0
        amountPaid:
          type: number
          minimum: 0
          description: No puede superar amount.
        invoicedAt:
          type: string
          format: date
        notes:
          type: string
          maxLength: 500
      required: [description, amount]

    DockerContainerStatus:
      type: object
      properties:
        name:
          type: string
        found:
          type: boolean
        state:
          type: string
          description: Estado real de Docker (running/exited/paused/...) o "not_found" si el nombre no coincide con ningún contenedor.
        status:
          type: string
          description: Texto legible de Docker (ej. "Up 3 days").
        imageSizeBytes:
          type: integer
          nullable: true
        writableLayerSizeBytes:
          type: integer
          nullable: true
        cpuPercent:
          type: number
          nullable: true
        memoryUsedBytes:
          type: integer
          nullable: true
        network:
          type: object
          nullable: true
          properties:
            rxBytes:
              type: integer
            txBytes:
              type: integer

    TransactionType:
      type: string
      enum: [income, expense]

    TransactionSource:
      type: string
      readOnly: true
      enum: [manual, hosting_payment, design_debt, opening_balance]
      description: Solo "manual" se puede editar/eliminar directamente; las demás se generan automáticamente.

    Transaction:
      type: object
      properties:
        _id:
          type: string
        type:
          $ref: "#/components/schemas/TransactionType"
        amount:
          type: number
        date:
          type: string
          format: date-time
        category:
          type: string
        description:
          type: string
        client:
          type: string
          nullable: true
        source:
          $ref: "#/components/schemas/TransactionSource"
        sourceCollection:
          type: string
          nullable: true
        sourceId:
          type: string
          nullable: true
        invoice:
          type: string
          nullable: true
          description: Id de la factura que cubre este movimiento, o null si aún no se ha facturado.
        createdAt:
          type: string
          format: date-time
      required: [_id, type, amount, date, source]

    TransactionCreateRequest:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/TransactionType"
        amount:
          type: number
          exclusiveMinimum: 0
        date:
          type: string
          format: date
        category:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 500
        client:
          type: string
          nullable: true
      required: [type, amount]

    AccountingMonthSummary:
      type: object
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
        income:
          type: number
        expense:
          type: number
        closingBalance:
          type: number
          description: >
            Saldo con el que cerró la cuenta al final de este mes (arrastrado desde antes del
            año consultado + el neto acumulado del año hasta este mes inclusive) — no es solo
            el neto del mes, sino el saldo real de la cuenta en ese punto en el tiempo.

    AccountingSummary:
      type: object
      properties:
        year:
          type: integer
        currentBalance:
          type: number
          description: Saldo total acumulado (todo el tiempo, no solo el año consultado).
        months:
          type: array
          items:
            $ref: "#/components/schemas/AccountingMonthSummary"

    InvoiceSource:
      type: string
      readOnly: true
      enum: [manual, hosting_payment, design_debt, movements]
      description: >
        "movements" = facturas creadas seleccionando uno o más Transaction
        existentes (el flujo actual). Los demás valores son históricos, de
        antes de que facturar dejara de ser automático por cada pago.

    Invoice:
      type: object
      properties:
        _id:
          type: string
        client:
          type: string
        folio:
          type: integer
        concept:
          type: string
        amount:
          type: number
        issuedAt:
          type: string
          format: date-time
        source:
          $ref: "#/components/schemas/InvoiceSource"
        transactions:
          type: array
          items:
            type: string
          description: Movimientos (Transaction) cubiertos por esta factura.
        items:
          type: array
          description: Desglose por movimiento (snapshot al facturar) — un renglón por concepto/monto en el PDF. Vacío en facturas antiguas sin desglose.
          items:
            type: object
            properties:
              concept:
                type: string
              amount:
                type: number
      required: [_id, client, folio, concept, amount, issuedAt]

    InvoiceCreateRequest:
      type: object
      description: >
        Crea una factura a partir de uno o más movimientos (Transaction) ya
        existentes del mismo cliente y el mismo mes calendario — no acepta
        monto/fecha arbitrarios.
      properties:
        client:
          type: string
        transactionIds:
          type: array
          minItems: 1
          items:
            type: string
        itemConcepts:
          type: array
          description: >
            Opcional. Concepto que se imprime para cada movimiento, paralelo a
            transactionIds (itemConcepts[i] es el concepto de transactionIds[i]).
            Si se envía, debe tener exactamente la misma longitud que
            transactionIds. Un elemento vacío cae al description/categoría del
            movimiento. El concepto "resumen" de la factura (Invoice.concept, el
            del listado) siempre lo compone el servidor a partir de categorías +
            mes; ya no se acepta del payload.
          items:
            type: string
            maxLength: 300
      required: [client, transactionIds]

    InvoiceUpdateRequest:
      type: object
      description: >
        Edición acotada de una factura ya emitida. Todos los campos son
        opcionales pero debe ir al menos uno.
      properties:
        items:
          type: array
          description: >
            Posicional — items[i].concept reemplaza el concepto del renglón i de
            la factura. La longitud debe ser exactamente la de Invoice.items.
          items:
            type: object
            properties:
              concept:
                type: string
                minLength: 1
                maxLength: 300
            required: [concept]
        issuedAt:
          type: string
          format: date
          description: Fecha de emisión (fecha de calendario, se guarda como medianoche UTC).

    Product:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        sku:
          type: string
        description:
          type: string
        price:
          type: number
        compareAtPrice:
          type: number
          nullable: true
        category:
          type: string
        images:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [_id, name, sku, price]

    ProductCreateRequest:
      type: object
      properties:
        name:
          type: string
        sku:
          type: string
        description:
          type: string
        price:
          type: number
          minimum: 0
        compareAtPrice:
          type: number
          minimum: 0
        category:
          type: string
        images:
          type: array
          items:
            type: string
          description: Paths devueltos por POST /api/uploads/products-image.
        isActive:
          type: boolean
      required: [name, sku, price]

    Inventory:
      type: object
      properties:
        _id:
          type: string
        product:
          type: string
          description: ObjectId de Product, o el objeto poblado en GET /api/inventory[/{id}].
        quantity:
          type: number
        lowStockThreshold:
          type: number
        status:
          type: string
          readOnly: true
          enum: [in_stock, low_stock, out_of_stock]
          description: Recalculado server-side a partir de quantity/lowStockThreshold — nunca se acepta del cliente.
        notes:
          type: string
      required: [_id, product, quantity, status]

    InventoryCreateRequest:
      type: object
      properties:
        product:
          type: string
        quantity:
          type: number
          minimum: 0
        lowStockThreshold:
          type: number
          minimum: 0
        notes:
          type: string
      required: [product, quantity]

    OrderItem:
      type: object
      properties:
        product:
          type: string
        productName:
          type: string
          readOnly: true
          description: Snapshot del nombre del producto al momento de crear el pedido.
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number
          readOnly: true
          description: Snapshot del precio del producto al momento de crear el pedido.
        subtotal:
          type: number
          readOnly: true
      required: [product, quantity]

    Order:
      type: object
      properties:
        _id:
          type: string
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        customer:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        status:
          type: string
          enum: [pending, confirmed, processing, shipped, delivered, cancelled]
        total:
          type: number
          readOnly: true
        shippingAddress:
          type: string
        notes:
          type: string
        paymentMethod:
          type: string
          enum: [transfer, pickup]
          description: Sin pasarela — el pedido siempre entra "pending" y la tienda confirma el pago/entrega a mano.
        orderNumber:
          type: integer
          readOnly: true
          description: Folio legible secuencial, distinto de _id.
        createdAt:
          type: string
          format: date-time
      required: [_id, customerName, customerEmail, items, status, total]

    OrderCreateRequest:
      type: object
      description: total/productName/unitPrice/subtotal/orderNumber se calculan en el servidor a partir del precio actual de cada producto — no se aceptan del cliente.
      properties:
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        customer:
          type: string
          description: Opcional — ObjectId de un User existente.
        items:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              product:
                type: string
              quantity:
                type: integer
                minimum: 1
            required: [product, quantity]
        shippingAddress:
          type: string
        notes:
          type: string
      required: [customerName, customerEmail, items]

    PublicCheckoutRequest:
      type: object
      description: >
        Igual que OrderCreateRequest más `paymentMethod`. `customer` se ignora
        siempre (checkout anónimo, sin cuenta). `shippingAddress` es
        obligatorio cuando `paymentMethod` es "transfer".
      properties:
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        items:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              product:
                type: string
              quantity:
                type: integer
                minimum: 1
            required: [product, quantity]
        paymentMethod:
          type: string
          enum: [transfer, pickup]
          default: transfer
        shippingAddress:
          type: string
          description: Requerido si paymentMethod es "transfer".
        notes:
          type: string
      required: [customerName, customerEmail, items]

    OrderUpdateRequest:
      type: object
      description: Solo status/shippingAddress/notes — items/customer no se reabren después de creado el pedido.
      properties:
        status:
          type: string
          enum: [pending, confirmed, processing, shipped, delivered, cancelled]
        shippingAddress:
          type: string
        notes:
          type: string

    StoreTheme:
      type: object
      properties:
        primaryColor:
          type: string
          example: "#0B1F3A"
        secondaryColor:
          type: string
          example: "#F2F5F9"
        accentColor:
          type: string
          example: "#FF6B00"
        fontFamilyHeading:
          type: string
        fontFamilyBody:
          type: string

    SocialLinks:
      type: object
      properties:
        whatsapp:
          type: string
        instagram:
          type: string
        facebook:
          type: string
        threads:
          type: string

    LegalIdentity:
      type: object
      properties:
        legalName:
          type: string
        rfc:
          type: string
        legalRepresentative:
          type: string
        legalAddress:
          type: string
        legalEmail:
          type: string
        legalPhone:
          type: string

    HeroSlide:
      type: object
      properties:
        title:
          type: string
          maxLength: 160
        description:
          type: string
          maxLength: 300
        sortOrder:
          type: integer
          minimum: 0
        isActive:
          type: boolean
      required: [title]

    Metric:
      type: object
      properties:
        source:
          type: string
          enum: [manual, active_clients, active_containers]
          default: manual
          description: >
            "manual": value se edita a mano. "active_clients"/"active_containers": value se
            recalcula en cada GET /public a partir de datos reales (conteo de AgencyClient
            activos / contenedores corriendo vía Portainer) — el value guardado es solo un
            placeholder cuando source no es "manual".
        value:
          type: string
          maxLength: 20
          example: "99.9%"
        label:
          type: string
          maxLength: 80
        sortOrder:
          type: integer
          minimum: 0
      required: [label]

    Command:
      type: object
      properties:
        cmd:
          type: string
          maxLength: 80
          example: "desplegar hosting"
        note:
          type: string
          maxLength: 160
        icon:
          type: string
          maxLength: 60
          description: Clase de ícono FontAwesome (ej. "fas fa-server"). Opcional.
        sortOrder:
          type: integer
          minimum: 0
        isActive:
          type: boolean
      required: [cmd]

    ServiceItem:
      type: object
      properties:
        icon:
          type: string
          description: Clase de icono (ej. FontAwesome)
        route:
          type: string
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        sortOrder:
          type: integer
          minimum: 0
        isActive:
          type: boolean
      required: [title]

    PricingPlan:
      type: object
      properties:
        name:
          type: string
          maxLength: 60
        description:
          type: string
          maxLength: 300
        storage:
          type: string
        emailAccounts:
          type: string
        bandwidth:
          type: string
        ssl:
          type: string
        originalPrice:
          type: number
          minimum: 0
          nullable: true
        price:
          type: number
          minimum: 0
          nullable: true
        discountPercent:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        featured:
          type: boolean
        extraFeaturesTitle:
          type: string
        extraFeatures:
          type: array
          items:
            type: string
        sortOrder:
          type: integer
          minimum: 0
        isActive:
          type: boolean
      required: [name]

    Faq:
      type: object
      properties:
        q:
          type: string
          maxLength: 200
        a:
          type: string
          maxLength: 1000
        sortOrder:
          type: integer
          minimum: 0
        isActive:
          type: boolean
      required: [q, a]

    TeamMember:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        role:
          type: string
        bio:
          type: string
          maxLength: 500
        email:
          type: string
        phone:
          type: string
        photoUrl:
          type: string
          example: uploads/store-config-1718282784-uuid.jpg
        sortOrder:
          type: integer
          minimum: 0
        isActive:
          type: boolean
      required: [name]

    Testimonial:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        rubro:
          type: string
        description:
          type: string
          maxLength: 500
        url:
          type: string
        photoUrl:
          type: string
          example: uploads/store-config-1718282784-uuid.jpg
        sortOrder:
          type: integer
          minimum: 0
        isActive:
          type: boolean
      required: [name]

    StoreConfig:
      type: object
      properties:
        storeName:
          type: string
        storeSlug:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        logoUrl:
          type: string
        theme:
          $ref: "#/components/schemas/StoreTheme"
        socialLinks:
          $ref: "#/components/schemas/SocialLinks"
        legalIdentity:
          $ref: "#/components/schemas/LegalIdentity"
        heroSlides:
          type: array
          items:
            $ref: "#/components/schemas/HeroSlide"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"
        commands:
          type: array
          items:
            $ref: "#/components/schemas/Command"
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceItem"
        pricingPlans:
          type: array
          items:
            $ref: "#/components/schemas/PricingPlan"
        commonPlanChecks:
          type: array
          items:
            type: string
        faqs:
          type: array
          items:
            $ref: "#/components/schemas/Faq"
        teamMembers:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"
        testimonials:
          type: array
          items:
            $ref: "#/components/schemas/Testimonial"
        isActive:
          type: boolean
      required: [storeName, storeSlug]

    StoreConfigUpdateRequest:
      description: Todos los campos son opcionales — solo se actualizan los presentes en el body.
      allOf:
        - $ref: "#/components/schemas/StoreConfig"

    StoreConfigUpdateResponse:
      type: object
      properties:
        message:
          type: string
        storeConfig:
          $ref: "#/components/schemas/StoreConfig"
      required: [message, storeConfig]

    StoreImageUploadResponse:
      type: object
      properties:
        message:
          type: string
        imagePath:
          type: string
          example: uploads/store-config-1718282784-uuid.jpg
      required: [message, imagePath]
