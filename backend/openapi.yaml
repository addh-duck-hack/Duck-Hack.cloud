  /api/orders/public:
    post:
      tags: [Orders]
      summary: Checkout público (storefront)
      description: >
        Sin autenticación, rate-limited (10 min / 6 intentos por IP —
        `429 RATE_LIMIT_CHECKOUT_EXCEEDED`). Sin pasarela de pago: el pedido
        siempre entra `pending` y la tienda confirma el pago/entrega a mano
        según `paymentMethod`. Los precios se recalculan server-side desde el
        catálogo (nunca del payload) y solo se aceptan productos con
        `isActive: true` — `400 PRODUCT_UNAVAILABLE` si alguno no lo está.
        Envía correo de confirmación al cliente y aviso a la tienda
        (best-effort; un fallo de correo no impide crear el pedido).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicCheckoutRequest"
      responses:
        "201":
          description: Pedido creado (estado `pending`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  order:
                    $ref: "#/components/schemas/Order"
        "400":
          description: Validación fallida, o producto inexistente/no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Alguno de los productos referenciados no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Demasiados intentos de pedido desde la misma IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

