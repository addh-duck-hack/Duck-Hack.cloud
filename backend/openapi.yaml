  /api/inventory/movements:
    get:
      tags: [Inventory]
      summary: Historial de movimientos de inventario
      operationId: listInventoryMovements
      description: >-
        Más recientes primero; paginado con `before` (createdAt del último renglón). Motivos: initial,
        manual_adjust, order, order_release, wholesale_sale, wholesale_cancel, purchase, purchase_cancel.
        `PUT /api/inventory/{id}` acepta `movementNote` (motivo del ajuste, va al historial).
      security:
