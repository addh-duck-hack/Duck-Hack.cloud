openapi: 3.0.3
info:
  title: Duck-Hack Cloud API
  version: 1.0.0
  description: >
    API base del proyecto CRM/eCommerce (estado actual).
    Incluye autenticación, gestión de usuarios, contacto por correo y archivos públicos.
    Teléfonos (usuarios, direcciones, pedidos, citas, contacto/legal/SPEI/equipo de la
    tienda, clientes de la agencia): 10 dígitos de México. Se aceptan espacios, guiones y el
    prefijo +52 / 52 / 521, y se guardan solo los 10 dígitos; otro largo → 400
    VALIDATION_ERROR. WhatsApp (whatsappButton.phone) se manda a 10 dígitos y se guarda
    con el país (52 + 10) para los enlaces wa.me.
servers:
  - url: https://{apiHost}
    description: Backend desplegado de una tienda (un backend por tienda)
    variables:
      apiHost:
        default: api-tacita.duck-hack.cloud
        description: Host de la API de la tienda
  - url: http://localhost:5000
    description: Local backend
  - url: http://localhost:83
    description: Docker Compose backend
tags:
  - name: Auth
  - name: Users
  - name: Mail
  - name: Uploads
  - name: Media
  - name: AgencyClients
  - name: Accounting
  - name: Invoices
  - name: Infra
  - name: Products
  - name: Categories
    description: Categorías del catálogo. Permisos según `kind` — product como el módulo products, service como el módulo services
  - name: Inventory
  - name: Orders
  - name: Services
    description: Catálogo de servicios con duración y precio (módulo services; Citas lo lee)
  - name: Appointments
    description: >-
      Citas (módulo appointments). Especialistas, ajustes y bloqueos de todo el negocio solo
      super_admin/store_admin (403 APPOINTMENTS_MANAGER_ONLY); una collaborator solo ve su
      especialista (la ligada a su cuenta) y bloquea su propio horario.
  - name: Cart
    description: Carrito guardado en el servidor para usuarios con sesión (sin permisos; cada quien el suyo)
  - name: PromoBanners
    description: Banners de promociones con fechas y destino (módulo promoBanner de los permisos por tienda)
  - name: Wishlist
    description: >-
      Aviso "volvió a estar disponible" de los favoritos (módulo wishlist). Una tarea programada
      (cada 15 min) avisa por correo cuando un favorito agotado vuelve a tener existencias.
  - name: Coupons
    description: Cupones de descuento (módulo coupons de los permisos por tienda)
  - name: Reviews
    description: Reseñas de producto y de cita (moderación = módulo reviews de los permisos por tienda)
  - name: Loyalty
    description: >-
      Lealtad (módulo loyalty): puntos por compra pagada (1 punto = $1, canjeables en el
      checkout) y tarjeta de sellos por cita completada. Cada programa con su interruptor.
  - name: GiftCards
    description: >-
      Tarjetas de regalo (módulo giftCards): saldo en pesos que se usa en partes en el
      checkout (giftCardCode), en el local (canje desde el panel) o para el anticipo de una
      cita. Las del sitio se pagan por SPEI con comprobante; las de mostrador nacen activas.
  - name: Reports
    description: Reportes de ventas, citas, tarjetas y lealtad (módulo reports).
  - name: Wholesale
    description: >-
      Mayoreo (módulo wholesale): clientes mayoristas con crédito, ventas que descuentan inventario al
      entregarse, abonos y cuentas por cobrar. Lectura también para storeAccounting.
  - name: StoreAccounting
    description: >-
      Contabilidad de la tienda (módulo storeAccounting, distinta de la de agencia): movimientos manuales,
      saldo inicial, proveedores, compras (suben inventario y generan su gasto) e ingresos automáticos
      derivados de pedidos pagados, tarjetas de regalo, anticipos y abonos de mayoreo.
  - name: Dashboard
    description: >-
      Inicio del admin, para todo el staff y sin clave de permisos propia: cada sección solo si
      el rol tiene el módulo del que sale.
  - name: StoreConfig
  - name: Permissions
    description: Permisos por tienda — módulos contratados y qué puede usar cada rol (solo super_admin los configura)
  - name: AppHome
    description: Home de la app móvil armado por JSON desde el admin (módulo appConfig de los permisos por tienda)
  - name: AppProfile
    description: >-
      Menú del perfil de la app móvil (grupos con opciones + botones de cerrar sesión y calificar), armado
      desde Configurar App → Perfil (módulo appConfig), y páginas legales limpias para su web view.
paths:
  /api/users/register:
    post:
      tags: [Auth]
      summary: Registrar usuario customer
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/EmailAlreadyRegistered"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/users/verify:
    get:
      tags: [Auth]
      summary: Verificar cuenta por token de correo
      operationId: verifyEmail
      security: []
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cuenta verificada o ya verificada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Token faltante o inválido/expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/UserNotFound"

  /api/users/resend-verification:
    post:
      tags: [Auth]
      summary: Reenviar el correo de verificación
      operationId: resendVerificationEmail
      security: []
      description: >
        Rate-limited (5 cada 15 min por IP, `429 RATE_LIMIT_ACCOUNT_EMAIL_EXCEEDED`).
        Responde siempre lo mismo, exista o no la cuenta o ya esté verificada,
        para no revelar qué correos están registrados; solo manda el correo si
        hay una cuenta pendiente de verificar. El enlace va al storefront
        (`FRONTEND_URL/users/verify?token=`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required: [email]
      responses:
        "200":
          description: Solicitud recibida (respuesta genérica)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Demasiadas solicitudes desde la misma IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: No fue posible enviar el correo (EMAIL_SEND_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/forgot-password:
    post:
      tags: [Auth]
      summary: Pedir un enlace para restablecer la contraseña
      operationId: forgotPassword
      security: []
      description: >
        Rate-limited igual que resend-verification. Respuesta genérica; si la
        cuenta existe, manda un enlace de un solo uso
        (`FRONTEND_URL/restablecer-contrasena?token=`) que vence en
        `JWT_PASSWORD_RESET_EXPIRES_IN` (default 1h).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required: [email]
      responses:
        "200":
          description: Solicitud recibida (respuesta genérica)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Demasiadas solicitudes desde la misma IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: No fue posible enviar el correo (EMAIL_SEND_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/reset-password:
    post:
      tags: [Auth]
      summary: Restablecer la contraseña con el token del correo
      operationId: resetPassword
      security: []
      description: >
        El token deja de servir en cuanto la contraseña cambia (lleva una
        huella de la contraseña actual). Restablecer también marca la cuenta
        como verificada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 6
              required: [token, password]
      responses:
        "200":
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: >-
            Falta el token (RESET_TOKEN_REQUIRED), contraseña corta
            (VALIDATION_ERROR) o token inválido, vencido o ya usado
            (RESET_TOKEN_INVALID_OR_EXPIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Demasiados intentos desde la misma IP (10 cada 15 min, RATE_LIMIT_RESET_PASSWORD_EXCEEDED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Cuenta no verificada o rol no soportado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/users/refresh:
    post:
      tags: [Auth]
      summary: Renovar la sesión con un refresh token
      operationId: refreshSession
      security: []
      description: >
        Cambia un refresh token vigente (de `POST /api/users/login`) por un
        access token nuevo y un refresh token nuevo. **Rotación**: el refresh
        token enviado deja de servir; guarda siempre el último recibido. Si se
        reenvía un refresh token ya rotado dentro de los 30 s siguientes (dos
        peticiones simultáneas del mismo cliente) responde `409
        REFRESH_TOKEN_ALREADY_ROTATED` sin cerrar la sesión; después de eso se
        considera robado y se revoca toda la sesión (`401`). El rol del access
        token nuevo se lee de la BD. Rate limit: 120 / 15 min por IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Sesión renovada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshSessionResponse"
        "400":
          description: Falta el refresh token (REFRESH_TOKEN_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >
            Refresh token inexistente, vencido, revocado (logout, cambio de
            contraseña, cuenta eliminada) o reutilizado (REFRESH_TOKEN_INVALID)
            — el cliente debe pedir login de nuevo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Ya rotado por otra petición simultánea (REFRESH_TOKEN_ALREADY_ROTATED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/users/logout:
    post:
      tags: [Auth]
      summary: Cerrar la sesión de un refresh token
      operationId: logout
      security: []
      description: >
        Revoca el refresh token enviado y toda su sesión (sus rotaciones).
        Siempre `204`, exista o no el token. El access token sigue siendo
        válido hasta que venza (JWT sin estado): el cliente debe descartarlo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "204":
          description: Sesión cerrada
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/users:
    get:
      tags: [Users]
      summary: Listar usuarios
      operationId: listUsers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Users]
      summary: Crear cuenta de staff (panel)
      operationId: createUser
      description: >
        Módulo `users` de los permisos por tienda; nadie (salvo super_admin)
        crea un rol mayor al suyo. Versión "staff, autenticado" de
        POST /api/users/register — a diferencia de ese endpoint, aquí sí se
        elige `role`, y la cuenta entra ya `isVerified: true` (el admin le
        entrega la contraseña directo a la persona, no hace falta correo de
        verificación). store_admin no puede asignar el rol super_admin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffUserRequest"
      responses:
        "201":
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Rol no permitido, o intento de asignar super_admin sin ser super_admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/EmailAlreadyRegistered"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Obtener usuario por id
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      responses:
        "200":
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags: [Users]
      summary: Actualizar usuario (datos generales y/o rol)
      operationId: updateUser
      description: >
        No permite cambiar email. Soporta multipart/form-data para profileImage.
        El archivo se valida por contenido real (no solo mimetype) y se aceptan únicamente JPG/PNG.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateUserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags: [Users]
      summary: Eliminar usuario por id
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      responses:
        "200":
          description: Usuario eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteUserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/users/{id}/password:
    patch:
      tags: [Users]
      summary: Cambiar contraseña del usuario autenticado
      operationId: changePassword
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/users/{id}/favorites:
    post:
      tags: [Users]
      summary: Agregar un producto a favoritos
      operationId: addFavorite
      description: Solo el dueño de la cuenta (ni siquiera super_admin/store_admin). Idempotente — agregar el mismo producto dos veces no duplica la entrada.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: string
              required: [productId]
      responses:
        "200":
          description: Agregado a favoritos (favorites viene poblado, ver UserPublic)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Usuario o producto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/users/{id}/favorites/{productId}:
    delete:
      tags: [Users]
      summary: Quitar un producto de favoritos
      operationId: removeFavorite
      description: Solo el dueño de la cuenta. No es error quitar un producto que ya no estaba en favoritos.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
        - in: path
          name: productId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Quitado de favoritos (favorites viene poblado, ver UserPublic)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/users/{id}/addresses:
    post:
      tags: [Users]
      summary: Agregar una dirección a la libreta
      operationId: addAddress
      description: Solo el dueño de la cuenta. La primera dirección de la cuenta siempre queda como isDefault:true, aunque no se pida explícito.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressCreateRequest"
      responses:
        "201":
          description: Dirección agregada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/users/{id}/addresses/{addressId}:
    put:
      tags: [Users]
      summary: Editar una dirección de la libreta
      operationId: updateAddress
      description: Solo el dueño de la cuenta. Marcar isDefault:true le quita esa marca a las demás direcciones de la cuenta.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
        - in: path
          name: addressId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressUpdateRequest"
      responses:
        "200":
          description: Dirección actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Usuario o dirección no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Users]
      summary: Eliminar una dirección de la libreta
      operationId: deleteAddress
      description: Solo el dueño de la cuenta. Si se borra la dirección default y quedan otras, la primera que quede pasa a ser la nueva default.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
        - in: path
          name: addressId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dirección eliminada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Usuario o dirección no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/mail/send-email:
    post:
      tags: [Mail]
      summary: Enviar correo de contacto
      operationId: sendContactEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactEmailRequest"
