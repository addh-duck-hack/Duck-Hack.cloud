  /api/agency-clients/{id}/hosting-payments/{paymentId}:
    put:
      tags: [AgencyClients]
      summary: Editar pago de hosting
      operationId: updateHostingPayment
      description: >
        Además de actualizar el pago, sincroniza la transacción de ingreso
        generada automáticamente al registrarlo (monto y fecha actualizados):
        la crea si el pago no tenía monto y ahora sí, la actualiza si ya
        existía, o la elimina si el monto queda en 0/vacío. Si ese ingreso ya
        fue facturado (ver /api/invoices), responde 409 en vez de editar.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyClientIdParam"
        - $ref: "#/components/parameters/HostingPaymentIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostingPaymentCreateRequest"
      responses:
        "200":
          description: Pago de hosting actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  payment:
                    $ref: "#/components/schemas/HostingPayment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Cliente o pago de hosting no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: El ingreso ligado a este pago ya fue facturado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [AgencyClients]
      summary: Eliminar pago de hosting
      operationId: deleteHostingPayment
      description: >
        También elimina la transacción de ingreso que se generó
        automáticamente al registrar este pago (identificada por
        sourceCollection + sourceId), para que el saldo de contabilidad no
        quede desfasado. Si ese ingreso ya fue facturado, responde 409 en vez
        de eliminar.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AgencyClientIdParam"
        - $ref: "#/components/parameters/HostingPaymentIdParam"
      responses:
        "200":
          description: Pago de hosting eliminado (junto con su ingreso ligado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Cliente o pago de hosting no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: El ingreso ligado a este pago ya fue facturado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

