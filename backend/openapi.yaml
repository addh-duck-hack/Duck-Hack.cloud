        "200":
          description: Correo enviado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: Error SMTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /uploads/{fileName}:
    get:
      tags: [Uploads]
      summary: Obtener archivo estático subido
      operationId: getUploadedFile
      security: []
      parameters:
        - in: path
          name: fileName
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Archivo servido por Express static
        "404":
          $ref: "#/components/responses/RouteNotFound"

  /api/media/public:
    get:
      tags: [Media]
      summary: Galería pública (portafolio de trabajos)
      operationId: listPublicGallery
      security: []
      description: >
        Sin autenticación. Solo los medios marcados `inGallery` que sigan en
        disco, del más reciente al más antiguo. `?category=` filtra por
        galleryCategory sin distinguir mayúsculas; `categories` trae las
        categorías con al menos un archivo, para los filtros.
      parameters:
        - in: query
          name: category
          schema:
            type: string
      responses:
        "200":
          description: Galería
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        kind:
                          type: string
                          enum: [image, gif, video]
                        title:
                          type: string
                        altText:
                          type: string
                        category:
                          type: string
                  categories:
                    type: array
                    items:
                      type: string

  /api/media:
    get:
      tags: [Media]
      summary: Listar medios de la carpeta uploads/
      operationId: listMedia
      description: >
        Roles `super_admin`, `store_admin`, `collaborator`. Lee el directorio de uploads (fuente de verdad)
        y le cruza los metadatos guardados en la colección `Media`. Archivos sin metadatos usan su nombre
        de archivo como `title`. Ordenado del más reciente al más antiguo.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de medios
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MediaItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Media]
      summary: Subir un medio
      operationId: uploadMedia
      description: >
        JPG/PNG (re-encodeados, máx. 10MB), GIF (guardado tal cual, máx. 10MB) o MP4/WebM (validados por
        firma binaria, máx. 50MB). El tipo se decide por contenido, no por el Content-Type declarado.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                media:
                  type: string
                  format: binary
                title:
                  type: string
                  maxLength: 200
                  description: Si se omite, se usa el nombre original del archivo sin extensión.
                altText:
                  type: string
                  maxLength: 500
              required: [media]
      responses:
        "201":
          description: Medio subido
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  item:
                    $ref: "#/components/schemas/MediaItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: Archivo demasiado grande (`FILE_TOO_LARGE`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/media/{fileName}:
    parameters:
      - in: path
        name: fileName
        required: true
        schema:
          type: string
          example: media-1718282784-uuid.jpg
    put:
      tags: [Media]
      summary: Editar título y texto alternativo de un medio
      operationId: updateMedia
      description: No renombra el archivo físico — solo actualiza los metadatos (upsert en `Media`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                altText:
                  type: string
                  maxLength: 500
                inGallery:
                  type: boolean
                galleryCategory:
                  type: string
                  maxLength: 60
      responses:
        "200":
          description: Medio actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  item:
                    $ref: "#/components/schemas/MediaItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Medio no encontrado (`MEDIA_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Media]
      summary: Eliminar un medio
      operationId: deleteMedia
      description: >
        Si el archivo está referenciado por un producto, una foto de perfil o la configuración de la tienda,
        responde 409 `MEDIA_IN_USE` con los usos en `error.details`. Reintentar con `?force=true` para
        eliminarlo de todas formas (las referencias quedan apuntando a un archivo inexistente).
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: force
          schema:
            type: boolean
      responses:
        "200":
          description: Medio eliminado
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Medio no encontrado (`MEDIA_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: El medio está en uso (`MEDIA_IN_USE`); `error.details` es un arreglo de MediaUsage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/media/{fileName}/usage:
    get:
      tags: [Media]
