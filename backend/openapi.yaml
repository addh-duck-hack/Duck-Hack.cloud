  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: No autenticado o token inválido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: >
        Sin permisos para la operación: rol no autorizado (FORBIDDEN) o módulo
        no contratado por la tienda / no permitido para el rol
        (MODULE_NOT_ALLOWED, ver /api/permissions).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UserNotFound:
      description: Usuario no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    EmailAlreadyRegistered:
      description: El correo ya está registrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Demasiadas solicitudes en una ventana de tiempo
      headers:
        Retry-After:
          description: Segundos recomendados para reintentar
          schema:
            type: integer
        X-RateLimit-Limit:
          description: Límite de solicitudes para la ventana
          schema:
            type: integer
        X-RateLimit-Remaining:
          description: Solicitudes restantes en la ventana actual
          schema:
            type: integer
        X-RateLimit-Reset:
          description: Epoch en segundos cuando se reinicia la ventana
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            rateLimitExceeded:
              summary: Ejemplo de límite excedido
              value:
                ok: false
                error:
                  status: 429
                  code: RATE_LIMIT_LOGIN_EXCEEDED
                  message: Demasiados intentos de inicio de sesión. Intenta nuevamente más tarde.
                  details:
                    retryAfterSec: 120
    RouteNotFound:
      description: Ruta no encontrada
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AgencyClientNotFound:
      description: Cliente no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AgencyClientHasRelatedRecords:
      description: No se puede eliminar el cliente porque tiene pagos de hosting o deudas asociados
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    AppProfileAction:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [screen, phone, whatsapp, email, legal, url] }
        screen: { type: string, enum: [login, profile, orders, addresses, changePassword, deleteAccount, favorites, loyalty, giftCards, reviews, appointments, notifications] }
        phone: { type: string, description: "Entrada: 10 dígitos o vacío. Pública: con lada (whatsapp 52…)." }
        message: { type: string, maxLength: 300 }
        email: { type: string }
        page: { type: string, enum: [privacy, legal, returns] }
        url: { type: string, description: Solo entrada (tipo url) }
        openIn: { type: string, enum: [webview, browser] }
        title: { type: string, readOnly: true, description: Pública (legal) }
        path: { type: string, readOnly: true, description: Pública (legal), relativa al backend }
        href: { type: string, readOnly: true, description: "Pública: lo que la app abre (tel:, https://wa.me/…, mailto:, URL)" }
    AppProfileItem:
      type: object
      required: [label, action]
      properties:
        id: { type: string, maxLength: 40 }
        label: { type: string, maxLength: 60 }
        visibility: { type: string, enum: [always, auth, guest], default: always }
        action: { $ref: "#/components/schemas/AppProfileAction" }
    AppProfileGroup:
      type: object
      properties:
        id: { type: string, maxLength: 40 }
        title: { type: string, maxLength: 60 }
        items:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/AppProfileItem" }
    AppProfileInput:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/AppProfileGroup" }
        logout:
          type: object
          properties: { enabled: { type: boolean, default: true }, label: { type: string, maxLength: 40 } }
        rateApp:
          type: object
          properties:
            enabled: { type: boolean }
            label: { type: string, maxLength: 40 }
            iosAppId: { type: string, pattern: "^\\d{6,15}$" }
            androidPackage: { type: string }
    PublicAppProfile:
      type: object
      properties:
        groups:
          type: array
          items: { $ref: "#/components/schemas/AppProfileGroup" }
        logout:
          type: object
          nullable: true
          properties: { label: { type: string } }
        rateApp:
          type: object
          nullable: true
          properties:
            label: { type: string }
            iosUrl: { type: string, nullable: true }
            androidUrl: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
    WholesaleCustomerInput:
      type: object
      properties:
        businessName: { type: string, maxLength: 120 }
        contactName: { type: string }
        email: { type: string, format: email }
        phone: { type: string, description: 10 dígitos }
        address: { type: string }
        billingName: { type: string }
        billingRfc: { type: string }
        creditDays: { type: integer, minimum: 0, maximum: 365 }
        creditLimit: { type: number, nullable: true }
        discountPct: { type: number, minimum: 0, maximum: 90 }
        notes: { type: string }
        isActive: { type: boolean }
    WholesaleSaleInput:
      type: object
      properties:
        customer: { type: string }
        items:
          type: array
          items:
            type: object
            required: [product, quantity]
            properties:
              product: { type: string }
              variant: { type: string }
              quantity: { type: number, minimum: 0.001 }
              unitPrice: { type: number, description: "Opcional: catálogo − discountPct del cliente" }
        discount: { type: number, description: Descuento adicional en pesos }
        notes: { type: string }
    StoreTransactionInput:
      type: object
      properties:
        type: { type: string, enum: [income, expense] }
        amount: { type: number, minimum: 0.01 }
        date: { type: string, format: date }
        category: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 300 }
        paymentMethod: { type: string, enum: [cash, transfer, card, other, ""] }
    SupplierInput:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        contactName: { type: string }
        email: { type: string, format: email }
        phone: { type: string, description: 10 dígitos }
        rfc: { type: string }
        notes: { type: string }
        isActive: { type: boolean }
    PurchaseInput:
      type: object
      properties:
        supplier: { type: string }
        date: { type: string, format: date }
        reference: { type: string, description: Folio o factura del proveedor }
        category: { type: string, default: Compras }
        notes: { type: string }
        items:
          type: array
          items:
            type: object
            required: [quantity, unitCost]
            properties:
              product: { type: string, description: Opcional (insumo sin producto) }
              variant: { type: string }
              description: { type: string, description: Obligatoria sin producto }
              quantity: { type: number }
              unitCost: { type: number }
    PermissionModuleKey:
      type: string
      description: Módulo del panel sujeto a permisos por tienda
      enum: [panel, storeConfig, appConfig, services, appointments, reminders, products, inventory, orders, coupons, promoBanner, abandonedCart, wishlist, loyalty, reviews, media, users, agencyClients, accounting, invoices]

    StorePermissions:
      type: object
      properties:
        enabledModules:
          type: array
          description: Módulos contratados por la tienda
          items:
            $ref: "#/components/schemas/PermissionModuleKey"
        roles:
          type: object
          properties:
            store_admin:
              type: array
              items:
                $ref: "#/components/schemas/PermissionModuleKey"
            collaborator:
              type: array
              items:
                $ref: "#/components/schemas/PermissionModuleKey"
          required: [store_admin, collaborator]
      required: [enabledModules, roles]

    StorePermissionsResponse:
      allOf:
        - $ref: "#/components/schemas/StorePermissions"
        - type: object
          properties:
            updatedAt:
              type: string
              format: date-time
              nullable: true
            catalog:
              type: array
              items:
                type: object
                properties:
                  key:
                    $ref: "#/components/schemas/PermissionModuleKey"
                  label:
                    type: string
            configurableRoles:
              type: array
              items:
                type: string
            defaults:
              $ref: "#/components/schemas/StorePermissions"

    AppHome:
      type: object
      properties:
        schemaVersion:
          type: integer
          example: 1
        sections:
          type: array
          items:
            $ref: "#/components/schemas/AppHomeSection"
        updatedAt:
          type: string
          format: date-time
          nullable: true
      required: [schemaVersion, sections]

    PublicAppHome:
