# Config para la imagen nginx-unprivileged (corre como usuario nginx, uid 101).
# Escucha en 8080 porque un proceso no-root no puede abrir puertos < 1024.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No revelar la versión de nginx en headers ni páginas de error.
    server_tokens off;

    # Cabeceras de seguridad básicas para el storefront (SPA estática).
    # OJO nginx: un `add_header` dentro de un `location` descarta TODOS los
    # heredados de este bloque server. Por eso estos headers se repiten en
    # cada `location` que define su propio `add_header` (/assets/ e
    # index.html) — si no, index.html (al que cae cualquier ruta del
    # storefront) se servía sin estas cabeceras.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Assets con hash de Vite: cache larga e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        try_files $uri =404;
    }

    # BrowserRouter: cualquier ruta desconocida sirve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # No servir archivos ocultos (.env, .git, etc.) si se colaran en el build.
    location ~ /\. {
        deny all;
    }
}
