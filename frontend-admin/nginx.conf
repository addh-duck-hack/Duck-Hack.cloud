# Config para la imagen nginx-unprivileged (corre como usuario nginx, uid 101).
# Escucha en 8080 porque un proceso no-root no puede abrir puertos < 1024.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # El panel no debe indexarse ni embeberse en otros sitios.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Assets con hash de Vite: cache larga e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HashRouter: el enrutado vive en el fragmento (#/...), basta con servir
    # index.html para cualquier path que no sea un archivo real.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~ /\. {
        deny all;
    }
}
