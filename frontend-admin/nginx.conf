# Config para la imagen nginx-unprivileged (corre como usuario nginx, uid 101).
# Escucha en 8080 porque un proceso no-root no puede abrir puertos < 1024.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Content-Security-Policy del panel. script-src 'self' es lo clave: aunque
    # entrara HTML malicioso, no se ejecuta JS inyectado ni externo (el admin
    # no usa scripts inline). Se permite 'unsafe-inline' solo en estilos (React
    # y librerías los inyectan) y Google Fonts. connect-src/img-src usan https:
    # porque el origen de la API y de las imágenes cambia por tienda y este
    # nginx.conf es compartido (no se puede fijar el dominio exacto aquí).
    # Definida una vez con `set` (se hereda) y referenciada en cada bloque, ya
    # que un add_header en un location descarta los heredados (ver abajo).
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
    add_header Content-Security-Policy $csp always;

    # El panel no debe indexarse ni embeberse en otros sitios.
    # OJO nginx: un `add_header` dentro de un `location` descarta TODOS los
    # heredados de este bloque server. Por eso estos headers se repiten en
    # cada `location` que define su propio `add_header` (/assets/ e
    # index.html) — si no, index.html (al que cae cualquier ruta del panel)
    # se servía sin X-Frame-Options y el admin quedaba embebible (clickjacking).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Assets con hash de Vite: cache larga e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri =404;
    }

    # HashRouter: el enrutado vive en el fragmento (#/...), basta con servir
    # index.html para cualquier path que no sea un archivo real.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy $csp always;
    }

    location ~ /\. {
        deny all;
    }
}
